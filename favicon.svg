<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- ARTGEOrge icon: a bold "A" on a glowing arcade-violet tile, with a spark -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/>
      <stop offset=".5" stop-color="#5b4bf0"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="shine" cx=".28" cy=".16" r=".9">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dusk" cx=".8" cy="1" r=".7">
      <stop offset="0" stop-color="#ff5fa2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff5fa2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe6ff"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7c2"/>
      <stop offset="1" stop-color="#ffb21e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#dusk)"/>
  <rect width="512" height="512" rx="116" fill="url(#shine)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="6"/>
  <!-- the A: shadow, then letter (the counter is a triangle, like a play button pointing up) -->
  <path fill="#1e1060" fill-opacity=".35" fill-rule="evenodd" transform="translate(0 14)"
        d="M204 104H308L420 414H330L307 346H205L182 414H92ZM226 282H286L256 192Z"/>
  <path fill="url(#a)" fill-rule="evenodd"
        d="M204 104H308L420 414H330L307 346H205L182 414H92ZM226 282H286L256 192Z"/>
  <!-- the spark -->
  <path fill="url(#spark)" d="M404 70C410 104 420 114 454 120C420 126 410 136 404 170C398 136 388 126 354 120C388 114 398 104 404 70Z"/>
  <circle cx="452" cy="182" r="11" fill="#fff7c2"/>
</svg>
