<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Nexus Play icon: a glowing play button at the heart of an orbit. Green and purple only. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b0f5e"/>
      <stop offset=".55" stop-color="#5a1fb8"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#4ade80" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#9333ea" stop-opacity=".35"/>
      <stop offset="1" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shine" cx=".25" cy=".12" r=".85">
      <stop offset="0" stop-color="#c4a5ff" stop-opacity=".45"/>
      <stop offset=".5" stop-color="#c4a5ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9ffe6"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset=".5" stop-color="#86efac"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- a few stars -->
  <g>
    <circle cx="96" cy="112" r="5" fill="#86efac" opacity=".85"/><circle cx="410" cy="92" r="4" fill="#d8b4fe" opacity=".8"/>
    <circle cx="436" cy="300" r="3.5" fill="#86efac" opacity=".6"/><circle cx="120" cy="404" r="4" fill="#d8b4fe" opacity=".6"/>
    <circle cx="70" cy="250" r="3" fill="#d8b4fe" opacity=".5"/><circle cx="352" cy="438" r="3" fill="#86efac" opacity=".5"/>
  </g>
  <circle cx="256" cy="260" r="200" fill="url(#core)"/>
  <!-- the orbit, behind and in front of the play button -->
  <g transform="rotate(-24 256 256)">
    <ellipse cx="256" cy="256" rx="206" ry="70" fill="none" stroke="url(#ring)" stroke-width="16" stroke-opacity=".5"/>
  </g>
  <!-- the play button -->
  <path filter="url(#glow)" fill="url(#play)"
        d="M206 156C206 140 223 130 237 138L370 236C382 244 382 268 370 276L237 374C223 382 206 372 206 356Z"/>
  <!-- front half of the orbit over the button, with its nodes -->
  <g transform="rotate(-24 256 256)">
    <path d="M50 256A206 70 0 0 0 462 256" fill="none" stroke="url(#ring)" stroke-width="16" stroke-linecap="round"/>
    <circle cx="462" cy="256" r="20" fill="#c084fc" filter="url(#glow)"/>
    <circle cx="96" cy="300" r="15" fill="#22c55e" filter="url(#glow)"/>
    <circle cx="300" cy="325" r="12" fill="#bbf7d0" filter="url(#glow)"/>
  </g>
  <rect width="512" height="512" rx="116" fill="url(#shine)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#c084fc" stroke-opacity=".35" stroke-width="6"/>
</svg>
