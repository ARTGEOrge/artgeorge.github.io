<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Puffin Pass</title>
  <meta name="description" content="A one-button pixel-art game: flap a puffin between the sea stacks, grab fish, and fly from day into night." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1530; }
    body {
      font-family: 'Press Start 2P', ui-monospace, monospace; color: #fff;
      display: flex; align-items: center; justify-content: center;
      user-select: none; -webkit-user-select: none; touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    #stage { position: relative; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; }
    .hidden { display: none !important; }

    /* Pixel text: hard 1-step outline, no blur. */
    .px {
      text-shadow: 3px 0 0 #142040, -3px 0 0 #142040, 0 3px 0 #142040, 0 -3px 0 #142040,
                   3px 3px 0 #142040, -3px 3px 0 #142040, 3px -3px 0 #142040, -3px -3px 0 #142040,
                   0 6px 0 #142040;
    }

    #score {
      position: absolute; top: 7%; left: 0; right: 0; text-align: center;
      font-size: clamp(28px, 7vh, 52px); pointer-events: none;
    }
    #fishHud {
      position: absolute; top: 14px; left: 14px; font-size: 13px; pointer-events: none;
      display: flex; align-items: center; gap: 8px;
    }
    #fishHud i { width: 22px; height: 12px; display: inline-block; background: no-repeat center/contain; image-rendering: pixelated; }

    .screen {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; padding: 20px; text-align: center;
      pointer-events: none;
    }
    .logo { font-size: clamp(28px, 7.5vh, 56px); line-height: 1.15; color: #ffd84a; transform: rotate(-3deg); }
    .logo span { display: block; color: #ff8a3a; }
    .hint { font-size: clamp(10px, 1.8vh, 13px); line-height: 1.8; color: #fff; }
    .tap {
      font-size: clamp(11px, 2vh, 15px); color: #fff;
      animation: blink 1.1s steps(2, start) infinite;
    }
    @keyframes blink { to { visibility: hidden; } }
    .spacer { flex: 0 0 18vh; }

    .panel {
      pointer-events: auto;
      background: #f3e2b8; color: #3b2a1a; border: 4px solid #3b2a1a;
      box-shadow: 0 0 0 4px #fff7df, 0 0 0 8px #3b2a1a, 0 10px 0 8px rgba(0,0,0,.35);
      padding: 18px 20px; min-width: min(300px, 84vw);
      display: grid; grid-template-columns: auto 1fr; gap: 14px 18px; align-items: center;
    }
    .panel h2 { grid-column: 1 / -1; font-size: 18px; color: #e2512b; text-align: center; font-weight: 400; }
    .medal {
      grid-row: span 3; width: 64px; height: 64px; border-radius: 50%;
      border: 4px solid #3b2a1a; display: grid; place-items: center;
      background: #c9b98f; color: #3b2a1a; font-size: 9px; text-align: center; line-height: 1.4;
    }
    .medal.bronze   { background: radial-gradient(circle at 35% 30%, #f6c089, #b8692c 70%); }
    .medal.silver   { background: radial-gradient(circle at 35% 30%, #ffffff, #a9b4bf 70%); }
    .medal.gold     { background: radial-gradient(circle at 35% 30%, #fff2a8, #e2a91c 70%); }
    .medal.platinum { background: radial-gradient(circle at 35% 30%, #ffffff, #8fe0e6 55%, #6aa8d8); }
    .row { display: flex; justify-content: space-between; gap: 12px; font-size: 11px; }
    .row b { font-weight: 400; color: #e2512b; font-size: 14px; }
    .new { grid-column: 1 / -1; text-align: center; font-size: 10px; color: #fff; background: #e2512b; padding: 6px; }
    .btn {
      pointer-events: auto; font: inherit; font-size: 14px; cursor: pointer;
      color: #fff; background: #f07a2a; border: 4px solid #3b2a1a; padding: 12px 22px;
      box-shadow: inset 0 -5px 0 #b8481a, 0 5px 0 #3b2a1a;
    }
    .btn:active { transform: translateY(4px); box-shadow: inset 0 -3px 0 #b8481a, 0 1px 0 #3b2a1a; }
    .btn:focus-visible { outline: 3px solid #ffd84a; outline-offset: 3px; }

    #mute {
      position: absolute; top: 10px; right: 10px; width: 40px; height: 40px;
      font: inherit; font-size: 0; cursor: pointer; border: 3px solid #142040;
      background: rgba(255,255,255,.85); display: grid; place-items: center;
    }
    #mute svg { width: 22px; height: 22px; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>

    <div id="score" class="px hidden">0</div>
    <div id="fishHud" class="px hidden"><i id="fishIcon"></i><span id="fishN">0</span></div>

    <div id="ready" class="screen">
      <div class="logo px">PUFFIN<span>PASS</span></div>
      <div class="spacer"></div>
      <div class="tap px">TAP TO FLAP</div>
      <p class="hint px">Space, click or tap.<br />Thread the sea stacks.<br />Snap up fish on the way.</p>
      <p class="hint px" id="bestReady"></p>
    </div>

    <div id="paused" class="screen hidden">
      <div class="logo px" style="font-size:28px">PAUSED</div>
      <div class="tap px">TAP TO GO ON</div>
    </div>

    <div id="over" class="screen hidden">
      <div class="panel" role="dialog" aria-label="Run over">
        <h2>SPLASH!</h2>
        <div class="medal" id="medal">No<br>medal</div>
        <div class="row"><span>Score</span><b id="oScore">0</b></div>
        <div class="row"><span>Best</span><b id="oBest">0</b></div>
        <div class="row"><span>Fish</span><b id="oFish">0</b></div>
        <div class="new hidden" id="newBest">NEW BEST!</div>
      </div>
      <button class="btn" id="retry" type="button">FLY AGAIN</button>
      <p class="hint px" id="nextMedal"></p>
    </div>

    <button id="mute" type="button" aria-label="Mute sound" aria-pressed="false"></button>
  </div>

<script>
(function () {
  'use strict';

  // ------------------------------------------------------------- setup
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var stage = document.getElementById('stage');
  var H = 288, W = 180, SEA = H - 36;

  var fg = document.createElement('canvas'), fx = fg.getContext('2d');
  var sky = document.createElement('canvas'), sx = sky.getContext('2d');

  function store(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) {}
    return null;
  }
  var best = parseInt(store('puffinpass.best'), 10) || 0;
  var muted = store('puffinpass.muted') === '1';

  // ---------------------------------------------------------- palettes
  // Day, sunset, night. Colors are blended as the score climbs.
  function hex(h) { return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)]; }
  var PAL = [
    { top: hex('#3f9fe4'), mid: hex('#79c4f0'), hz: hex('#cdeef8'), cliff: hex('#8fb3c6'), cliff2: hex('#a9c8d6'), cloud: hex('#ffffff'), tint: hex('#000000'), ta: 0,   night: 0 },
    { top: hex('#33377f'), mid: hex('#d46f80'), hz: hex('#ffc47c'), cliff: hex('#7c4f6e'), cliff2: hex('#a8657c'), cloud: hex('#ffd6c4'), tint: hex('#7a2a50'), ta: .2, night: .25 },
    { top: hex('#080c26'), mid: hex('#18234f'), hz: hex('#33437a'), cliff: hex('#1c2442'), cliff2: hex('#263056'), cloud: hex('#4a5888'), tint: hex('#0c1440'), ta: .45, night: 1 }
  ];
  function mix(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function rgb(c, a) {
    return a === undefined ? 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')'
                           : 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + a + ')';
  }
  function palAt(p) {
    var i = Math.floor(p) % 3, j = (i + 1) % 3, t = p - Math.floor(p);
    t = t * t * (3 - 2 * t);
    var A = PAL[i], B = PAL[j], o = {};
    for (var k in A) o[k] = typeof A[k] === 'number' ? A[k] + (B[k] - A[k]) * t : mix(A[k], B[k], t);
    return o;
  }

  // ------------------------------------------------------------ sprites
  // 16x12 puffin, facing right. Wings are drawn per frame on top.
  var PUFF = [
    '......kkkkk.....',
    '.....kwwwwwky...',
    '.....kwwwekyoo..',
    '..kkkkwwwwkyorr.',
    '.kkkkkwwwwkyoor.',
    'kkkkkkkwwkkyo...',
    'kkkkkkkwwwww....',
    '.kkkkkkwwwwww...',
    '..kkkkkwwwwwss..',
    '...kkkswwwwss...',
    '....ff.ssss.....',
    '...ff..ff.......'
  ];
  var PCOL = { k: '#1d1d2b', w: '#f6f2e8', s: '#cbc3b4', e: '#000000', y: '#ffd23c', o: '#ff7a1a', r: '#e2412b', f: '#ff8a2a', g: '#3a3a52' };
  var WINGS = [
    [[2, 1, 4, 1], [1, 2, 5, 2], [0, 0, 3, 1]],          // up
    [[1, 5, 6, 2], [0, 6, 2, 1]],                        // level
    [[2, 7, 5, 2], [3, 9, 3, 1], [4, 10, 1, 1]]          // down
  ];
  function sprite(rows, cols, extra) {
    var c = document.createElement('canvas'); c.width = rows[0].length; c.height = rows.length;
    var x = c.getContext('2d');
    rows.forEach(function (r, y) {
      for (var i = 0; i < r.length; i++) if (r[i] !== '.') { x.fillStyle = cols[r[i]]; x.fillRect(i, y, 1, 1); }
    });
    if (extra) extra(x);
    return c;
  }
  var frames = WINGS.map(function (wing) {
    return sprite(PUFF, PCOL, function (x) {
      x.fillStyle = PCOL.g; wing.forEach(function (r) { x.fillRect(r[0], r[1], r[2], r[3]); });
      x.fillStyle = '#55557a'; x.fillRect(wing[0][0], wing[0][1], wing[0][2], 1);
    });
  });
  var FISH = sprite([
    '..bbbb...b',
    '.bllllb.bb',
    'bleblllbbb',
    '.bllllb.bb',
    '..bbbb...b'
  ], { b: '#2c6e9e', l: '#9fd8f2', e: '#0b2030' });
  document.getElementById('fishIcon').style.backgroundImage = 'url(' + FISH.toDataURL() + ')';

  // --------------------------------------------------------------- sound
  var ac = null, noiseBuf = null;
  function audio() {
    if (!ac) {
      try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
      noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
    return ac;
  }
  function tone(f1, f2, dur, type, vol, delay) {
    if (muted || !audio()) return;
    var t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(f1, f2, dur, vol, kind) {
    if (muted || !audio()) return;
    var t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = kind || 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(ac.destination); s.start(t); s.stop(t + dur);
  }
  var sfx = {
    flap:   function () { noise(900, 2400, 0.09, 0.35); },
    point:  function () { tone(988, 988, 0.06, 'square', 0.05); tone(1319, 1319, 0.12, 'square', 0.05, 0.06); },
    fish:   function () { tone(1400, 2200, 0.1, 'sine', 0.12); tone(2100, 3000, 0.12, 'sine', 0.08, 0.07); },
    hit:    function () { tone(220, 60, 0.28, 'square', 0.12); noise(1200, 200, 0.2, 0.4, 'lowpass'); },
    splash: function () { noise(2400, 300, 0.45, 0.5, 'lowpass'); }
  };

  // --------------------------------------------------------------- world
  var STATE = 'ready';               // ready | play | dying | over
  var paused = false;
  var t = 0, groundX = 0, palP = 0, palShown = -1, pal = palAt(0);
  var bird, stacks, fish, parts, score, fishN, flash, overAt, lastGap;
  var clouds = [], stars = [], ridge = [];

  function rand(a, b) { return a + Math.random() * (b - a); }
  (function seedScenery() {
    for (var i = 0; i < 7; i++) clouds.push({ x: rand(0, 520), y: rand(16, 120), r: rand(5, 10), n: 2 + (Math.random() * 3 | 0) });
    for (i = 0; i < 70; i++) stars.push({ x: Math.random(), y: Math.random() * 0.62, b: Math.random() < 0.15, p: rand(0, 6) });
    for (i = 0; i < 256; i++) {
      ridge.push(18 + 10 * Math.sin(i / 256 * Math.PI * 4) + 6 * Math.sin(i / 256 * Math.PI * 10 + 1.3) + 3 * Math.sin(i / 256 * Math.PI * 26));
    }
    for (i = 150; i < 214; i++) ridge[i] = Math.max(ridge[i], 30 - Math.abs(i - 182) * 0.2);   // headland under the lighthouse
  })();

  function reset() {
    bird = { x: 0, y: H * 0.42, vy: 0, a: 0, flapT: 1, frame: 1 };
    stacks = []; fish = []; parts = [];
    score = 0; fishN = 0; flash = 0; lastGap = SEA * 0.5; palP = 0;
    placeBird();
  }
  function placeBird() { bird.x = Math.round(Math.min(W * 0.3, 72)); }

  function speed() { return 74 + Math.min(score, 45) * 0.55; }
  function gapSize() { return Math.max(64, 84 - score * 0.45); }

  function spawn(x) {
    var g = gapSize(), m = 26;
    var lo = Math.max(m + g / 2, lastGap - 72), hi = Math.min(SEA - m - g / 2, lastGap + 72);
    var c = Math.round(rand(lo, hi));
    lastGap = c;
    var s = { x: x, w: 30, gt: Math.round(c - g / 2), gb: Math.round(c + g / 2), passed: false, seed: Math.random() * 1000 | 0 };
    stacks.push(s);
    if (Math.random() < 0.38) fish.push({ x: x + s.w / 2, y: c, ph: rand(0, 6), got: false });
  }

  function flap() {
    bird.vy = -250; bird.flapT = 0; sfx.flap();
    for (var i = 0; i < 2; i++) parts.push({ x: bird.x - 6, y: bird.y + rand(-2, 3), vx: rand(-40, -20), vy: rand(-10, 20), life: 0.35, max: 0.35, c: '#ffffff', s: 1, g: 0 });
  }

  // ---------------------------------------------------------------- input
  var $ = function (id) { return document.getElementById(id); };
  function show(id, on) { $(id).classList.toggle('hidden', !on); }

  function press(e) {
    if (e && e.target && e.target.closest && e.target.closest('button')) return;
    audio();
    if (paused) { paused = false; show('paused', false); return; }
    if (STATE === 'ready') { STATE = 'play'; show('ready', false); show('score', true); show('fishHud', true); flap(); }
    else if (STATE === 'play') flap();
    else if (STATE === 'over' && performance.now() - overAt > 650) restart();
  }
  function restart() {
    reset(); STATE = 'ready'; show('over', false); show('ready', true); show('score', false); show('fishHud', false);
    $('score').textContent = '0'; $('fishN').textContent = '0';
    $('bestReady').textContent = best ? 'BEST ' + best : '';
  }
  canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); press(e); });
  $('ready').addEventListener('pointerdown', press);
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') {
      if (e.target.tagName === 'BUTTON' && e.code === 'Enter') return;
      e.preventDefault(); if (!e.repeat) press(e);
    } else if (e.code === 'KeyP' || e.code === 'Escape') {
      if (STATE === 'play' && !paused) { paused = true; show('paused', true); }
    } else if (e.code === 'KeyM') toggleMute();
  });
  $('retry').addEventListener('click', function () { audio(); restart(); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && STATE === 'play') { paused = true; show('paused', true); }
  });
  $('paused').style.pointerEvents = 'auto';
  $('paused').addEventListener('pointerdown', press);

  function drawMuteIcon() {
    $('mute').innerHTML = '<svg viewBox="0 0 11 11" shape-rendering="crispEdges" aria-hidden="true"><path fill="#142040" d="M1 4h2v3H1zM3 3h1v5H3zM4 2h1v7H4zM5 1h1v9H5z"/>' +
      (muted ? '<path fill="#e2412b" d="M7 3h1v1H7zM10 3h1v1h-1zM8 4h1v1H8zM9 4h1v1H9zM8 5h2v1H8zM8 6h1v1H8zM9 6h1v1H9zM7 7h1v1H7zM10 7h1v1h-1z"/>'
             : '<path fill="#142040" d="M7 4h1v3H7zM9 2h1v1H9zM10 3h1v5h-1zM9 8h1v1H9z"/>') + '</svg>';
    $('mute').setAttribute('aria-pressed', muted ? 'true' : 'false');
    $('mute').setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
  }
  function toggleMute() { muted = !muted; store('puffinpass.muted', muted ? '1' : '0'); drawMuteIcon(); }
  $('mute').addEventListener('click', toggleMute);
  drawMuteIcon();

  // --------------------------------------------------------------- layout
  function resize() {
    var vw = window.innerWidth, vh = window.innerHeight;
    W = Math.round(Math.min(480, Math.max(162, vw / vh * H)));
    canvas.width = fg.width = sky.width = W;
    canvas.height = fg.height = sky.height = H;
    var s = Math.min(vw / W, vh / H);
    canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
    stage.style.width = canvas.style.width; stage.style.height = canvas.style.height;
    ctx.imageSmoothingEnabled = false; fx.imageSmoothingEnabled = false;
    palShown = -1;
    if (bird) placeBird();
  }
  window.addEventListener('resize', resize);

  // ---------------------------------------------------------------- update
  function hitRect(cx, cy, r, x, y, w, h) {
    var nx = Math.max(x, Math.min(cx, x + w)), ny = Math.max(y, Math.min(cy, y + h));
    return (cx - nx) * (cx - nx) + (cy - ny) * (cy - ny) < r * r;
  }

  function die() {
    STATE = 'dying'; flash = 1; sfx.hit();
    for (var i = 0; i < 14; i++) parts.push({ x: bird.x, y: bird.y, vx: rand(-90, 60), vy: rand(-120, 40), life: rand(.5, 1), max: 1, c: i % 3 ? '#1d1d2b' : '#f6f2e8', s: 2, g: 260 });
    if (bird.vy < 0) bird.vy = 0;
  }

  function splash() {
    sfx.splash();
    for (var i = 0; i < 22; i++) parts.push({ x: bird.x + rand(-4, 4), y: SEA, vx: rand(-60, 60), vy: rand(-170, -60), life: rand(.5, .9), max: .9, c: i % 2 ? '#ffffff' : '#9fd8f2', s: i % 4 ? 1 : 2, g: 420 });
    STATE = 'over'; overAt = performance.now();
    setTimeout(showOver, 550);
  }

  function showOver() {
    var isNew = score > best;
    if (isNew) { best = score; store('puffinpass.best', String(best)); }
    $('oScore').textContent = score; $('oBest').textContent = best; $('oFish').textContent = fishN;
    show('newBest', isNew && score > 0);
    var m = $('medal'), tiers = [[100, 'platinum', 'Plat'], [50, 'gold', 'Gold'], [25, 'silver', 'Silver'], [10, 'bronze', 'Bronze']];
    m.className = 'medal'; m.innerHTML = 'No<br>medal';
    var next = 10;
    for (var i = 0; i < tiers.length; i++) if (score >= tiers[i][0]) { m.classList.add(tiers[i][1]); m.textContent = tiers[i][2]; next = i ? tiers[i - 1][0] : 0; break; }
    if (score < 10) next = 10;
    $('nextMedal').textContent = next ? 'NEXT MEDAL AT ' + next : 'TOP MEDAL!';
    show('score', false); show('fishHud', false); show('over', true);
    $('retry').focus({ preventScroll: true });
  }

  function update(dt) {
    t += dt;
    var moving = STATE === 'ready' || STATE === 'play';
    var v = speed();
    if (moving) groundX += v * dt;
    clouds.forEach(function (c) { c.x -= (moving ? v * 0.08 : 3) * dt; if (c.x < -40) { c.x = W + rand(10, 80); c.y = rand(16, 120); } });

    var target = Math.floor(score / 15);
    if (palP < target) palP = Math.min(target, palP + dt * 0.35);
    pal = palAt(palP);

    bird.flapT += dt;
    bird.frame = bird.flapT < 0.24 ? [0, 1, 2][Math.floor(bird.flapT / 0.08) % 3] : 1;

    if (STATE === 'ready') {
      bird.y = H * 0.42 + Math.sin(t * 5) * 4; bird.a = 0;
      bird.frame = [0, 1, 2, 1][Math.floor(t * 8) % 4];
    } else if (STATE === 'play' || STATE === 'dying') {
      bird.vy = Math.min(bird.vy + 900 * dt, 420);
      bird.y += bird.vy * dt;
      if (bird.y < 2) { bird.y = 2; bird.vy = 0; }
      var goal = bird.vy < 0 ? -0.42 : Math.min(1.35, -0.42 + bird.vy / 260);
      bird.a += (goal - bird.a) * Math.min(1, dt * (bird.vy < 0 ? 18 : 7));
      if (STATE === 'dying') bird.frame = 1;
      if (bird.y + 5 >= SEA) { bird.y = SEA - 2; if (STATE === 'play') { flash = 1; sfx.hit(); } splash(); }
    }

    if (STATE === 'play') {
      if (!stacks.length || stacks[stacks.length - 1].x < W - 118) spawn(stacks.length ? stacks[stacks.length - 1].x + 118 : W + 50);
      for (var i = stacks.length - 1; i >= 0; i--) {
        var s = stacks[i]; s.x -= v * dt;
        if (s.x + s.w + 4 < 0) { stacks.splice(i, 1); continue; }
        if (!s.passed && s.x + s.w < bird.x - 4) {
          s.passed = true; score++; $('score').textContent = score; sfx.point();
        }
        var r = 5;
        if (hitRect(bird.x, bird.y, r, s.x, -10, s.w, s.gt + 10) || hitRect(bird.x, bird.y, r, s.x - 2, s.gt - 5, s.w + 4, 5) ||
            hitRect(bird.x, bird.y, r, s.x, s.gb, s.w, SEA - s.gb) || hitRect(bird.x, bird.y, r, s.x - 2, s.gb, s.w + 4, 5)) { die(); break; }
      }
      for (i = fish.length - 1; i >= 0; i--) {
        var f = fish[i]; f.x -= v * dt;
        if (f.x < -12) { fish.splice(i, 1); continue; }
        var fy = f.y + Math.sin(t * 4 + f.ph) * 6;
        if (!f.got && Math.abs(f.x - bird.x) < 10 && Math.abs(fy - bird.y) < 9) {
          f.got = true; fishN++; $('fishN').textContent = fishN; sfx.fish();
          for (var k = 0; k < 10; k++) parts.push({ x: f.x, y: fy, vx: rand(-60, 60), vy: rand(-70, 40), life: .45, max: .45, c: k % 2 ? '#ffe46b' : '#ffffff', s: 1, g: 0 });
        }
      }
    }

    for (i = parts.length - 1; i >= 0; i--) {
      var p = parts[i]; p.life -= dt;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    }
    flash = Math.max(0, flash - dt * 4);
  }

  // ------------------------------------------------------------------ draw
  function renderSky() {
    var P = pal;
    sx.clearRect(0, 0, W, H);
    var band = 6, rows = Math.ceil(SEA / band);
    for (var b = 0; b < rows; b++) {
      var f = b / (rows - 1), c = f < 0.55 ? mix(P.top, P.mid, f / 0.55) : mix(P.mid, P.hz, (f - 0.55) / 0.45);
      sx.fillStyle = rgb(c); sx.fillRect(0, b * band, W, band);
      if (b) {                                      // checker dither on each band seam
        var f0 = (b - 1) / (rows - 1), c0 = f0 < 0.55 ? mix(P.top, P.mid, f0 / 0.55) : mix(P.mid, P.hz, (f0 - 0.55) / 0.45);
        sx.fillStyle = rgb(c0);
        for (var x = b % 2; x < W; x += 2) sx.fillRect(x, b * band, 1, 1);
      }
    }
    palShown = palP;
  }

  function px(c, x, y, w, h) { c.fillRect(Math.round(x), Math.round(y), w, h); }

  function drawBackdrop() {
    var P = pal, n = P.night;
    if (Math.abs(palShown - palP) > 0.01 || palShown < 0) renderSky();
    ctx.drawImage(sky, 0, 0);

    // stars
    if (n > 0.05) {
      stars.forEach(function (s) {
        var tw = s.b ? 0.6 + 0.4 * Math.sin(t * 3 + s.p) : 1;
        ctx.fillStyle = 'rgba(255,255,240,' + (n * tw).toFixed(2) + ')';
        px(ctx, s.x * W, s.y * SEA, s.b ? 2 : 1, s.b ? 2 : 1);
      });
    }
    // sun sinks through sunset, moon rises for night
    var sunA = 1 - n, sunY = 46 + Math.min(1, palP % 3) * 70;
    if (sunA > 0.02 && palP % 3 < 1.9) {
      ctx.globalAlpha = sunA;
      disc(ctx, W - 46, sunY, 13, '#ffe58a'); disc(ctx, W - 46, sunY, 10, '#fff6c8');
      ctx.globalAlpha = 1;
    }
    if (n > 0.3) {
      ctx.globalAlpha = Math.min(1, (n - 0.3) / 0.5);
      disc(ctx, W - 50, 44, 11, '#e8ecf6'); disc(ctx, W - 45, 41, 9, rgb(P.top));
      ctx.globalAlpha = 1;
    }
    // clouds
    ctx.fillStyle = rgb(P.cloud, 0.92);
    clouds.forEach(function (c) {
      for (var i = 0; i < c.n; i++) blob(ctx, c.x + i * c.r * 1.3, c.y - (i % 2) * c.r * 0.5, c.r * (i % 2 ? 1.1 : 0.85));
      ctx.fillRect(Math.round(c.x - c.r * 0.6), Math.round(c.y), Math.round(c.r * (c.n * 1.3 + 0.6)), Math.round(c.r * 0.6));
    });
    // far cliffs with a lighthouse
    var off = groundX * 0.18;
    for (var x = 0; x < W; x += 2) {
      var i = Math.floor((x + off) / 2) % 256, h = ridge[i];
      ctx.fillStyle = rgb(P.cliff2); ctx.fillRect(x, SEA - h - 6, 2, h + 6);
    }
    var off2 = groundX * 0.3;
    for (x = 0; x < W; x += 2) {
      var j = Math.floor((x + off2) / 2 + 97) % 256, h2 = ridge[j] * 0.7;
      ctx.fillStyle = rgb(P.cliff); ctx.fillRect(x, SEA - h2, 2, h2);
    }
    var lhX = Math.round(((182 * 2 - off) % 512 + 512) % 512);
    if (lhX < W + 20) lighthouse(lhX, SEA - ridge[182] - 6, n);
  }

  function lighthouse(x, base, n) {
    var P = pal;
    if (n > 0.2) {                                    // sweeping beam at dusk and night
      var sw = Math.sin(t * 1.6), dir = sw > 0 ? 1 : -1, len = 60 + Math.abs(sw) * 70;
      ctx.fillStyle = 'rgba(255,240,170,' + (0.22 * n).toFixed(2) + ')';
      ctx.beginPath(); ctx.moveTo(x, base - 21); ctx.lineTo(x + dir * len, base - 30); ctx.lineTo(x + dir * len, base - 12); ctx.closePath(); ctx.fill();
    }
    var dark = mix([240, 240, 240], P.cliff, 0.35), red = mix([214, 64, 50], P.cliff, 0.35);
    for (var y = 0; y < 18; y++) {
      var w = 6 - Math.floor(y / 9);
      ctx.fillStyle = rgb(Math.floor(y / 4) % 2 ? red : dark);
      ctx.fillRect(x - Math.floor(w / 2), base - y - 1, w, 1);
    }
    ctx.fillStyle = rgb(mix([40, 40, 50], P.cliff, 0.3)); ctx.fillRect(x - 3, base - 19, 6, 1); ctx.fillRect(x - 2, base - 24, 4, 1);
    ctx.fillStyle = n > 0.2 ? '#fff3a0' : rgb(mix([255, 230, 140], P.cliff, 0.3)); ctx.fillRect(x - 2, base - 23, 4, 4);
  }

  function disc(c, cx, cy, r, col) {
    c.fillStyle = col;
    for (var y = -r; y <= r; y++) { var w = Math.round(Math.sqrt(r * r - y * y)); c.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2, 1); }
  }
  function blob(c, cx, cy, r) {
    r = Math.round(r);
    for (var y = -r; y <= 0; y++) { var w = Math.round(Math.sqrt(r * r - y * y)); c.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2, 1); }
  }

  // Deterministic per-stack noise so tufts and cracks don't flicker.
  function hash(a, b) { var h = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return h - Math.floor(h); }

  var ROCK = { hi: '#a3917f', mid: '#7d6c5e', lo: '#594b41', deep: '#3e342e', moss: '#5fae3b', moss2: '#3c8a2c', wet: '#3b4a52' };

  function drawStack(c, s) {
    var x = Math.round(s.x), w = s.w, R = ROCK;
    // ---- lower stack, rising from the sea
    var top = s.gb, bot = SEA + 4;
    c.fillStyle = R.mid; c.fillRect(x, top, w, bot - top);
    c.fillStyle = R.hi; c.fillRect(x, top, 3, bot - top); c.fillRect(x + 3, top, 1, bot - top);
    c.fillStyle = R.lo; c.fillRect(x + w - 6, top, 6, bot - top);
    c.fillStyle = R.deep; c.fillRect(x + w - 2, top, 2, bot - top);
    for (var y = top + 11, k = 0; y < SEA - 4; y += 10, k++) {   // strata
      var o = Math.floor(hash(s.seed, k) * 8);
      c.fillStyle = R.lo; c.fillRect(x + 4 + o, y, w - 12 - o, 1);
      c.fillStyle = R.hi; c.fillRect(x + 4 + o, y + 1, Math.max(2, w - 18 - o), 1);
      if (hash(k, s.seed) > 0.5) { c.fillStyle = R.deep; c.fillRect(x + 8 + o, y + 2, 1, 3); }
    }
    for (k = 0; k < 3; k++) {                         // guano streaks from nesting birds
      var gx = x + 6 + Math.floor(hash(s.seed + 7, k) * (w - 12));
      c.fillStyle = '#e9e4d6'; c.fillRect(gx, top + 5, 1, 4 + Math.floor(hash(k, s.seed + 3) * 9));
    }
    c.fillStyle = R.wet; c.fillRect(x, SEA - 6, w, 6);                // wet band at the waterline
    c.fillStyle = '#c9c2b0';
    for (k = 0; k < 6; k++) c.fillRect(x + 2 + Math.floor(hash(s.seed, k + 20) * (w - 4)), SEA - 6 + Math.floor(hash(k + 20, s.seed) * 5), 1, 1);
    // lip and moss cap
    c.fillStyle = R.hi; c.fillRect(x - 2, top, w + 4, 5);
    c.fillStyle = R.lo; c.fillRect(x - 2, top + 4, w + 4, 1);
    c.fillStyle = R.moss2; c.fillRect(x - 2, top - 1, w + 4, 3);
    c.fillStyle = R.moss; c.fillRect(x - 2, top - 2, w + 4, 2);
    for (k = 0; k < 7; k++) {
      var tx = x - 1 + Math.floor(hash(s.seed, k + 40) * (w + 2)), th = 1 + Math.floor(hash(k + 40, s.seed) * 3);
      c.fillRect(tx, top - 2 - th, 1, th);
    }
    if (hash(s.seed, 99) > 0.55) {                    // a tiny flower
      var fxp = x + 4 + Math.floor(hash(s.seed, 98) * (w - 8));
      c.fillStyle = '#ff9fc4'; c.fillRect(fxp, top - 4, 1, 1); c.fillStyle = '#fff'; c.fillRect(fxp + 1, top - 5, 1, 1);
    }

    // ---- upper overhang, hanging from the cliffs above
    var gt = s.gt;
    c.fillStyle = R.mid; c.fillRect(x, 0, w, gt);
    c.fillStyle = R.hi; c.fillRect(x, 0, 3, gt);
    c.fillStyle = R.lo; c.fillRect(x + w - 6, 0, 6, gt);
    c.fillStyle = R.deep; c.fillRect(x + w - 2, 0, 2, gt);
    for (y = gt - 14, k = 0; y > 0; y -= 10, k++) {
      o = Math.floor(hash(s.seed + 5, k) * 8);
      c.fillStyle = R.lo; c.fillRect(x + 4 + o, y, w - 12 - o, 1);
      c.fillStyle = R.hi; c.fillRect(x + 4 + o, y + 1, Math.max(2, w - 18 - o), 1);
    }
    c.fillStyle = R.lo; c.fillRect(x - 2, gt - 5, w + 4, 5);
    c.fillStyle = R.hi; c.fillRect(x - 2, gt - 5, w + 4, 1);
    c.fillStyle = R.deep; c.fillRect(x - 2, gt - 1, w + 4, 1);
    for (k = 0; k < 5; k++) {                          // drip teeth and a falling droplet
      var dx = x + Math.floor(hash(s.seed, k + 60) * (w - 2)), dh = 1 + Math.floor(hash(k + 60, s.seed) * 3);
      c.fillStyle = R.deep; c.fillRect(dx, gt, 2, dh);
    }
    var dropT = (t * 0.7 + hash(s.seed, 1)) % 1;
    if (dropT < 0.5) { c.fillStyle = '#9fd8f2'; c.fillRect(x + 6 + Math.floor(hash(s.seed, 2) * (w - 12)), gt + 1 + Math.floor(dropT * 30), 1, 2); }
  }

  function drawSea(c) {
    var P = pal;
    c.fillStyle = '#3a8fd0'; c.fillRect(0, SEA, W, H - SEA);
    c.fillStyle = '#2f78b8'; c.fillRect(0, SEA + 9, W, H - SEA);
    c.fillStyle = '#25609c'; c.fillRect(0, SEA + 20, W, H - SEA);
    c.fillStyle = '#6fbde8'; c.fillRect(0, SEA, W, 2);
    // three layers of crests, each scrolling at its own speed
    var rows = [[SEA, 1, 22, 6, '#ffffff'], [SEA + 6, 0.8, 30, 4, '#bfe6fb'], [SEA + 14, 0.6, 38, 5, '#8fcaee'], [SEA + 25, 0.45, 46, 6, '#5fa6d8']];
    rows.forEach(function (r) {
      c.fillStyle = r[4];
      var off = (groundX * r[1]) % r[2];
      for (var x = -off; x < W; x += r[2]) {
        c.fillRect(Math.round(x), r[0], r[3], 1);
        c.fillRect(Math.round(x + 1), r[0] + 1, r[3] - 2, 1);
      }
    });
    // foam ring round each stack
    c.fillStyle = '#ffffff';
    stacks.forEach(function (s) {
      var bob = Math.floor((t * 6 + s.seed) % 2);
      c.fillRect(Math.round(s.x) - 3 - bob, SEA - 1, 3, 2); c.fillRect(Math.round(s.x) + s.w + bob, SEA - 1, 3, 2);
      c.fillRect(Math.round(s.x) + 2, SEA + 1, s.w - 4, 1);
    });
    // moon or sun glitter on the water
    if (P.night > 0.3 || palP % 3 > 0.4) {
      c.fillStyle = 'rgba(255,245,200,' + (0.5 * Math.max(P.night, 0.6)).toFixed(2) + ')';
      for (var i = 0; i < 9; i++) {
        var gy = SEA + 3 + i * 3, gw = 2 + ((i * 7 + Math.floor(t * 5)) % 5);
        c.fillRect(Math.round(W - 48 - gw / 2 + Math.sin(t * 2 + i) * 3), gy, gw, 1);
      }
    }
  }

  function drawBird(c) {
    c.save();
    c.translate(Math.round(bird.x), Math.round(bird.y));
    c.rotate(bird.a);
    c.drawImage(frames[bird.frame], -8, -6);
    c.restore();
  }

  function draw() {
    drawBackdrop();

    fx.clearRect(0, 0, W, H);
    stacks.forEach(function (s) { drawStack(fx, s); });
    fish.forEach(function (f) {
      if (f.got) return;
      var fy = Math.round(f.y + Math.sin(t * 4 + f.ph) * 6);
      fx.globalAlpha = 0.25 + 0.2 * Math.sin(t * 6 + f.ph);
      fx.fillStyle = '#fff6b0'; fx.fillRect(Math.round(f.x) - 7, fy - 1, 14, 5); fx.fillRect(Math.round(f.x) - 4, fy - 3, 8, 9);
      fx.globalAlpha = 1;
      fx.drawImage(FISH, Math.round(f.x) - 5, fy - 2);
    });
    drawSea(fx);
    if (STATE !== 'over') drawBird(fx);
    parts.forEach(function (p) {
      fx.globalAlpha = Math.max(0, Math.min(1, p.life / p.max * 1.5));
      fx.fillStyle = p.c; fx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
    });
    fx.globalAlpha = 1;
    if (pal.ta > 0.01) {                              // dusk and night tint, only over the foreground
      fx.globalCompositeOperation = 'source-atop';
      fx.fillStyle = rgb(pal.tint, pal.ta.toFixed(2)); fx.fillRect(0, 0, W, H);
      fx.globalCompositeOperation = 'source-over';
    }
    ctx.drawImage(fg, 0, 0);

    if (flash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + (flash * 0.8).toFixed(2) + ')'; ctx.fillRect(0, 0, W, H); }
  }

  // ------------------------------------------------------------------ loop
  var last = performance.now(), acc = 0, STEP = 1 / 120;
  function frame(now) {
    var dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (!paused) {
      acc += dt;
      while (acc >= STEP) { update(STEP); acc -= STEP; }
    }
    draw();
    requestAnimationFrame(frame);
  }

  resize();
  reset();
  $('bestReady').textContent = best ? 'BEST ' + best : '';
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
