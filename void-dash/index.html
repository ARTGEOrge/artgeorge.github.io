<body>
<canvas id="gl"></canvas>
<div id="hud" class="hidden">
  <div id="lvl">LEVEL 1</div>
  <div id="score" class="neon">0</div>
  <div id="best"></div>
  <div id="msg" class="neon"></div>
  <div id="tip">MOVE THE MOUSE · ARROWS / WASD · DRAG ON TOUCH SCREENS</div>
</div>
<button id="mute" type="button" aria-label="Mute sound">🔊</button>
<div id="title" class="screen">
  <div class="logo neon">VOID<span>DASH</span></div>
  <p class="tag">You are a cube in the void. Walls are coming, each with a way through. Line yourself up with the hole and slip past. Every ten walls the colour shifts and the speed climbs.</p>
  <button class="btn" id="play" type="button">PLAY</button>
</div>
<div id="over" class="screen hidden">
  <div class="box" role="dialog" aria-label="Run over">
    <h2 class="neon">SHATTERED</h2>
    <div class="grid"><span>WALLS</span><b id="oScore">0</b><span>LEVEL</span><b id="oLvl">1</b><span>BEST</span><b id="oBest">0</b></div>
  </div>
  <button class="btn" id="again" type="button">RETRY</button>
</div>
<div id="paused" class="screen hidden"><div class="logo neon" style="font-size:54px">PAUSED</div><button class="btn" id="resume" type="button">RESUME</button></div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);

// ---------------------------------------------------------------- renderer + glow
const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#020205'); scene.fog = new THREE.Fog('#020205', 30, 120);
const camera = new THREE.PerspectiveCamera(70, 1, 0.1, 300);
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth / 2, innerHeight / 2), 0.85, 0.35, 0.25);
composer.addPass(bloom); composer.addPass(new OutputPass());
function resize() { renderer.setSize(innerWidth, innerHeight, false); composer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.fov = camera.aspect < 0.8 ? 88 : 70; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// ---------------------------------------------------------------- palette (shifts every 10 walls)
const THEMES = ['#2ff3ff', '#ff3df0', '#7dff3a', '#ffae2f', '#9a6bff', '#ff3b5c', '#3dffb8', '#ffffff'];
const glow = new THREE.MeshBasicMaterial({ color: THEMES[0], toneMapped: false });
const glowSoft = new THREE.LineBasicMaterial({ color: THEMES[0], transparent: true, opacity: 0.13, toneMapped: false });
const glowCube = new THREE.MeshBasicMaterial({ color: '#dffcff', toneMapped: false });
const black = new THREE.MeshBasicMaterial({ color: '#000000' });
let themeCol = new THREE.Color(THEMES[0]), themeTarget = new THREE.Color(THEMES[0]);

// neon edges: 12 thin bars around a box, so lines are thick enough to glow
const bar = new THREE.BoxGeometry(1, 1, 1);
function neonBox(w, h, d, t, mat) {

  for (const x of [-w / 2, w / 2]) for (const y of [-h / 2, h / 2]) add(x, y, 0, t, t, d + t);

}

// ---------------------------------------------------------------- tunnel
const COLS = 9, ROWS = 6, X0 = -COLS / 2, Y0 = -ROWS / 2;          // play area: x -4.5..4.5, y -3..3
const tunnel = new THREE.Group(); scene.add(tunnel);
{
  const pts = [], L = 160;
  for (let z = 0; z >= -L; z -= 4) {               // ribs around the tunnel every 4 units
    pts.push(X0 - 0.5, Y0 - 0.5, z, -X0 + 0.5, Y0 - 0.5, z, -X0 + 0.5, Y0 - 0.5, z, -X0 + 0.5, -Y0 + 0.5, z, -X0 + 0.5, -Y0 + 0.5, z, X0 - 0.5, -Y0 + 0.5, z, X0 - 0.5, -Y0 + 0.5, z, X0 - 0.5, Y0 - 0.5, z);
  }
  for (let x = X0; x <= -X0 + 0.01; x += 1.5) pts.push(x, Y0 - 0.5, 0, x, Y0 - 0.5, -L);   // floor rails
  for (let y = Y0; y <= -Y0 + 0.01; y += 1.5) pts.push(X0 - 0.5, y, 0, X0 - 0.5, y, -L, -X0 + 0.5, y, 0, -X0 + 0.5, y, -L);
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  tunnel.add(new THREE.LineSegments(geo, glowSoft));
}
// starfield far away
{
  const p = []; for (let i = 0; i < 1500; i++) { const a = rand(0, Math.PI * 2), r = rand(25, 90); p.push(Math.cos(a) * r, Math.sin(a) * r, rand(-250, 0)); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  var stars = new THREE.Points(g, new THREE.PointsMaterial({ color: '#8fb8ff', size: 0.25, sizeAttenuation: true, toneMapped: false })); scene.add(stars);
}
// speed streaks
const streaks = []; const streakMat = new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.35, toneMapped: false });
for (let i = 0; i < 40; i++) { const m = new THREE.Mesh(bar, streakMat); m.scale.set(0.03, 0.03, rand(2, 5)); scene.add(m); streaks.push(m); }

// ---------------------------------------------------------------- player cube
const S = 0.8;
const cube = new THREE.Group();
cube.add(new THREE.Mesh(new THREE.BoxGeometry(S, S, S), black));
cube.add(neonBox(S, S, S, 0.07, glowCube));
const core = new THREE.Mesh(new THREE.BoxGeometry(S * 0.3, S * 0.3, S * 0.3), glow); cube.add(core);
scene.add(cube);
const trail = []; for (let i = 0; i < 6; i++) { const t = neonBox(S, S, S, 0.03, new THREE.MeshBasicMaterial({ color: THEMES[0], transparent: true, opacity: 0.1 * (1 - i / 10), toneMapped: false })); scene.add(t); trail.push(t); }

// ---------------------------------------------------------------- walls
const walls = [];
function holePatterns(lv) {
  // holes as lists of [col,row,w,h] rectangles in grid cells; tighter with level
  const big = Math.max(1, 3 - Math.floor(lv / 2)), out = [];
  const rc = (w, h) => [Math.floor(rand(0, COLS - w + 1)), Math.floor(rand(0, ROWS - h + 1)), w, h];
  const r = Math.random();
  if (lv === 0 || r < 0.3) out.push(rc(big + 1, big));
  else if (r < 0.5) out.push(rc(big, big + 1));
  else if (r < 0.68) { const a = rc(big, big); out.push(a, [a[0], Math.min(ROWS - 1, a[1] + big), Math.min(COLS - a[0], big + 2), 1]); }   // L / T shape

  else out.push(rc(big, big));

}
function buildWall(z, lv) {

  for (let r = 0; r < ROWS; r++) { filled.push([]); for (let c = 0; c < COLS; c++) filled[r].push(!holes.some(([hc, hr, hw, hh]) => c >= hc && c < hc + hw && r >= hr && r < hr + hh)); }
  const g = new THREE.Group(), D = 0.6, T = 0.09;

    let c = 0;
    while (c < COLS) {

      let e = c; while (e < COLS && filled[r][e]) e++;
      const m = new THREE.Mesh(bar, black); m.scale.set(e - c, 1, D); m.position.set(X0 + (c + e) / 2, Y0 + r + 0.5, 0); g.add(m);

  const edge = (x1, y1, x2, y2) => {

  };
  const solid = (c, r) => r >= 0 && r < ROWS && c >= 0 && c < COLS && filled[r][c];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!filled[r][c]) continue;
    const x = X0 + c, y = Y0 + r;
    if (!solid(c, r + 1)) edge(x, y + 1, x + 1, y + 1);
    if (!solid(c, r - 1)) edge(x, y, x + 1, y);
    if (!solid(c - 1, r)) edge(x, y, x, y + 1);
    if (!solid(c + 1, r)) edge(x + 1, y, x + 1, y + 1);
  }
  for (let r = 0; r <= ROWS; r++) for (let c = 0; c <= COLS; c++) {
    const n = [solid(c - 1, r - 1), solid(c, r - 1), solid(c - 1, r), solid(c, r)].filter(Boolean).length;
    const inner = c > 0 && c < COLS && r > 0 && r < ROWS;
    if (inner && (n === 1 || n === 3 || (n === 2 && solid(c - 1, r - 1) === solid(c, r)))) { const m = new THREE.Mesh(bar, glow); m.position.set(X0 + c, Y0 + r, 0); m.scale.set(T, T, D + T); g.add(m); }
  }
  g.position.z = z; scene.add(g);
  const moving = lv >= 2 && Math.random() < Math.min(0.5, 0.15 + lv * 0.05);
  walls.push({ g, z, filled, passed: false, moving, ph: rand(0, 6), amp: moving ? rand(0.6, 1.4) : 0, tight: holes.every(h => h[2] === 1 || h[3] === 1) });
}

// ---------------------------------------------------------------- shards
const shards = [];
function shatter(p) {
  for (let i = 0; i < 26; i++) {
    const s = neonBox(0.25, 0.25, 0.25, 0.04, i % 2 ? glowCube : glow); s.position.copy(p).add(new THREE.Vector3(rand(-0.4, 0.4), rand(-0.4, 0.4), rand(-0.4, 0.4))); scene.add(s);
    shards.push({ m: s, v: new THREE.Vector3(rand(-7, 7), rand(-5, 9), rand(2, 12)), r: new THREE.Vector3(rand(-9, 9), rand(-9, 9), rand(-9, 9)), t: 0 });
  }
}

// ---------------------------------------------------------------- sound
let ac = null, muted = false; try { muted = localStorage.getItem('voiddash.muted') === '1'; } catch (e) {}
function A() { if (muted) return null; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } if (ac.state === 'suspended') ac.resume(); return ac; }
function tone(f1, f2, d, type, v, delay = 0) { const a = A(); if (!a) return; const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + 0.02); }
const sfx = { pass: n => tone(440 + (n % 10) * 40, 880 + (n % 10) * 60, 0.12, 'sine', 0.06), tight: () => { tone(988, 1976, 0.1, 'square', 0.05); tone(1319, 2637, 0.14, 'square', 0.04, 0.06); }, level: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.14, 'sawtooth', 0.05, i * 0.07)), crash: () => { tone(300, 40, 0.7, 'sawtooth', 0.14); tone(90, 30, 0.8, 'square', 0.1); } };
function muteIcon() { $('mute').textContent = muted ? '🔇' : '🔊'; $('mute').setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound'); }
$('mute').addEventListener('click', () => { muted = !muted; try { localStorage.setItem('voiddash.muted', muted ? '1' : '0'); } catch (e) {} muteIcon(); }); muteIcon();

// ---------------------------------------------------------------- state
let state = 'title', paused = false, P, score, lv, speed, nextWallZ, shake = 0, best = 0;
try { best = parseInt(localStorage.getItem('voiddash.best'), 10) || 0; } catch (e) {}
function setTheme(i) { themeTarget.set(THEMES[i % THEMES.length]); document.documentElement.style.setProperty('--c', THEMES[i % THEMES.length]); }
function reset() {
  for (const w of walls) scene.remove(w.g); walls.length = 0;
  for (const s of shards) scene.remove(s.m); shards.length = 0;
  P = { x: 0, y: 0, z: 0, tx: 0, ty: 0, alive: true };
  score = 0; lv = 0; speed = 16; nextWallZ = -38; setTheme(0);
  cube.visible = true; cube.rotation.set(0, 0, 0);
  for (let i = 0; i < 6; i++) { buildWall(nextWallZ, 0); nextWallZ -= 26; }
  $('score').textContent = '0'; $('lvl').textContent = 'LEVEL 1'; $('best').textContent = best ? 'BEST ' + best : '';
}
function flash(t) { const m = $('msg'); m.textContent = t; m.classList.remove('on'); void m.offsetWidth; m.classList.add('on'); }
function start() { A(); $('title').classList.add('hidden'); $('over').classList.add('hidden'); $('hud').classList.remove('hidden'); const tip = $('tip'); tip.classList.remove('gone'); setTimeout(() => tip.classList.add('gone'), 5000); reset(); state = 'play'; paused = false; }
$('play').addEventListener('click', start); $('again').addEventListener('click', start);
function setPause(on) { paused = on; $('paused').classList.toggle('hidden', !on); }
$('resume').addEventListener('click', () => setPause(false));
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') setPause(true); });

// ---------------------------------------------------------------- input
const keys = new Set(); let mouseOn = false, mx = 0, my = 0, drag = null;
addEventListener('keydown', e => { keys.add(e.code); if (['KeyP', 'Escape'].includes(e.code) && state === 'play') setPause(!paused); if (e.code.startsWith('Arrow')) { e.preventDefault(); mouseOn = false; } if (['KeyW', 'KeyA', 'KeyS', 'KeyD'].includes(e.code)) mouseOn = false; });
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('pointermove', e => {
  if (e.pointerType === 'mouse') { mouseOn = true; mx = (e.clientX / innerWidth) * 2 - 1; my = -((e.clientY / innerHeight) * 2 - 1); }
  else if (drag && P) { P.tx = drag.x + (e.clientX - drag.cx) / innerWidth * 14; P.ty = drag.y - (e.clientY - drag.cy) / innerHeight * 10; }
});
addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse' && P) { mouseOn = false; drag = { cx: e.clientX, cy: e.clientY, x: P.tx, y: P.ty }; } });
addEventListener('pointerup', () => { drag = null; });

// ---------------------------------------------------------------- update
const LX = -X0 - S / 2, LY = -Y0 - S / 2;
function crash() {
  P.alive = false; state = 'dead'; cube.visible = false; shatter(cube.position); sfx.crash(); shake = 1.4;
  if (score > best) { best = score; try { localStorage.setItem('voiddash.best', String(best)); } catch (e) {} }
  $('oScore').textContent = score; $('oLvl').textContent = lv + 1; $('oBest').textContent = best;
  setTimeout(() => { state = 'over'; $('over').classList.remove('hidden'); $('again').focus({ preventScroll: true }); }, 1100);
}
function update(dt, T) {
  speed = Math.min(42, 16 + score * 0.32);
  P.z -= speed * dt;
  // steering
  if (mouseOn) { P.tx = mx * LX * 1.15; P.ty = my * LY * 1.2; }
  const kx = (keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0) - (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0), ky = (keys.has('ArrowUp') || keys.has('KeyW') ? 1 : 0) - (keys.has('ArrowDown') || keys.has('KeyS') ? 1 : 0);
  if (kx || ky) { P.tx = P.x + kx * 1.2; P.ty = P.y + ky * 1.2; }
  P.tx = Math.max(-LX, Math.min(LX, P.tx)); P.ty = Math.max(-LY, Math.min(LY, P.ty));
  const maxV = 11 * dt;
  P.x += Math.max(-maxV, Math.min(maxV, (P.tx - P.x) * Math.min(1, dt * 10)));
  P.y += Math.max(-maxV, Math.min(maxV, (P.ty - P.y) * Math.min(1, dt * 10)));
  // walls
  for (let i = walls.length - 1; i >= 0; i--) {
    const w = walls[i], ox = w.moving ? Math.sin(T * 1.6 + w.ph) * w.amp : 0;
    w.g.position.x = ox;
    if (w.z > P.z + 12) { scene.remove(w.g); walls.splice(i, 1); continue; }
    if (!w.passed && Math.abs(P.z - w.z) < 0.3 + S / 2) {

      const x1 = P.x - S / 2 - ox, x2 = P.x + S / 2 - ox, y1 = P.y - S / 2, y2 = P.y + S / 2;
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        if (!w.filled[r][c]) continue;
        const cx1 = X0 + c, cy1 = Y0 + r;
        if (x2 > cx1 + 0.02 && x1 < cx1 + 0.98 && y2 > cy1 + 0.02 && y1 < cy1 + 0.98) return crash();
      }
    }
    if (!w.passed && P.z < w.z - 0.3 - S / 2) {
      w.passed = true; score++; $('score').textContent = score; sfx.pass(score);
      if (w.tight) { flash('PERFECT'); sfx.tight(); }
      if (score % 10 === 0) { lv++; setTheme(lv); sfx.level(); flash('LEVEL ' + (lv + 1)); $('lvl').textContent = 'LEVEL ' + (lv + 1); }
    }
  }
  while (nextWallZ > P.z - 160) { buildWall(nextWallZ, lv); nextWallZ -= Math.max(16, 26 - lv * 1.2); }
}

// ---------------------------------------------------------------- frame
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; const T = now / 1000;
  if (!P) reset();
  if (state === 'play' && !paused) update(dt, T);
