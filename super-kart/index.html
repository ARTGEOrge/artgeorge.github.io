/* ----------------------------- race flow ---------------------------- */
function startGP(){
  G.cup = 0;
  G.points = CHARS.map((c, i) => ({ ci:i, pts:0 }));
  beginRace(0);
}

let trackCache = {};
function beginRace(ti){
  G.trackIdx = ti;
  screens.innerHTML = `<div class="screen on"><div class="logo"
      style="font-size:clamp(18px,5vh,48px)">${TRACKS[ti].name}</div>
      <div class="sub">building course&hellip;</div></div>`;
  menu = null;
  // let the loading frame paint before the (synchronous) track bake
  setTimeout(() => {
    if (!trackCache[ti]) trackCache[ti] = buildTrack(ti);
    const track = trackCache[ti];
    // reset per-race track state
    for (const b of track.boxes){ b.alive = true; b.respawn = 0; }
    setSky(track.sky);
    G.track = track;
    setupKarts(track);
    G.shots.length = 0; G.drops.length = 0; G.parts.length = 0;
    G.state = "count"; G.countdown = 3.6; G.raceTime = 0;
    G.finishOrder = []; G.results = null; G.rocket = 0; G.gasHold = 0;
    cam.yaw = G.player.yaw;
    cam.x = G.player.x - Math.sin(cam.yaw) * CAM_BACK;
    cam.z = G.player.z - Math.cos(cam.yaw) * CAM_BACK;
    closeMenus();
    setHudVisible(true);
    Audio_.unlock();
  }, 60);
}

function setupKarts(track){
  G.karts = [];
  const solo = G.mode === "tt";
  const count = solo ? 1 : 8;
  const order = [];
  for (let i = 0; i < CHARS.length; i++) if (i !== G.charIdx) order.push(i);
  // shuffle the rivals so the field differs each race
  for (let i = order.length - 1; i > 0; i--){
    const j = (Math.random() * (i + 1)) | 0;
    [order[i], order[j]] = [order[j], order[i]];
  }
  for (let r = 0; r < count; r++){
    let k;
    if (r === count - 1 || solo){
      k = new Kart(G.charIdx, true, solo ? 0 : count - 1);
      G.player = k;
    } else {
      k = new Kart(order[r], false, r);
    }
    k.placeOnGrid(track);
    G.karts.push(k);
  }
  if (solo){ G.player.grid = 0; G.player.placeOnGrid(track); }
  updateRanks();
}

function updateRanks(){
  const sorted = G.karts.slice().sort((a, b) => {
    if (a.finished && b.finished) return a.place - b.place;
    if (a.finished) return -1;
    if (b.finished) return 1;
    return b.prog - a.prog;
  });
  sorted.forEach((k, i) => k.rank = i);
}

function onPlayerFinish(){
  G.state = "done";
  G.doneTimer = 0;
  const p = G.player.place;
  showMsg(p + ORD[p] + " PLACE");
  Audio_.sfx(p <= 3 ? "win" : "lose");
  if (G.mode === "tt"){
    const b = G.player.best;
    if (b != null && (save.best[G.trackIdx] == null || b < save.best[G.trackIdx])){
      save.best[G.trackIdx] = b; persist();
    }
  }
}

function finishRace(){
  // anyone still driving is classified by current progress
  const rest = G.karts.filter(k => !k.finished).sort((a, b) => b.prog - a.prog);
  for (const k of rest) k.finish();
  setHudVisible(false);

  const order = G.finishOrder.slice();
  let body = `<table class="results">`;
  order.forEach((k, i) => {
    const pos = i + 1;
    let pts = "";
    if (G.mode === "gp"){
      const rec = G.points.find(p => p.ci === k.ci);
      if (rec){ rec.pts += GP_POINTS[i] || 0; pts = `<td class="pts">+${GP_POINTS[i] || 0}</td>`; }
    }
    body += `<tr class="${k.isPlayer ? "me" : ""}">
      <td class="p">${pos}${ORD[pos]}</td>
      <td><span class="swatch" style="background:${k.ch.body}"></span>${k.name}</td>
      <td class="t">${fmtTime(k.finishTime)}</td>${pts}</tr>`;
  });
  body += `</table>`;
  if (G.mode === "tt"){
    body = `<table class="results">
      <tr class="me"><td>TOTAL</td><td class="t">${fmtTime(G.player.finishTime)}</td></tr>
      <tr><td>BEST LAP</td><td class="t">${fmtTime(G.player.best)}</td></tr>
      <tr><td>RECORD</td><td class="t">${fmtTime(save.best[G.trackIdx])}</td></tr>
      </table>`;
  }

  const items = [];
  if (G.mode === "gp"){
    if (G.cup < TRACKS.length - 1){
      items.push({ label:"NEXT RACE → " + TRACKS[G.cup + 1].name, act:() => { G.cup++; beginRace(G.cup); } });
      items.push({ label:"STANDINGS", act:standingsScreen });
    } else {
      items.push({ label:"FINAL STANDINGS", act:standingsScreen });
    }
  } else {
    items.push({ label:"RACE AGAIN", act:() => beginRace(G.trackIdx) });
    items.push({ label:"CHANGE COURSE", act:trackScreen });
  }
  items.push({ label:"MAIN MENU", act:titleScreen });

  openMenu({
    title:"RESULTS",
    sub:TRACKS[G.trackIdx].name,
    body, items,
    back:titleScreen
  });
}

function standingsScreen(){
  const rows = G.points.slice().sort((a, b) => b.pts - a.pts);
  let body = `<table class="results">`;
  rows.forEach((r, i) => {
    body += `<tr class="${r.ci === G.charIdx ? "me" : ""}">
      <td class="p">${i + 1}${ORD[i + 1]}</td>
      <td><span class="swatch" style="background:${CHARS[r.ci].body}"></span>${CHARS[r.ci].name}</td>
      <td class="pts">${r.pts}</td></tr>`;
  });
  body += `</table>`;
  const items = [];
  if (G.cup < TRACKS.length - 1)
    items.push({ label:"NEXT RACE → " + TRACKS[G.cup + 1].name, act:() => { G.cup++; beginRace(G.cup); } });
  items.push({ label:"MAIN MENU", act:titleScreen });
  openMenu({ title:"CUP STANDINGS", body, items, back:titleScreen });
}

function pauseScreen(){
  G.paused = true;
  setHudVisible(false);
  openMenu({
    title:"PAUSED",
    items:[
      { label:"RESUME", act:() => { G.paused = false; closeMenus(); setHudVisible(true); } },
      { label:"RESTART RACE", act:() => beginRace(G.trackIdx) },
      { label:"QUIT TO MENU", act:() => { G.paused = false; titleScreen(); } }
    ],
    back:() => { G.paused = false; closeMenus(); setHudVisible(true); }
  });
}
addEventListener("keydown", e => {
  if (e.code === "Escape" && G.track && !menu && !G.paused) pauseScreen();
});

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000;
  last = now;
  if (dt > .05) dt = .05;          // don't let a stall teleport anyone
  G.timer += dt;

  pollPad();
  Input.pollEdges();
  Audio_.tickMusic(dt, !!G.track);

  if (G.track && !G.paused){
    updateRace(dt);
    renderRace();
  } else if (!G.track){
    renderIdle();
  }
  if (!G.paused && G.track) updateHUD(G.track);

  // key state is polled, so clear one-shot flags at the end of the frame
  Input.item_p = false;
}

function updateRace(dt){
  const track = G.track;

  if (G.state === "count"){
    const before = G.countdown;
    G.countdown -= dt;
    if (Input.gas) G.gasHold += dt; else G.gasHold = 0;
    for (const n of [3, 2, 1]){
      if (before > n && G.countdown <= n){ showMsg(String(n)); Audio_.sfx("count"); }
    }
    if (G.countdown <= 0){
      G.state = "race";
      showMsg("GO!");
      Audio_.sfx("go");
      // rocket start: throttle held for the last moment only
      if (G.gasHold > .05 && G.gasHold < .75){
        G.player.boost = 1.5;
        Audio_.sfx("boost");
      } else if (G.gasHold >= .75){
        G.player.spin = .5;      // jumped the lights
        G.player.spinDir = 1;
      }
    }
  } else {
    G.raceTime += dt;
  }

  for (const k of G.karts) stepKart(k, dt, track);
  resolveKartCollisions();
  stepShots(dt, track);
  stepParts(dt);
  updateRanks();

  // exhaust flames while boosting
  for (const k of G.karts){
    if (k.boost > 0 && Math.random() < dt * 40){
      G.parts.push({
        x:k.x - Math.sin(k.yaw) * 17, z:k.z - Math.cos(k.yaw) * 17, y:9,
        vx:(Math.random()-.5)*18, vz:(Math.random()-.5)*18, vy:12,
        life:.24, max:.24, size:2.2,
        col: Math.random() < .5 ? "#9fe8ff" : "#ffffff"
      });
    }
  }

  // item boxes come back after a moment
  for (const b of track.boxes){
    if (!b.alive){ b.respawn -= dt; if (b.respawn <= 0) b.alive = true; }
  }

  if (G.state === "done"){
    G.doneTimer += dt;
    const allIn = G.karts.every(k => k.finished);
    if (allIn || G.doneTimer > 7){ G.state = "over"; finishRace(); }
  }

  // ---- camera
  const p = G.player;
  const back = CAM_BACK + clamp(p.speed * .11, 0, 16);
  const targetYaw = p.yaw + (Input.look ? Math.PI : 0) + p.driftLean * .55;
  const k = 1 - Math.pow(.0006, dt);
  cam.yaw += angDiff(targetYaw, cam.yaw) * k;
  const wantX = p.x - Math.sin(cam.yaw) * back;
  const wantZ = p.z - Math.cos(cam.yaw) * back;
  cam.x = lerp(cam.x, wantX, 1 - Math.pow(.0001, dt));
  cam.z = lerp(cam.z, wantZ, 1 - Math.pow(.0001, dt));

  // speed widens the field of view a touch
  const spd01 = clamp(Math.abs(p.speed) / (p.topSpeed || 1), 0, 1.5);
  cam.focal = lerp(cam.focal, FOCAL * (1 - spd01 * .085), 1 - Math.pow(.01, dt));
  rebuildColAng(cam.focal);

  G.shake = Math.max(0, G.shake - dt * 2.4);
  cam.horizon = HORIZON + (p.hopY || 0) * .35 + (Math.random() - .5) * G.shake * 7;

  Audio_.engine(clamp(Math.abs(p.speed) / (p.topSpeed || 1), 0, 1.6), p.boost > 0 ? 1 : .4);
}

function renderRace(){
  cam.fx = Math.sin(cam.yaw); cam.fz = Math.cos(cam.yaw);
  cam.rx = Math.cos(cam.yaw); cam.rz = -Math.sin(cam.yaw);
  renderWorld(G.track, cam.x, cam.z, cam.yaw, cam.horizon, cam.focal);
  drawSprites(G.track, G.timer);
}

/* an idle attract-mode camera drifting over the first course */
let idleTrack = null, idleT = 0;
function renderIdle(){
  if (!idleTrack){
    if (!trackCache[0]) trackCache[0] = buildTrack(0);
    idleTrack = trackCache[0];
    setSky(idleTrack.sky);
  }
  idleT += .0016;
  const N = idleTrack.N;
  const i = Math.floor((idleT * 60) % N);
  const p = idleTrack.path[i];
  cam.yaw = p.ang;
  cam.x = p.x - Math.sin(p.ang) * 60;
  cam.z = p.z - Math.cos(p.ang) * 60;
  cam.focal = FOCAL; cam.horizon = HORIZON;
  cam.fx = Math.sin(cam.yaw); cam.fz = Math.cos(cam.yaw);
  cam.rx = Math.cos(cam.yaw); cam.rz = -Math.sin(cam.yaw);
  rebuildColAng(cam.focal);
  renderWorld(idleTrack, cam.x, cam.z, cam.yaw, cam.horizon, cam.focal);
  G.karts = [];
  drawSprites(idleTrack, G.timer);
}

/* ------------------------------ fullscreen -------------------------- */
el("fsBtn").addEventListener("click", () => {
  const s = document.getElementById("stage");
  if (!document.fullscreenElement) s.requestFullscreen && s.requestFullscreen();
  else document.exitFullscreen();
});

/* -------------------------------- boot ------------------------------ */
buildKartSprites();
buildMiscSprites();
titleScreen();
requestAnimationFrame(loop);
