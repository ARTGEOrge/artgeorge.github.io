<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basket Random</title>
<style>
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
  }
  canvas { display: block; }
  #hint {
    position: fixed;
    top: 12px; left: 12px;
    font-size: 12px; letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hint">Pistons: A/D move, W jump/throw &nbsp;·&nbsp; Bucks: ←/→ move, ↑ jump/throw &nbsp;·&nbsp; Walk over the ball to pick it up</div>

<script>
const cv  = document.getElementById('gameCanvas');
const ctx = cv.getContext('2d');
let cctx = ctx;   // the crowd renders through this (it is cached into its own canvas)

function adjustColor(hex, deltaPct) {
  const m = hex.replace('#', '');
  const r = parseInt(m.slice(0, 2), 16);
  const g = parseInt(m.slice(2, 4), 16);
  const b = parseInt(m.slice(4, 6), 16);
  const f = (v) => Math.max(0, Math.min(255, Math.round(v + v * deltaPct / 100)));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}

let W, H, GROUND_Y;
function resize() {
  cv.width  = window.innerWidth;
  cv.height = window.innerHeight;
  W = cv.width; H = cv.height;
  GROUND_Y = H - 90;
  placeHoops();
  placePlayers();
}
window.addEventListener('resize', resize);

const GRAVITY     = 0.55;
const JUMP_V      = -15;
const WIN_SCORE   = 7;
const MOVE_SPEED  = 5.5;
const AIR_CONTROL = 0.7;
const PLAYER_RADIUS = 16;

const score = { left: 0, right: 0 };
let winner = null;
let modifier = 'normal';
let modifierTimer = 0;

const TIME_OPTIONS = [
  { label: '1 MIN',    seconds: 60  },
  { label: '2 MIN',    seconds: 120 },
  { label: '3 MIN',    seconds: 180 },
  { label: '5 MIN',    seconds: 300 },
  { label: 'NO LIMIT', seconds: 0   },
];
let gameState       = 'menu';
let selectedTimeIdx = 1;
let timeLeft        = TIME_OPTIONS[1].seconds;
let lastUpdateMs    = performance.now();
let startBtnHit     = null;

const MODIFIERS = ['normal', 'low-gravity', 'big-ball', 'tiny-hoops', 'super-bouncy'];
function pickModifier() {
  modifier = MODIFIERS[Math.floor(Math.random() * MODIFIERS.length)];
  modifierTimer = 180;
  applyModifier();
}
function applyModifier() {
  ball.r = (modifier === 'big-ball') ? 26 : 16;
  for (const h of hoops) h.w = (modifier === 'tiny-hoops') ? 56 : 78;
}

const hoops = [];
function placeHoops() {
  const w = (modifier === 'tiny-hoops') ? 56 : 78;
  const y = GROUND_Y - 200;
  hoops.length = 0;
  hoops.push({ side: 'left',  x: 70,         y, w, h: 50, scored: false, netFlash: 0 });
  hoops.push({ side: 'right', x: W - 70 - w, y, w, h: 50, scored: false, netFlash: 0 });
}

const TEAMS = {
  left: {
    name: 'PISTONS', city: 'DETROIT', short: 'DET', number: '10',
    color:  '#c8102e',  // Pistons red
    rim:    '#1d428a',  // Pistons royal blue
    shorts: '#1d428a',
    hair:   '#1a0e08',
    skin:   '#9a6840',
    led:    '#ff3b3b',
    pop:    '#ef4444',
  },
  right: {
    name: 'BUCKS', city: 'MILWAUKEE', short: 'MIL', number: '34',
    color:  '#00471b',  // Bucks dark green
    rim:    '#eee1c6',  // Bucks cream
    shorts: '#eee1c6',
    hair:   '#3e2008',
    skin:   '#c89464',
    led:    '#22c55e',
    pop:    '#16a34a',
  },
};

const players = [
  { side: 'left',  x: 0, y: 0, vy: 0,
    color: TEAMS.left.color,  rim: TEAMS.left.rim,  shorts: TEAMS.left.shorts,
    keyJump: 'KeyW',    keyLeft: 'KeyA',      keyRight: 'KeyD',     armSwing: 0, facing: 1,
    holding: false, holdCooldown: 0, walkPhase: 0, squash: 0 },
  { side: 'right', x: 0, y: 0, vy: 0,
    color: TEAMS.right.color, rim: TEAMS.right.rim, shorts: TEAMS.right.shorts,
    keyJump: 'ArrowUp', keyLeft: 'ArrowLeft', keyRight: 'ArrowRight', armSwing: 0, facing: -1,
    holding: false, holdCooldown: 0, walkPhase: 0, squash: 0 },
];
function placePlayers() {
  players[0].x = Math.max(220, W * 0.28);
  players[1].x = W - Math.max(220, W * 0.28);
  for (const p of players) p.y = GROUND_Y;
}

const ball = { x: 0, y: 100, vx: 0, vy: 0, r: 16, rot: 0, lastTouch: null, heldBy: null };
const ballTrail = [];
function resetBall(servingSide) {
  ball.x = W / 2 + (servingSide === 'left' ? -60 : 60);
  ball.y = 90;
  ball.vx = (servingSide === 'left' ? -1 : 1) * 2 + (Math.random() - 0.5) * 2;
  ball.vy = 0;
  ball.rot = 0;
  ball.lastTouch = null;
  ball.heldBy = null;
  ballTrail.length = 0;
  for (const p of players) { p.holding = false; p.holdCooldown = 0; }
}
function heldBallPos(p) {
  return { x: p.x + p.facing * 16, y: p.y - 110 };
}
function throwBall(p) {
  if (!p.holding) return;
  const pos = heldBallPos(p);
  ball.x = pos.x; ball.y = pos.y;
  ball.vx = p.facing * 14;
  ball.vy = -13;
  ball.heldBy = null;
  p.holding = false;
  p.holdCooldown = 25;
  p.armSwing = 1;
  p.vy = -6;
  ball.lastTouch = p.side;
}

function startGame() {
  const opt = TIME_OPTIONS[selectedTimeIdx];
  timeLeft = opt.seconds;
  score.left = 0;
  score.right = 0;
  winner = null;
  modifier = 'normal';
  applyModifier();
  bigBanner = null;
  particles.length = 0;
  scorePopups.length = 0;
  for (const h of hoops) { h.scored = false; h.netFlash = 0; }
  placePlayers();
  resetBall(Math.random() < 0.5 ? 'left' : 'right');
  gameState = 'playing';
  lastUpdateMs = performance.now();
}

function handleMenuClick(x, y) {
  for (let i = 0; i < TIME_OPTIONS.length; i++) {
    const h = TIME_OPTIONS[i]._hit;
    if (h && x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) {
      selectedTimeIdx = i;
      return;
    }
  }
  if (startBtnHit && x >= startBtnHit.x && x <= startBtnHit.x + startBtnHit.w &&
      y >= startBtnHit.y && y <= startBtnHit.y + startBtnHit.h) {
    startGame();
  }
}

function formatTime(secs) {
  const s = Math.max(0, Math.ceil(secs));
  const mm = Math.floor(s / 60).toString().padStart(2, '0');
  const ss = (s % 60).toString().padStart(2, '0');
  return `${mm}:${ss}`;
}

const keys = Object.create(null);
const particles = [];
const scorePopups = [];
let bigBanner = null;
function spawnBigBanner(text, side) {
  bigBanner = {
    text,
    color: TEAMS[side].pop,
    life: 90,
    maxLife: 90,
  };
}

function spawnConfetti(x, y) {
  const palette = ['#ff4d6d', '#ffd23f', '#3ddc97', '#4cc9f0', '#f72585', '#ffffff', '#b388ff'];
  const nConf = y < 0 ? 22 : 70;   // game-over rain uses fewer pieces per burst
  for (let i = 0; i < nConf; i++) {
    const kind = i % 7 === 0 ? 'streamer' : i % 5 === 0 ? 'star' : 'chip';
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 12,
      vy: -Math.random() * 10 - 2,
      g: kind === 'streamer' ? 0.18 : 0.3,
      life: kind === 'streamer' ? 110 : 80,
      color: palette[(Math.random() * palette.length) | 0],
      size: Math.random() * 5 + 3,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.4,
      kind, flip: Math.random() * 6, drag: 0.985,
    });
  }
  // side cannons blast from both baselines when a basket lands in play
  if (y > 0 && typeof W === 'number') {
    for (const side of [0, 1]) {
      for (let i = 0; i < 30; i++) {
        const dir = side ? -1 : 1;
        particles.push({
          x: side ? W - 20 : 20, y: GROUND_Y - 10,
          vx: dir * (6 + Math.random() * 9), vy: -10 - Math.random() * 8, g: 0.28, life: 95,
          color: palette[(Math.random() * palette.length) | 0], size: Math.random() * 4 + 3,
          rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.5, kind: i % 9 === 0 ? 'streamer' : 'chip', flip: Math.random() * 6, drag: 0.985,
        });
      }
    }
    crowdHype = 1;
  }
}
function spawnDust(x, y) {
  for (let i = 0; i < 8; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 4,
      vy: -Math.random() * 3,
      g: 0.15,
      life: 25,
      color: 'rgba(220,200,170,0.8)',
      size: Math.random() * 3 + 2,
      rot: 0, vr: 0,
    });
  }
}
function spawnScorePopup(x, y, side) {
  scorePopups.push({
    x, y, vy: -1.6, life: 70,
    color: TEAMS[side].pop,
    text: '+1'
  });
}

function tryJump(p) {
  if (p.y >= GROUND_Y - 0.5) {
    p.vy = JUMP_V;
    p.armSwing = 1;
    p.squash = 0.7;
    spawnDust(p.x, GROUND_Y);
  }
}
window.addEventListener('keydown', e => {
  if (gameState === 'menu') {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
      selectedTimeIdx = (selectedTimeIdx - 1 + TIME_OPTIONS.length) % TIME_OPTIONS.length;
    } else if (e.code === 'ArrowRight' || e.code === 'KeyD') {
      selectedTimeIdx = (selectedTimeIdx + 1) % TIME_OPTIONS.length;
    } else if (e.code === 'Space' || e.code === 'Enter') {
      startGame();
    }
    if (['Space','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)) e.preventDefault();
    return;
  }
  if (gameState === 'over') {
    if (e.code === 'Space' || e.code === 'Enter') startGame();
    else if (e.code === 'KeyM' || e.code === 'Escape') gameState = 'menu';
    if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code)) e.preventDefault();
    return;
  }
  if (!keys[e.code]) {
    for (const p of players) {
      if (e.code === p.keyJump) {
        if (p.holding) throwBall(p);
        else tryJump(p);
      }
    }
  }
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('mousedown', e => {
  if (gameState === 'menu') { handleMenuClick(e.clientX, e.clientY); return; }
  if (gameState === 'over') { startGame(); return; }
});
window.addEventListener('touchstart', e => {
  if (gameState === 'menu') {
    const t = e.changedTouches[0];
    if (t) handleMenuClick(t.clientX, t.clientY);
    return;
  }
  if (gameState === 'over') { startGame(); return; }
  for (const t of e.changedTouches) {
    const side = t.clientX < W / 2 ? 'left' : 'right';
    const p = players.find(pp => pp.side === side);
    if (p.holding) throwBall(p); else tryJump(p);
  }
}, { passive: true });

function update() {
  // Real-time delta for the game clock
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastUpdateMs) / 1000);
  lastUpdateMs = now;

  if (gameState === 'playing') {
    const limit = TIME_OPTIONS[selectedTimeIdx].seconds;
    if (limit > 0) {
      timeLeft -= dt;
      if (timeLeft <= 0) {
        timeLeft = 0;
        winner = score.left > score.right ? 'left'
              : score.right > score.left ? 'right'
              : 'tie';
        gameState = 'over';
      }
    }
  }

  if (gameState !== 'playing') {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += p.g; p.rot += p.vr; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
    if (gameState === 'over' && winner !== 'tie' && Math.random() < 0.4) {
      spawnConfetti(Math.random() * W, -10);
    }
    return;
  }

  const gMul = (modifier === 'low-gravity') ? 0.45 : 1;
  const restitution = (modifier === 'super-bouncy') ? 0.92 : 0.65;

  for (const p of players) {
    if (p.holdCooldown > 0) p.holdCooldown--;
    const grounded = p.y >= GROUND_Y - 0.5;
    const ctrl = grounded ? 1 : AIR_CONTROL;
    let dx = 0;
    if (keys[p.keyLeft])  dx -= 1;
    if (keys[p.keyRight]) dx += 1;
    p.x += dx * MOVE_SPEED * ctrl;
    if (dx !== 0) p.facing = dx;
    if (dx !== 0 && grounded) p.walkPhase += 0.3;
    else p.walkPhase *= 0.85;

    if (p.x < PLAYER_RADIUS)     p.x = PLAYER_RADIUS;
    if (p.x > W - PLAYER_RADIUS) p.x = W - PLAYER_RADIUS;

    p.vy += GRAVITY * gMul;
    p.y += p.vy;
    if (p.y > GROUND_Y) {
      if (p.vy > 6) { spawnDust(p.x, GROUND_Y); p.squash = 0.5; }
      p.y = GROUND_Y;
      p.vy = 0;
    }
    if (p.armSwing > 0) p.armSwing -= 0.04;
    if (p.squash > 0)   p.squash   -= 0.06;
  }

  const a = players[0], b = players[1];
  const minSep = PLAYER_RADIUS * 2 + 6;
  const sep = b.x - a.x;
  if (sep < minSep) {
    const overlap = (minSep - sep) / 2;
    a.x -= overlap; b.x += overlap;
    if (a.x < PLAYER_RADIUS) { b.x += PLAYER_RADIUS - a.x; a.x = PLAYER_RADIUS; }
    if (b.x > W - PLAYER_RADIUS) { a.x -= b.x - (W - PLAYER_RADIUS); b.x = W - PLAYER_RADIUS; }
  }

  if (ball.heldBy) {
    const holder = players.find(p => p.side === ball.heldBy);
    const pos = heldBallPos(holder);
    ball.x = pos.x; ball.y = pos.y;
    ball.vx = 0; ball.vy = 0;
    ball.rot += holder.facing * 0.04;
  } else {
    ball.vy += GRAVITY * 0.7 * gMul;
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.rot += ball.vx * 0.05;
    if (ball.x - ball.r < 0)  { ball.x = ball.r;     ball.vx *= -0.75; }
    if (ball.x + ball.r > W)  { ball.x = W - ball.r; ball.vx *= -0.75; }
    if (ball.y + ball.r > GROUND_Y) {
      if (ball.vy > 4) spawnDust(ball.x, GROUND_Y);
      ball.y = GROUND_Y - ball.r;
      ball.vy *= -restitution;
      ball.vx *= 0.94;
      if (Math.abs(ball.vy) < 1.2) ball.vy = 0;
    }
    const settled =
      ball.y >= GROUND_Y - ball.r - 4 &&
      Math.abs(ball.vy) < 2.5 &&
      Math.abs(ball.vx) < 2.5;
    if (settled) {
      for (const p of players) {
        if (p.holdCooldown > 0) continue;
        if (p.y < GROUND_Y - 4) continue;
        const dx = p.x - ball.x;
        if (Math.abs(dx) < ball.r + PLAYER_RADIUS + 4) {
          p.holding = true;
          ball.heldBy = p.side;
          ball.lastTouch = p.side;
          break;
        }
      }
    }
  }

  // Ball motion trail
  const speed = Math.hypot(ball.vx, ball.vy);
  if (!ball.heldBy && speed > 5) {
    ballTrail.push({ x: ball.x, y: ball.y, r: ball.r, life: 14 });
    if (ballTrail.length > 16) ballTrail.shift();
  }
  for (let i = ballTrail.length - 1; i >= 0; i--) {
    ballTrail[i].life--;
    if (ballTrail[i].life <= 0) ballTrail.splice(i, 1);
  }

  for (const p of players) {
    if (ball.heldBy) break;
    const headX = p.x;
    const headY = p.y - 92;
    const dx = ball.x - headX, dy = ball.y - headY;
    const d = Math.hypot(dx, dy);
    const minD = ball.r + 24;
    if (d < minD) {
      const nx = dx / (d || 1), ny = dy / (d || 1);
      ball.x = headX + nx * minD;
      ball.y = headY + ny * minD;
      const aimDir = p.side === 'left' ? 1 : -1;
      const power = 11 + Math.random() * 3;
      ball.vx = aimDir * power + nx * 2;
      ball.vy = -11 - Math.random() * 4 + ny * 1.5;
      p.armSwing = 1;
      ball.lastTouch = p.side;
    }
    const bodyTopY = p.y - 70;
    const bodyBotY = p.y - 30;
    if (ball.x > p.x - 14 && ball.x < p.x + 14 &&
        ball.y + ball.r > bodyTopY && ball.y - ball.r < bodyBotY) {
      const fromLeft = ball.x < p.x;
      ball.x = p.x + (fromLeft ? -1 : 1) * (14 + ball.r);
      ball.vx = (fromLeft ? -1 : 1) * Math.max(4, Math.abs(ball.vx));
      ball.lastTouch = p.side;
    }
  }

  for (const h of hoops) {
    if (ball.heldBy) break;
    const rimY = h.y + h.h - 4;
    const above = ball.y < rimY + 2;
    if (above) {
      for (const rx of [h.x, h.x + h.w]) {
        const dx = ball.x - rx, dy = ball.y - rimY;
        const d = Math.hypot(dx, dy);
        if (d < ball.r + 4) {
          const nx = dx / (d || 1), ny = dy / (d || 1);
          ball.x = rx + nx * (ball.r + 4);
          ball.y = rimY + ny * (ball.r + 4);
          const dot = ball.vx * nx + ball.vy * ny;
          ball.vx = (ball.vx - 2 * dot * nx) * 0.7;
          ball.vy = (ball.vy - 2 * dot * ny) * 0.7;
        }
      }
    }
    const bbX = h.side === 'left' ? h.x - 6 : h.x + h.w - 4;
    const bbTop = h.y - 30, bbBot = h.y + 50;
    if (ball.y > bbTop && ball.y < bbBot) {
      if (h.side === 'left' && ball.x - ball.r < bbX + 10 && ball.x > bbX) {
        ball.x = bbX + 10 + ball.r;
        if (ball.vx < 0) ball.vx *= -0.7;
      } else if (h.side === 'right' && ball.x + ball.r > bbX && ball.x < bbX + 10) {
        ball.x = bbX - ball.r;
        if (ball.vx > 0) ball.vx *= -0.7;
      }
    }

    if (
      !h.scored &&
      ball.vy > 0 &&
      ball.x > h.x + 6 && ball.x < h.x + h.w - 6 &&
      ball.y - ball.r < rimY && ball.y + ball.r > rimY
    ) {
      h.scored = true;
      h.netFlash = 35;
      const scoringSide = h.side === 'left' ? 'right' : 'left';
      if (scoringSide === 'left') score.left++;
      else                        score.right++;
      spawnConfetti(h.x + h.w / 2, rimY);
      spawnScorePopup(h.x + h.w / 2, h.y - 10, scoringSide);
      spawnBigBanner('BASKET!', scoringSide);
      if (score.left >= WIN_SCORE)       { winner = 'left';  gameState = 'over'; }
      else if (score.right >= WIN_SCORE) { winner = 'right'; gameState = 'over'; }
      const serveTo = h.side;
      setTimeout(() => {
        h.scored = false;
        if (!winner) {
          resetBall(serveTo);
          if (Math.random() < 0.4) pickModifier();
          else if (modifierTimer <= 0) { modifier = 'normal'; applyModifier(); }
        }
      }, 800);
    }

    if (h.netFlash > 0) h.netFlash--;
  }

  if (modifierTimer > 0) {
    modifierTimer--;
    if (modifierTimer === 0 && modifier !== 'normal') {
      modifier = 'normal';
      applyModifier();
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.rot += p.vr; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = scorePopups.length - 1; i >= 0; i--) {
    const s = scorePopups[i];
    s.y += s.vy; s.life--;
    if (s.life <= 0) scorePopups.splice(i, 1);
  }
  if (bigBanner) {
    bigBanner.life--;
    if (bigBanner.life <= 0) bigBanner = null;
  }
}

// =================== DRAWING ===================

// Static arena backdrop (back wall, upper deck, suites, rafters, light rig) is baked once per
// resize; only the cheap animated bits are drawn per frame.
let skyCache = null, skyKey = '';
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function drawSky() {
  const key = W + 'x' + H;
  if (key !== skyKey) { skyKey = key; skyCache = buildSky(); }
  ctx.drawImage(skyCache, 0, 0);
}
function buildSky() {
  const c = mkCanvas(W, GROUND_Y), g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, GROUND_Y);
  grad.addColorStop(0, '#0b0420');
  grad.addColorStop(0.45, '#231055');
  grad.addColorStop(1, '#421253');
  g.fillStyle = grad; g.fillRect(0, 0, W, GROUND_Y);
  // Back wall panels with subtle bevels
  for (let x = 0; x < W; x += 80) {
    g.fillStyle = 'rgba(15,8,40,0.55)'; g.fillRect(x, 0, 40, GROUND_Y - 230);
    g.fillStyle = 'rgba(255,255,255,0.03)'; g.fillRect(x, 0, 1, GROUND_Y - 230);
  }
  // Roof trusses: lattice beams
  g.strokeStyle = 'rgba(190,170,255,0.10)'; g.lineWidth = 1.5;
  for (const by of [6, 40]) {
    g.beginPath(); g.moveTo(0, by); g.lineTo(W, by); g.moveTo(0, by + 14); g.lineTo(W, by + 14); g.stroke();
    g.beginPath();
    for (let x = 0; x < W; x += 28) { g.moveTo(x, by); g.lineTo(x + 14, by + 14); g.lineTo(x + 28, by); }
    g.stroke();
  }
  // Luxury suites ring (lit windows) just under the rafters
  const sy = 62, sh = 16;
  g.fillStyle = '#0a0518'; g.fillRect(0, sy - 3, W, sh + 6);
  for (let x = 6; x < W; x += 46) {
    const lit = ((x * 7) % 5) !== 0;
    const wg = g.createLinearGradient(0, sy, 0, sy + sh);
    wg.addColorStop(0, lit ? 'rgba(255,214,150,0.55)' : 'rgba(60,70,120,0.35)'); wg.addColorStop(1, lit ? 'rgba(160,90,40,0.35)' : 'rgba(20,20,40,0.35)');
    g.fillStyle = wg; g.fillRect(x, sy, 40, sh);
    g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillRect(x + 19, sy, 2, sh);
    if (lit && (x % 3 === 0)) { g.fillStyle = 'rgba(20,10,10,0.8)'; g.beginPath(); g.arc(x + 10, sy + sh - 3, 3, Math.PI, 0); g.fill(); g.beginPath(); g.arc(x + 30, sy + sh - 4, 3, Math.PI, 0); g.fill(); }
  }
  g.fillStyle = 'rgba(252,211,77,0.35)'; g.fillRect(0, sy + sh + 2, W, 1);
  // Championship banners hanging from the rafters
  const years = ['1989', '1990', '2004', '1971', '2021'];
  for (let i = 0; i < 5; i++) {
    const bx = i < 3 ? W * (0.2 + i * 0.06) : W * (0.72 + (i - 3) * 0.06), bw = 26, bh = 40;
    const col = i % 2 ? '#1d428a' : '#c8102e';
    g.strokeStyle = 'rgba(200,200,220,0.25)'; g.beginPath(); g.moveTo(bx + bw / 2, 0); g.lineTo(bx + bw / 2, 82); g.stroke();
    g.fillStyle = i > 2 ? '#00471b' : col;
    g.beginPath(); g.moveTo(bx, 82); g.lineTo(bx + bw, 82); g.lineTo(bx + bw, 82 + bh); g.lineTo(bx + bw / 2, 82 + bh - 7); g.lineTo(bx, 82 + bh); g.closePath(); g.fill();
    g.fillStyle = '#fcd34d'; g.font = 'bold 7px Arial'; g.textAlign = 'center';
    g.fillText('CHAMPS', bx + bw / 2, 94); g.font = 'bold 9px Arial'; g.fillText(years[i], bx + bw / 2, 106);
    g.fillStyle = 'rgba(255,255,255,0.12)'; g.fillRect(bx, 82, 4, bh - 4);
  }
  // Light rig: four spot cones baked (the old per-frame full-screen gradients)
  for (let i = 1; i <= 4; i++) {
    const sx = W * i / 5;
    const sg = g.createRadialGradient(sx, 8, 0, sx, GROUND_Y, GROUND_Y * 0.95);
    sg.addColorStop(0, 'rgba(255,225,140,0.22)');
    sg.addColorStop(1, 'rgba(255,225,140,0)');
    g.fillStyle = sg; g.fillRect(0, 0, W, GROUND_Y);
    g.fillStyle = '#1a1a2a'; g.fillRect(sx - 14, 0, 28, 12);
    g.fillStyle = '#2c2c44'; g.fillRect(sx - 14, 0, 28, 3);
  }
  return c;
}

function drawSweepingLights(t) {
  const beams = [
    { color: 'rgba(244,63,94,0.22)',   freq: 0.0007, phase: 0,    cx: W * 0.18 },  // pink
    { color: 'rgba(59,130,246,0.20)',  freq: 0.0006, phase: 1.4,  cx: W * 0.42 },  // blue
    { color: 'rgba(34,197,94,0.20)',   freq: 0.0007, phase: 2.8,  cx: W * 0.62 },  // green
    { color: 'rgba(252,211,77,0.18)',  freq: 0.0009, phase: 3.5,  cx: W * 0.85 },  // gold
  ];
  for (const b of beams) {
    const aim = Math.sin(t * b.freq + b.phase) * 0.5;
    const tx = b.cx + aim * 220;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(b.cx - 26, 0);
    ctx.lineTo(b.cx + 26, 0);
    ctx.lineTo(tx + 240, GROUND_Y);
    ctx.lineTo(tx - 240, GROUND_Y);
    ctx.closePath();
    const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    grad.addColorStop(0, b.color);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.restore();
  }
}

function drawDiscoFloorLights(t) {
  // Rotating colored discs on the court
  const lights = [
    { color: 'rgba(244,63,94,0.30)', cx: W * 0.25, freq: 0.0011, phase: 0   },
    { color: 'rgba(34,211,238,0.30)', cx: W * 0.50, freq: 0.0009, phase: 1.5 },
    { color: 'rgba(34,197,94,0.30)',  cx: W * 0.75, freq: 0.0010, phase: 3.0 },
  ];
  for (const l of lights) {
    const dx = Math.sin(t * l.freq + l.phase) * 100;
    const cy = GROUND_Y + 30;
    const grad = ctx.createRadialGradient(l.cx + dx, cy, 0, l.cx + dx, cy, 60);
    grad.addColorStop(0, l.color);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(l.cx + dx, cy, 80, 16, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

let nextSparkleAt = 0;
function maybeSpawnSparkle(t) {
  if (t < nextSparkleAt) return;
  nextSparkleAt = t + 800 + Math.random() * 1400;
  const fx = 80 + Math.random() * (W - 160);
  const fy = 30 + Math.random() * 80;
  const baseHue = Math.random() * 360;
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2;
    const sp = 2 + Math.random() * 3;
    particles.push({
      x: fx, y: fy,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp,
      g: 0.08,
      life: 28,
      color: `hsl(${(baseHue + i * 45) % 360}, 95%, 65%)`,
      size: 3,
      rot: 0, vr: 0,
    });
  }
}

function drawSpotlights() {
  // housings + bulbs are baked into the sky; only the glowing lenses flicker here
  const t = performance.now();
  for (let i = 1; i <= 4; i++) {
    const sx = W * i / 5;
    const f = 0.9 + 0.1 * Math.sin(t * 0.004 + i * 2);
    ctx.fillStyle = 'rgba(255,235,170,1)';
    ctx.beginPath(); ctx.arc(sx, 12, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,235,170,${0.35 * f})`;
    ctx.beginPath(); ctx.arc(sx, 12, 14 * f, 0, Math.PI * 2); ctx.fill();
  }
}

const SKIN_TONES = ['#ffd6a8', '#e8b48a', '#c89464', '#9a6840', '#6a4824', '#3e2814'];
const HAIR_COLORS = ['#1a0e08', '#3e2008', '#7a4a1a', '#cf9a4a', '#a8a8a8', '#dc2626', null, null];
const SHIRTS = ['#b21e1e', '#222a55', '#1a1a2a', '#1e50b4', '#222a55', '#fcd34d', '#1a1a2a'];

const CROWD_ROW_COUNT = 5;

function drawCrowd(t) {
  const frontTop = Math.max(120, GROUND_Y - 280);
  const topMargin = 14;
  const frontY = frontTop + 30;
  const depth  = Math.max(140, frontY - topMargin);

  for (let rIdx = 0; rIdx < CROWD_ROW_COUNT; rIdx++) {
    const u = rIdx / (CROWD_ROW_COUNT - 1);     // 0 = back, 1 = front
    const rowY  = topMargin + depth * u;
    const scale = 0.26 + u * 0.74;
    const alpha = 0.38 + u * 0.62;
    const xStep = Math.max(7, Math.round(7 + u * 15));
    const offset = (rIdx * 11) % 19;

    // Stadium tier riser
    cctx.fillStyle = `rgba(6,3,20,${0.55 + (1 - alpha) * 0.30})`;
    cctx.fillRect(0, rowY + 14 * scale, W, Math.max(8, 22 * scale));
    cctx.fillStyle = `rgba(160,140,80,${alpha * 0.18})`;
    cctx.fillRect(0, rowY + 14 * scale, W, 1.5);
    cctx.fillStyle = `rgba(0,0,0,${0.25 + (1 - alpha) * 0.2})`;
    cctx.fillRect(0, rowY + 36 * scale, W, 2);

    let idx = rIdx * 53 + offset;
    for (let x = (offset % xStep) - xStep / 2; x < W + xStep; x += xStep) {
      cctx.save();
      cctx.globalAlpha = alpha;
      cctx.translate(x + 11, rowY);
      cctx.scale(scale, scale);
      drawFanLocal(t, x, idx);
      cctx.restore();
      idx++;
    }
  }

  // Front-row bleacher base / floor edge under everything
  cctx.fillStyle = '#0a0418';
  cctx.fillRect(0, frontTop + 36, W, 70);
  cctx.fillStyle = '#150a30';
  cctx.fillRect(0, frontTop + 100, W, 8);

  // Camera flashes scattered through all tiers
  for (let x = 12; x < W; x += 21) {
    const flicker = (Math.sin(t * 0.002 + x) + 1) * 0.5;
    if (flicker > 0.78) {
      const rIdx = Math.floor(((Math.sin(x * 1.7) + 1) * 0.5) * CROWD_ROW_COUNT);
      const ri = Math.min(CROWD_ROW_COUNT - 1, rIdx);
      const u = ri / (CROWD_ROW_COUNT - 1);
      const fy = topMargin + depth * u - 2;
      cctx.fillStyle = `rgba(255,240,200,${flicker - 0.55})`;
      cctx.fillRect(x, fy, 2, 2);
    }
  }
}

function drawFanLocal(t, worldX, idx) {
  const r = 11 + Math.sin(idx * 0.71) * 2;
  const wave = Math.sin(t * 0.003 + idx * 0.4) * 2 - crowdHype * Math.abs(Math.sin(t * 0.018 + idx * 0.9)) * 7;
  cctx.save();
  cctx.translate(0, wave);

  // Cheap render path for tiny back-row fans (whatever cctx.scale leaves them at)
  // cctx.globalAlpha is already set by the caller — when alpha < 0.65 we're
  // in the back rows where heavy detail is invisible anyway.
  const isFar = cctx.globalAlpha < 0.7;

  const teamSide = worldX < W * 0.45 ? 'left' : worldX > W * 0.55 ? 'right' : null;
  const baseSkin = SKIN_TONES[(idx * 5 + 1) % SKIN_TONES.length];
  const hair  = HAIR_COLORS[(idx * 3) % HAIR_COLORS.length];
  let shirt;
  if (teamSide === 'left') {
    const c = idx % 4;
    shirt = c === 0 ? '#c8102e' : c === 1 ? '#1d428a' : c === 2 ? '#1a1a2a' : '#fff';
  } else if (teamSide === 'right') {
    const c = idx % 4;
    shirt = c === 0 ? '#00471b' : c === 1 ? '#eee1c6' : c === 2 ? '#1a1a2a' : '#fff';
  } else {
    shirt = SHIRTS[idx % SHIRTS.length];
  }
  const paintedFace = teamSide && (idx % 9 === 2);
  const skin = paintedFace ? TEAMS[teamSide].color : baseSkin;
  const gimmick = teamSide ? (idx % 7) : -1;
  const cheerPhase = Math.sin(t * 0.005 + idx * 0.7);
  const cheering = cheerPhase > 0.35 - crowdHype * 1.2;

  // Torso
  cctx.fillStyle = shirt;
  cctx.fillRect(-r + 2, r * 0.55, r * 2 - 2, 14);
  cctx.fillStyle = 'rgba(0,0,0,0.25)';
  cctx.fillRect(-r + 2, r * 0.55, r * 2 - 2, 2);

  // Arms — raised when cheering
  if (cheering) {
    cctx.strokeStyle = baseSkin;
    cctx.lineWidth = 2.5;
    cctx.lineCap = 'round';
    cctx.beginPath();
    cctx.moveTo(-r + 4,  r * 0.7);
    cctx.lineTo(-r + 1,  -r * 0.6);
    cctx.moveTo( r - 4,  r * 0.7);
    cctx.lineTo( r - 1,  -r * 0.6);
    cctx.stroke();
    cctx.fillStyle = baseSkin;
    cctx.beginPath(); cctx.arc(-r + 1, -r * 0.6, 1.6, 0, Math.PI * 2); cctx.fill();
    cctx.beginPath(); cctx.arc( r - 1, -r * 0.6, 1.6, 0, Math.PI * 2); cctx.fill();
  }

  // Head
  cctx.fillStyle = skin;
  cctx.beginPath(); cctx.arc(0, 0, r, 0, Math.PI * 2); cctx.fill();

  // Skip the rest of the fine detail for far rows — saves a lot of draw calls
  if (isFar) { cctx.restore(); return; }

  // Hair on top half
  if (hair) {
    cctx.fillStyle = hair;
    cctx.beginPath();
    cctx.arc(0, -1, r, Math.PI + 0.25, Math.PI * 2 - 0.25);
    cctx.fill();
  }

  // Team cap
  const capCandidates = ['#c8102e', '#1d428a', '#00471b', '#eee1c6', '#b21e1e', '#1e50b4'];
  if (capCandidates.includes(shirt) && idx % 2 === 0) {
    cctx.fillStyle = shirt;
    cctx.beginPath();
    cctx.arc(0, -r * 0.25, r * 0.95, Math.PI, Math.PI * 2);
    cctx.fill();
    const facing = (idx % 4 < 2) ? 1 : -1;
    cctx.fillRect(0, -r * 0.05, facing * r * 0.95, 2);
  }

  // Eyes
  cctx.fillStyle = '#000';
  const eyeOff = Math.max(2, r * 0.32);
  cctx.beginPath();
  cctx.arc(-eyeOff, 0.5, 1.4, 0, Math.PI * 2);
  cctx.arc( eyeOff, 0.5, 1.4, 0, Math.PI * 2);
  cctx.fill();
  cctx.fillStyle = '#fff';
  cctx.fillRect(-eyeOff + 0.3, -0.1, 0.7, 0.7);
  cctx.fillRect( eyeOff + 0.3, -0.1, 0.7, 0.7);

  // Mouth
  if (cheering) {
    cctx.fillStyle = '#3a0a0a';
    cctx.beginPath();
    cctx.ellipse(0, r * 0.45, 1.8, 2.4, 0, 0, Math.PI * 2);
    cctx.fill();
    cctx.fillStyle = '#fff';
    cctx.fillRect(-1.5, r * 0.45 - 1.5, 3, 0.8);
  } else {
    cctx.strokeStyle = '#3a0a0a';
    cctx.lineWidth = 1;
    cctx.beginPath();
    cctx.arc(0, r * 0.3, 2.2, 0.25, Math.PI - 0.25);
    cctx.stroke();
  }

  // War paint stripes
  if (paintedFace) {
    const stripeColor = TEAMS[teamSide].rim;
    cctx.fillStyle = stripeColor;
    cctx.fillRect(-r * 0.7, 5, r * 1.4, 1.4);
    cctx.fillRect(-r * 0.5, -6, r * 1.0, 1.2);
  }

  // Signs / foam fingers / pom-poms
  if (teamSide) {
    const T = TEAMS[teamSide];
    const sway = Math.sin(t * 0.005 + idx * 1.1) * 1.6;
    if (gimmick === 1) {
      const sw = 22, sh = 12;
      const sx = -sw / 2 + sway;
      const sy = -r - 18;
      cctx.strokeStyle = '#5a3a1a';
      cctx.lineWidth = 1.4;
      cctx.beginPath();
      cctx.moveTo(0, r * 0.3);
      cctx.lineTo(sway, sy + sh);
      cctx.stroke();
      cctx.fillStyle = T.color;
      cctx.fillRect(sx, sy, sw, sh);
      cctx.fillStyle = T.rim;
      cctx.fillRect(sx, sy, sw, 2);
      cctx.fillRect(sx, sy + sh - 2, sw, 2);
      cctx.fillStyle = '#fff';
      cctx.font = 'bold 7px Arial';
      cctx.textAlign = 'center';
      cctx.textBaseline = 'middle';
      cctx.fillText('GO ' + T.short + '!', sx + sw / 2, sy + sh / 2);
    } else if (gimmick === 4) {
      const fx = sway;
      const fy = -r - 22;
      cctx.fillStyle = T.color;
      cctx.fillRect(fx - 5, fy + 10, 10, 8);
      cctx.fillRect(fx - 2, fy - 4, 4, 14);
      cctx.beginPath();
      cctx.arc(fx, fy - 4, 2.5, 0, Math.PI * 2);
      cctx.fill();
      cctx.fillStyle = T.rim;
      cctx.fillRect(fx - 5, fy + 14, 10, 2);
      cctx.fillStyle = '#fff';
      cctx.font = 'bold 5px monospace';
      cctx.textAlign = 'center';
      cctx.textBaseline = 'middle';
      cctx.fillText('#1', fx, fy + 13);
      cctx.strokeStyle = baseSkin;
      cctx.lineWidth = 2.5;
      cctx.beginPath();
      cctx.moveTo(teamSide === 'left' ? 6 : -6, r * 0.7);
      cctx.lineTo(fx, fy + 18);
      cctx.stroke();
    } else if (gimmick === 6 && cheering) {
      const px = sway;
      const py = -r - 10;
      cctx.fillStyle = T.color;
      for (let p = 0; p < 6; p++) {
        const a = p * Math.PI / 3 + t * 0.01;
        cctx.beginPath();
        cctx.arc(px + Math.cos(a) * 3, py + Math.sin(a) * 3, 2.5, 0, Math.PI * 2);
        cctx.fill();
      }
      cctx.fillStyle = T.rim;
      cctx.beginPath();
      cctx.arc(px, py, 3, 0, Math.PI * 2);
      cctx.fill();
    }
  }

  cctx.restore();
}


function drawBanners(t) {
  const sway = Math.sin(t * 0.002) * 4;
  drawBanner(120,           30, TEAMS.left.color,  TEAMS.left.rim,  TEAMS.left.name,  sway);
  drawBanner(W - 120 - 90,  30, TEAMS.right.color, TEAMS.right.rim, TEAMS.right.name, -sway);
  const cx = W / 2, cy = 140;
  ctx.strokeStyle = '#444'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx - 110, 0); ctx.lineTo(cx - 110, cy - 14); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 110, 0); ctx.lineTo(cx + 110, cy - 14); ctx.stroke();
}
function drawBanner(x, y, c1, c2, label, sway) {
  ctx.save();
  ctx.translate(x + 45, y);
  ctx.rotate(sway * 0.005);
  ctx.translate(-(x + 45), -y);
  // Cables
  ctx.strokeStyle = '#444'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(x + 8, 0);  ctx.lineTo(x + 8, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x + 82, 0); ctx.lineTo(x + 82, y); ctx.stroke();
  // Banner cloth
  const grad = ctx.createLinearGradient(x, y, x + 90, y);
  grad.addColorStop(0, c2); grad.addColorStop(0.5, c1); grad.addColorStop(1, c2);
  ctx.fillStyle = grad;
  ctx.fillRect(x, y, 90, 50);
  // Stripe and text
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(x, y + 22, 90, 6);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px Arial';
  ctx.textAlign = 'center';
  ctx.fillText(label, x + 45, y + 32);
  ctx.restore();
}

function drawJumbotron(t) {
  const cx = W / 2, cy = 140;
  const sw = 240, sh = 116;
  // Cables
  ctx.strokeStyle = '#444'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx - 110, 0); ctx.lineTo(cx - 110, cy - sh / 2 + 4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + 110, 0); ctx.lineTo(cx + 110, cy - sh / 2 + 4); ctx.stroke();
  // Frame with color-cycling neon trim (no shadowBlur — too costly)
  ctx.fillStyle = '#0a0a18';
  const frameHue = (t * 0.06) % 360;
  ctx.strokeStyle = `hsl(${frameHue}, 90%, 60%)`;
  ctx.lineWidth = 3;
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(cx - sw/2, cy - sh/2, sw, sh, 10); ctx.fill(); ctx.stroke(); }
  else { ctx.fillRect(cx - sw/2, cy - sh/2, sw, sh); ctx.strokeRect(cx - sw/2, cy - sh/2, sw, sh); }
  // Inset screen
  const ix = cx - sw/2 + 10, iy = cy - sh/2 + 22, iw = sw - 20, ih = sh - 32;
  ctx.fillStyle = '#000';
  ctx.fillRect(ix, iy, iw, ih);
  // Top label
  ctx.fillStyle = '#fcd34d';
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('— BASKET RANDOM —', cx, cy - sh/2 + 14);

  // 7-segment-ish digits — slightly above center to leave room for time below
  const scoreY = iy + ih * 0.38;
  drawLEDDigit(ix + iw * 0.22, scoreY, 22, 36, score.left,  TEAMS.left.led);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 32px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(':', cx, scoreY + 11);
  drawLEDDigit(ix + iw * 0.78, scoreY, 22, 36, score.right, TEAMS.right.led);

  // Team city codes under each score
  ctx.font = 'bold 10px monospace';
  ctx.fillStyle = TEAMS.left.led;
  ctx.fillText(TEAMS.left.short,  ix + iw * 0.22, iy + ih - 18);
  ctx.fillStyle = TEAMS.right.led;
  ctx.fillText(TEAMS.right.short, ix + iw * 0.78, iy + ih - 18);

  // Time line below score, inside the jumbotron screen
  const limit = TIME_OPTIONS[selectedTimeIdx].seconds;
  const showTime = (gameState === 'menu') ? limit : timeLeft;
  ctx.textAlign = 'center';
  if (limit > 0) {
    const lowTime = gameState === 'playing' && timeLeft < 10;
    const blinkRed = lowTime && Math.floor(t / 250) % 2 === 0;
    ctx.fillStyle = blinkRed ? '#ff3b3b' : '#fcd34d';
    ctx.font = 'bold 16px monospace';
    ctx.fillText(formatTime(showTime), cx, iy + ih - 4);
  } else {
    ctx.fillStyle = '#fcd34d';
    ctx.font = 'bold 12px monospace';
    ctx.fillText('NO TIME LIMIT', cx, iy + ih - 4);
  }

  if (modifierTimer > 0 && modifier !== 'normal') {
    const labels = {
      'low-gravity':  'LOW GRAVITY',
      'big-ball':     'GIANT BALL',
      'tiny-hoops':   'TINY HOOPS',
      'super-bouncy': 'SUPER BOUNCY',
    };
    const blink = Math.floor(t / 200) % 2 === 0;
    if (blink) {
      ctx.fillStyle = '#fcd34d';
      ctx.font = 'bold 12px monospace';
      ctx.fillText('★ ' + labels[modifier] + ' ★', cx, cy + sh/2 + 16);
    }
  }
}

function drawMenu(t) {
  // Dim backdrop
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, W, H);

  // Title with glow
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const titleSize = Math.min(110, W * 0.10);
  ctx.shadowColor = '#fcd34d';
  ctx.shadowBlur = 30;
  ctx.fillStyle = '#fcd34d';
  ctx.font = `900 ${titleSize}px Impact, "Arial Black", sans-serif`;
  ctx.fillText('BASKET RANDOM', W / 2, H * 0.20);
  ctx.shadowBlur = 0;
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#7a4f00';
  ctx.strokeText('BASKET RANDOM', W / 2, H * 0.20);

  // Subtitle
  ctx.fillStyle = '#fff';

// Verlet cloth net per hoop: the top row is pinned to the rim, the ball pushes the strands.

    const u = i / (cols - 1), taper = 1 - (r / (rows - 1)) * 0.45;

  for (let r = 0; r < rows; r++) for (let i = 0; i < cols; i++) {
    if (i < cols - 1) add(idx(i, r), idx(i + 1, r));
    if (r < rows - 1) add(idx(i, r), idx(i, r + 1));
    if (r < rows - 1 && i < cols - 1) { add(idx(i, r), idx(i + 1, r + 1)); add(idx(i + 1, r), idx(i, r + 1)); }

  for (const ex of [-4 + f * 3, 5 + f * 3]) {
    if (s.blink > 0) { ctx.strokeStyle = '#2a1408'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(ex - 2.6, eyeY); ctx.lineTo(ex + 2.6, eyeY); ctx.stroke(); continue; }
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(ex, eyeY, 3.2, 3.4, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3a2210'; ctx.beginPath(); ctx.arc(ex + px, eyeY + py, 1.9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(ex + px, eyeY + py, 1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(ex + px - 1, eyeY + py - 1.3, 0.9, 0.9);
  }
  // eyebrows: raised in the air, determined on the ground
  ctx.strokeStyle = '#2a1408'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  const br = inAir ? -2.2 : 0;
  ctx.beginPath();
  ctx.moveTo(-8 + f * 3, -3 + br); ctx.lineTo(-1 + f * 3, -2 + (inAir ? br : 0.6));
  ctx.moveTo(1 + f * 3, -2 + (inAir ? br : 0.6)); ctx.lineTo(8 + f * 3, -3 + br);
  ctx.stroke();
  // nose
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.moveTo(f * 1, 3); ctx.lineTo(f * 4.5, 6.5); ctx.lineTo(f * 1, 6.5); ctx.closePath(); ctx.fill();
  // mouth: "O" when airborne, grin after their team scored, focused line otherwise
  const happy = bigBanner && bigBanner.color === T.pop;
  if (inAir && !happy) {
    ctx.fillStyle = '#3a0a0a'; ctx.beginPath(); ctx.ellipse(f * 4, 10, 2.4, 3, 0, 0, Math.PI * 2); ctx.fill();
  } else if (happy) {
    ctx.fillStyle = '#3a0a0a'; ctx.beginPath(); ctx.arc(f * 4, 8, 4.5, 0, Math.PI); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(f * 4 - 3.5, 8, 7, 1.6);
  } else {
    ctx.strokeStyle = '#3a1a08'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(f * 4, 6.5, 4, 0.35, Math.PI - 0.35); ctx.stroke();
  }
  // cheek + chin shading
  ctx.fillStyle = 'rgba(180,40,40,0.12)'; ctx.beginPath(); ctx.arc(f * 9, 6, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.beginPath(); ctx.ellipse(0, headR - 2, 8, 2, 0, 0, Math.PI * 2); ctx.fill();
  // sweat drop
  if (s.sweat > 0.6) {
    const sy2 = -6 + ((performance.now() * 0.02) % 14);
    ctx.fillStyle = 'rgba(170,220,255,0.85)'; ctx.beginPath(); ctx.moveTo(-f * 11, sy2 - 3); ctx.quadraticCurveTo(-f * 13, sy2 + 1, -f * 11, sy2 + 2); ctx.quadraticCurveTo(-f * 9, sy2 + 1, -f * 11, sy2 - 3); ctx.fill();
  }
  ctx.restore();

  // ---- front (throwing) arm, drawn over the torso
  const fsx = p.x + f * 8, fsy = shY + 3;
  let fe, fh;
  if (p.holding) { const hp = heldBallPos(p); const q = ik(fsx, fsy, hp.x + f * 8, hp.y + 8, 14, 14, f); fe = [q[0], q[1]]; fh = [q[2], q[3]]; }
  else { fe = seg(fsx, fsy, s.a[4], 14, f); fh = seg(fe[0], fe[1], s.a[4] + s.a[5], 14, f); }
  limb(fsx, fsy, fe[0], fe[1], 7.5, skin, out);
  limb(fe[0], fe[1], fh[0], fh[1], 6.5, skin, out);
  // compression sleeve + wristband
  ctx.strokeStyle = p.rim; ctx.lineWidth = 6.5; ctx.beginPath(); ctx.moveTo(fe[0] + (fh[0] - fe[0]) * 0.15, fe[1] + (fh[1] - fe[1]) * 0.15); ctx.lineTo(fe[0] + (fh[0] - fe[0]) * 0.55, fe[1] + (fh[1] - fe[1]) * 0.55); ctx.stroke();
  ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(fe[0] + (fh[0] - fe[0]) * 0.82, fe[1] + (fh[1] - fe[1]) * 0.82, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(fh[0], fh[1], 4, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = out; ctx.lineWidth = 1; ctx.stroke();
  // shoulder cap (jersey armhole edge)
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(fsx, fsy, 4.6, 0, Math.PI * 2); ctx.fill();
}

function drawBall() {
  // Trail
  for (let i = 0; i < ballTrail.length; i++) {
    const tr = ballTrail[i];
    const a = (tr.life / 14) * 0.4;
    ctx.fillStyle = `rgba(255,140,40,${a})`;
    ctx.beginPath();
    ctx.arc(tr.x, tr.y, tr.r * (0.4 + (i / ballTrail.length) * 0.6), 0, Math.PI * 2);
    ctx.fill();
  }

  // Shadow
  const groundDist = (GROUND_Y - ball.y) / GROUND_Y;
  const shadowScale = Math.max(0.4, 1 - groundDist * 0.5);
  ctx.fillStyle = `rgba(0,0,0,${0.4 * shadowScale})`;
  ctx.beginPath();
  ctx.ellipse(ball.x, GROUND_Y + 5, ball.r * shadowScale, 5 * shadowScale, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(ball.x, ball.y);
  ctx.rotate(ball.rot);
  const grad = ctx.createRadialGradient(-ball.r * 0.3, -ball.r * 0.3, ball.r * 0.2, 0, 0, ball.r);
  grad.addColorStop(0, '#ffd28e');
  grad.addColorStop(0.5, '#ff7a1a');
  grad.addColorStop(1, '#5a1a00');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0, 0, ball.r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#3a1505';
  ctx.lineWidth = 1.8;
  ctx.beginPath(); ctx.moveTo(-ball.r, 0); ctx.lineTo(ball.r, 0);
  ctx.moveTo(0, -ball.r); ctx.lineTo(0, ball.r); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, ball.r, -0.5, 0.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, ball.r, Math.PI - 0.5, Math.PI + 0.5); ctx.stroke();

  // Pebble texture (deterministic dot pattern that rotates with ball)
  ctx.fillStyle = 'rgba(60,20,5,0.55)';
  const pebbles = 36;
  for (let i = 0; i < pebbles; i++) {
    const a = i * 2.399963;        // golden-angle spiral
    const rr = ball.r * Math.sqrt((i + 1) / pebbles) * 0.88;
    const px = Math.cos(a) * rr;
    const py = Math.sin(a) * rr;
    ctx.beginPath();
    ctx.arc(px, py, 0.7, 0, Math.PI * 2);
    ctx.fill();
  }

  // Highlight
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.beginPath();
  ctx.ellipse(-ball.r * 0.4, -ball.r * 0.4, ball.r * 0.35, ball.r * 0.2, -0.6, 0, Math.PI * 2);
  ctx.fill();
  // Tiny secondary highlight
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.beginPath();
  ctx.arc(-ball.r * 0.5, -ball.r * 0.5, 1.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const a = Math.min(1, p.life / 25);
    if (p.drag) { p.vx *= p.drag; p.flip = (p.flip || 0) + 0.25; }
    if (p.kind === 'streamer') {
      ctx.globalAlpha = a;
      ctx.strokeStyle = p.color; ctx.lineWidth = 2.2; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x, p.y);
      for (let k = 1; k <= 6; k++) ctx.lineTo(p.x + Math.sin(p.flip + k * 0.9) * 3.5, p.y - k * 4);
      ctx.stroke();
      continue;
    }
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    if (p.kind === 'star') {
      const r = p.size * 0.9;
      ctx.beginPath(); for (let i = 0; i < 10; i++) { const an = i / 10 * Math.PI * 2, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); } ctx.closePath(); ctx.fill();
    } else if (p.kind === 'chip') {
      const w = p.size * Math.abs(Math.cos(p.flip));   // flutter: the chip flips in 3D
      ctx.fillRect(-w / 2, -p.size * 0.35, w + 0.5, p.size * 0.7);
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(-w / 2, -p.size * 0.35, w + 0.5, 1);
    } else {
      ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.5);
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawScorePopups() {
  for (const s of scorePopups) {
    const a = Math.min(1, s.life / 30);
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.scale(1.2, 1.2);
    ctx.font = 'bold 32px Impact, sans-serif';
    ctx.textAlign = 'center';
    ctx.lineWidth = 4;
    ctx.strokeStyle = `rgba(0,0,0,${a})`;
    ctx.strokeText(s.text, 0, 0);
    ctx.fillStyle = s.color;
    ctx.globalAlpha = a;
    ctx.fillText(s.text, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawWorld(t) {
  for (const h of hoops) drawHoop(h, t);
  for (const p of players) drawPlayer(p);
  drawBall();
}

function drawReflection(t) {
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.clip();
  ctx.translate(0, GROUND_Y * 2);
  ctx.scale(1, -1);
  ctx.globalAlpha = 0.22;
  // (No filter blur — too expensive. Sheen overlay below softens it enough.)
  drawWorld(t);
  ctx.restore();

  // Subtle horizontal sheen overlay to "polish" the reflection
  const sheen = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  sheen.addColorStop(0, 'rgba(0,0,0,0.0)');
  sheen.addColorStop(0.4, 'rgba(0,0,0,0.35)');
  sheen.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = sheen;
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
}

function drawBigBanner() {
  if (!bigBanner) return;
  const elapsed = bigBanner.maxLife - bigBanner.life;
  const enter = Math.min(1, elapsed / 14);
  const popScale = enter < 1
    ? 0.4 + enter * 0.6 + Math.sin(enter * Math.PI) * 0.2
    : 1;
  const wobble = Math.sin(elapsed * 0.18) * 0.04 * Math.max(0, 1 - elapsed / 30);
  const alpha = bigBanner.life < 22 ? bigBanner.life / 22 : 1;
  const fontSize = Math.min(180, Math.max(96, W * 0.16));

  ctx.save();
  ctx.translate(W / 2, H * 0.42);
  ctx.scale(popScale, popScale);
  ctx.rotate(wobble);
  ctx.globalAlpha = alpha;
  ctx.font = `900 ${fontSize}px Impact, "Arial Black", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Outer glow
  ctx.shadowColor = bigBanner.color;
  ctx.shadowBlur = 40;
  ctx.fillStyle = bigBanner.color;
  ctx.fillText(bigBanner.text, 0, 0);
  ctx.shadowBlur = 0;

  // Black outline
  ctx.lineWidth = 10;
  ctx.strokeStyle = '#000';
  ctx.strokeText(bigBanner.text, 0, 0);
  // Solid color fill on top
  ctx.fillStyle = bigBanner.color;
  ctx.fillText(bigBanner.text, 0, 0);
  // White inner highlight
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fillText(bigBanner.text, 0, -fontSize * 0.05);
  ctx.restore();
}

function drawWinner() {
  if (gameState !== 'over') return;
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, W, H);
  let color, name;
  if (winner === 'tie') {
    color = '#fcd34d'; name = "IT'S A TIE!";
  } else {
    color = TEAMS[winner].pop;
    name  = TEAMS[winner].name + ' WIN!';
  }
  ctx.fillStyle = '#000';
  ctx.font = 'bold 84px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(name, W / 2 + 4, H / 2 + 4);
  ctx.fillStyle = color;
  ctx.fillText(name, W / 2, H / 2);
  ctx.fillStyle = '#fff';
  ctx.font = '20px monospace';
  ctx.fillText(`Final score:  ${score.left}  —  ${score.right}`, W / 2, H / 2 + 36);
  ctx.fillText('Press SPACE to play again  ·  M to change time', W / 2, H / 2 + 64);
}

let crowdHype = 0, crowdCanvas = null, crowdCtx = null, crowdFrame = 0;
function frame(t) {
  frameNo++;
  update();
  drawSky();
  drawSweepingLights(t);
  drawSpotlights();
  maybeSpawnSparkle(t);
  // The crowd is the most expensive layer: redraw it into its own canvas every third frame.
  if (!crowdCanvas || crowdCanvas.width !== W || crowdCanvas.height !== GROUND_Y) {
    crowdCanvas = mkCanvas(W, GROUND_Y); crowdCtx = crowdCanvas.getContext('2d'); crowdFrame = 0;
  }
  if (crowdFrame++ % 3 === 0) {
    crowdCtx.clearRect(0, 0, W, GROUND_Y);
    cctx = crowdCtx; drawCrowd(t); cctx = ctx;
  }
  ctx.drawImage(crowdCanvas, 0, 0);
  if (crowdHype > 0) crowdHype = Math.max(0, crowdHype - 0.006);
  drawAdBoard(t);
  drawJumbotron(t);
  drawBanners(t);
  drawCourt();
  drawDiscoFloorLights(t);
  drawReflection(t);
  drawWorld(t);
  drawParticles();
  drawScorePopups();
  drawBigBanner();
  drawWinner();
  if (gameState === 'menu') drawMenu(t);
  requestAnimationFrame(frame);
}

resize();
resetBall(Math.random() < 0.5 ? 'left' : 'right');
requestAnimationFrame(frame);
</script>
</body>
