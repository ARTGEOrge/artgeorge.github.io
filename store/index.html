<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova App Store</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --card: #1e2230;
    --card-hover: #252a3b;
    --accent: #4f8cff;
    --accent-2: #7c5cff;
    --green: #2ecc71;
    --orange: #f39c12;
    --text: #e8eaf0;
    --muted: #8a90a4;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(15,17,23,.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid #232838;
    padding: 14px 28px;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  .logo {
    font-size: 20px; font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    display: flex; align-items: center; gap: 8px;
  }
  .logo .orb { font-size: 24px; -webkit-text-fill-color: initial; }
  nav { display: flex; gap: 6px; }
  nav button {
    background: none; border: none; color: var(--muted);
    font-size: 14px; font-weight: 600; padding: 8px 14px;
    border-radius: 8px; cursor: pointer; position: relative;
  }
  nav button:hover { color: var(--text); background: var(--card); }
  nav button.active { color: var(--text); background: var(--card); }
  nav button .badge {
    position: absolute; top: 0; right: 0;
    background: var(--orange); color: #000;
    font-size: 10px; font-weight: 700;
    min-width: 17px; height: 17px; line-height: 17px;
    border-radius: 9px; padding: 0 4px;
  }
  .search {
    margin-left: auto;
    background: var(--card); border: 1px solid #2a3045;
    border-radius: 10px; padding: 8px 14px;
    color: var(--text); font-size: 14px; width: 240px; outline: none;
  }
  .search:focus { border-color: var(--accent); }
  main { max-width: 1100px; margin: 0 auto; padding: 26px 28px 60px; }

  .hero {
    background: linear-gradient(135deg, #1c2c54, #2a1c54);
    border-radius: var(--radius);
    padding: 28px 32px; margin-bottom: 26px;
    display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  .hero h1 { font-size: 24px; margin-bottom: 6px; }
  .hero p { color: #aab2d0; font-size: 14px; }
  .hero .stats { display: flex; gap: 28px; }
  .stat { text-align: center; }
  .stat b { font-size: 22px; display: block; }
  .stat span { font-size: 12px; color: #aab2d0; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
  .chip {
    background: var(--card); border: 1px solid #2a3045; color: var(--muted);
    font-size: 13px; font-weight: 600; padding: 7px 14px;
    border-radius: 20px; cursor: pointer;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip:hover:not(.active) { color: var(--text); }

  .section-title { font-size: 17px; font-weight: 700; margin: 22px 0 14px; display: flex; align-items: center; gap: 10px; }
  .section-title .count { font-size: 12px; color: var(--muted); font-weight: 600; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
    gap: 14px;
  }
  .card {
    background: var(--card); border: 1px solid #262c40;
    border-radius: var(--radius); padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
    transition: transform .15s, background .15s;
  }
  .card:hover { background: var(--card-hover); transform: translateY(-2px); }
  .card-top { display: flex; gap: 12px; align-items: center; }
  .icon {
    width: 52px; height: 52px; border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; flex-shrink: 0;
  }
  .card h3 { font-size: 15px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .desc { font-size: 12.5px; color: var(--muted); line-height: 1.45; flex: 1; }
  .rating { color: var(--orange); font-size: 12px; letter-spacing: 1px; }
  .rating .num { color: var(--muted); letter-spacing: 0; margin-left: 4px; }

  .btn {
    border: none; border-radius: 9px; padding: 9px 0;
    font-size: 13.5px; font-weight: 700; cursor: pointer;
    color: #fff; background: var(--accent); width: 100%;
    transition: filter .15s;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn.installed { background: #2a3045; color: var(--muted); cursor: default; }
  .btn.installed:hover { filter: none; }
  .btn.update { background: var(--orange); color: #1a1200; }
  .btn.open { background: var(--green); color: #06200f; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { flex: 1; }
  .btn.uninstall { background: transparent; border: 1px solid #3a4159; color: var(--muted); }
  .btn.uninstall:hover { border-color: #e74c3c; color: #e74c3c; filter: none; }

  .progress-wrap { display: flex; flex-direction: column; gap: 5px; }
  .progress {
    height: 9px; background: #2a3045; border-radius: 5px; overflow: hidden;
  }
  .progress .fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 5px; transition: width .12s linear;
  }
  .progress .fill.updating { background: linear-gradient(90deg, var(--orange), #ff7b54); }
  .progress-label { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }

  .empty {
    text-align: center; color: var(--muted); padding: 60px 20px;
    background: var(--panel); border-radius: var(--radius);
  }
  .empty .big { font-size: 42px; margin-bottom: 12px; }

  .update-all-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(135deg, #3a2a08, #2c1f06);
    border: 1px solid #5a430f;
    border-radius: var(--radius); padding: 16px 20px; margin-bottom: 18px;
  }
  .update-all-bar p { font-size: 14px; }
  .update-all-bar .btn { width: auto; padding: 9px 22px; }

  .changelog { font-size: 11.5px; color: #c9a45a; background: #2a2210; border-radius: 8px; padding: 7px 10px; }

  #toast-zone { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 99; }
  .toast {
    background: var(--card); border: 1px solid #2a3045; border-left: 4px solid var(--green);
    border-radius: 10px; padding: 12px 18px; font-size: 13.5px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45);
    animation: slidein .25s ease;
  }
  .toast.warn { border-left-color: var(--orange); }
  @keyframes slidein { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<header>
  <div class="logo"><span class="orb">🛍️</span> Nova Store</div>
  <nav>
    <button id="tab-discover" class="active" onclick="setTab('discover')">Discover</button>
    <button id="tab-installed" onclick="setTab('installed')">My Apps <span class="badge" id="installed-badge" hidden></span></button>
    <button id="tab-updates" onclick="setTab('updates')">Updates <span class="badge" id="update-badge" hidden></span></button>
  </nav>
  <input class="search" id="search" placeholder="🔍 Search apps…" oninput="render()">
</header>

<main>
  <div class="hero" id="hero">
    <div>
      <h1>Welcome to Nova Store</h1>
      <p>Discover apps you haven't downloaded yet — and keep everything fresh with updates.</p>
    </div>
    <div class="stats">
      <div class="stat"><b id="stat-available">0</b><span>Available</span></div>
      <div class="stat"><b id="stat-installed">0</b><span>Installed</span></div>
      <div class="stat"><b id="stat-updates">0</b><span>Updates</span></div>
    </div>
  </div>

  <div class="toolbar" id="category-bar"></div>
  <div id="content"></div>
</main>

<div id="toast-zone"></div>

<script>
const CATALOG = [
  { id:"pixelpad",   name:"PixelPad",       cat:"Creativity",    icon:"🎨", bg:"#3d2a6e", size:84,  rating:4.7, desc:"Sketch, paint and animate with layers, brushes and a timeline built for beginners and pros alike." },
  { id:"tunewave",   name:"TuneWave",       cat:"Music",         icon:"🎧", bg:"#103c5c", size:121, rating:4.5, desc:"Stream millions of songs, build smart playlists, and discover artists tuned to your taste." },
  { id:"taskhive",   name:"TaskHive",       cat:"Productivity",  icon:"🐝", bg:"#5c4a10", size:42,  rating:4.8, desc:"Organize projects with boards, reminders and team sync. Your to-do list, finally tamed." },
  { id:"snapchef",   name:"SnapChef",       cat:"Food",          icon:"🍳", bg:"#5c2a10", size:67,  rating:4.3, desc:"Photograph your fridge and get instant recipes from what you already have at home." },
  { id:"orbitmail",  name:"OrbitMail",      cat:"Productivity",  icon:"📬", bg:"#1c4a3c", size:55,  rating:4.2, desc:"A lightning-fast email client with smart filters, snooze, and one-tap unsubscribe." },
  { id:"dungeondash",name:"Dungeon Dash",   cat:"Games",         icon:"⚔️", bg:"#4a1030", size:540, rating:4.6, desc:"A roguelike runner with 200+ levels, daily challenges and couch co-op mode." },
  { id:"zenbreeze",  name:"ZenBreeze",      cat:"Health",        icon:"🧘", bg:"#10444f", size:38,  rating:4.9, desc:"Guided meditation, sleep stories and breathing exercises to calm any kind of day." },
  { id:"codequill",  name:"CodeQuill",      cat:"Developer",     icon:"🪶", bg:"#262b3d", size:210, rating:4.7, desc:"A featherweight code editor with syntax highlighting for 60 languages and live preview." },
  { id:"stargaze",   name:"StarGaze",       cat:"Education",     icon:"🔭", bg:"#1a1a4a", size:96,  rating:4.8, desc:"Point your device at the sky to identify stars, planets and constellations in real time." },
  { id:"fitforge",   name:"FitForge",       cat:"Health",        icon:"💪", bg:"#4a2c10", size:74,  rating:4.4, desc:"Custom workout plans, rep counting and progress charts — no gym required." },
  { id:"polyglot",   name:"PolyglotGo",     cat:"Education",     icon:"🗣️", bg:"#0f4a2a", size:88,  rating:4.6, desc:"Learn 30+ languages with bite-size lessons, speech practice and streak rewards." },
  { id:"frameflow",  name:"FrameFlow",      cat:"Creativity",    icon:"🎬", bg:"#401050", size:330, rating:4.5, desc:"Edit video like a pro: trim, transitions, captions and effects with drag-and-drop ease." },
  { id:"coinpilot",  name:"CoinPilot",      cat:"Finance",       icon:"💸", bg:"#0d3d1f", size:51,  rating:4.1, desc:"Track spending, set budgets and watch your savings grow with friendly insights." },
  { id:"galaxykart", name:"Galaxy Kart",    cat:"Games",         icon:"🏎️", bg:"#103060", size:780, rating:4.4, desc:"Anti-gravity kart racing across 40 cosmic tracks with online multiplayer." },
  { id:"plantpal",   name:"PlantPal",       cat:"Lifestyle",     icon:"🪴", bg:"#1f4012", size:33,  rating:4.7, desc:"Identify plants from a photo and get watering schedules so nothing wilts again." },
  { id:"newsprism",  name:"NewsPrism",      cat:"News",          icon:"📰", bg:"#33363f", size:46,  rating:4.0, desc:"Headlines from every angle — compare how different sources cover the same story." },
  { id:"soundsmith", name:"SoundSmith",     cat:"Music",         icon:"🎹", bg:"#3c1a5c", size:265, rating:4.6, desc:"A pocket music studio with synths, drum machines and 8-track recording." },
  { id:"weathery",   name:"Weathery",       cat:"Lifestyle",     icon:"🌦️", bg:"#114455", size:29,  rating:4.5, desc:"Hyper-local forecasts, rain alerts and beautiful animated radar maps." },
  { id:"questbook",  name:"QuestBook",      cat:"Games",         icon:"🐉", bg:"#4a2210", size:415, rating:4.8, desc:"An interactive fantasy novel where every choice rewrites the story. 12 endings." },
  { id:"shieldnet",  name:"ShieldNet",      cat:"Utilities",     icon:"🛡️", bg:"#26343d", size:62,  rating:4.3, desc:"Privacy dashboard, tracker blocking and a one-tap secure connection toggle." },
];

const CHANGELOGS = [
  "Bug fixes and performance improvements.",
  "New dark mode themes and faster startup.",
  "Added offline support and fixed sync issues.",
  "Fresh icons, smoother animations, fewer crashes.",
  "Big feature drop: widgets, shortcuts and more.",
  "Security patches and battery optimizations.",
];

// ---- persistent state ----
let state = JSON.parse(localStorage.getItem("novastore") || "null") || { installed: {} };
// installed[id] = { version: "1.0", updateAvailable: bool, pendingVersion: "1.1", changelog: "..." }
const busy = {}; // id -> true while downloading/updating (not persisted)

let tab = "discover";
let category = "All";

function save() { localStorage.setItem("novastore", JSON.stringify(state)); }

function bumpVersion(v) {
  const [maj, min] = v.split(".").map(Number);
  return min >= 9 ? `${maj + 1}.0` : `${maj}.${min + 1}`;
}

// Every 15s, a random installed & up-to-date app gets a new update. "Even more updates!"
setInterval(() => {
  const candidates = Object.keys(state.installed).filter(
    id => !state.installed[id].updateAvailable && !busy[id]
  );
  if (!candidates.length) return;
  const id = candidates[Math.floor(Math.random() * candidates.length)];
  const app = CATALOG.find(a => a.id === id);
  const rec = state.installed[id];
  rec.updateAvailable = true;
  rec.pendingVersion = bumpVersion(rec.version);
  rec.changelog = CHANGELOGS[Math.floor(Math.random() * CHANGELOGS.length)];
  save();
  toast(`🔔 ${app.name} ${rec.pendingVersion} is available!`, "warn");
  render();
}, 15000);

function setTab(t) {
  tab = t;
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-" + t).classList.add("active");
  document.getElementById("hero").style.display = t === "discover" ? "" : "none";
  render();
}

function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast" + (kind === "warn" ? " warn" : "");
  el.textContent = msg;
  document.getElementById("toast-zone").appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function fmtSize(mb) { return mb >= 1000 ? (mb / 1000).toFixed(1) + " GB" : mb + " MB"; }
function stars(r) { return "★".repeat(Math.round(r)) + "☆".repeat(5 - Math.round(r)); }

function startProgress(id, isUpdate, done) {
  busy[id] = true;
  const app = CATALOG.find(a => a.id === id);
  let pct = 0;
  const speed = Math.max(1.2, 14 - app.size / 90); // bigger apps download slower
  const timer = setInterval(() => {
    pct = Math.min(100, pct + speed * (0.6 + Math.random()));
    const fill = document.getElementById("fill-" + id);
    const label = document.getElementById("pct-" + id);
    if (fill) fill.style.width = pct + "%";
    if (label) label.textContent = Math.floor(pct) + "%";
    if (pct >= 100) {
      clearInterval(timer);
      delete busy[id];
      done();
      save();
      render();
    }
  }, 120);
}

function installApp(id) {
  const app = CATALOG.find(a => a.id === id);
  render(); // re-render so progress bar appears
  startProgress(id, false, () => {
    state.installed[id] = { version: "1.0", updateAvailable: false };
    toast(`✅ ${app.name} installed!`);
  });
}

function updateApp(id) {
  const app = CATALOG.find(a => a.id === id);
  render();
  startProgress(id, true, () => {
    const rec = state.installed[id];
    rec.version = rec.pendingVersion;
    rec.updateAvailable = false;
    delete rec.pendingVersion;
    delete rec.changelog;
    toast(`⬆️ ${app.name} updated to v${rec.version}!`);
  });
}

function updateAll() {
  Object.keys(state.installed)
    .filter(id => state.installed[id].updateAvailable && !busy[id])
    .forEach(id => updateApp(id));
}

function uninstallApp(id) {
  const app = CATALOG.find(a => a.id === id);
  delete state.installed[id];
  save();
  toast(`🗑️ ${app.name} uninstalled.`, "warn");
  render();
}

function openApp(id) {
  const app = CATALOG.find(a => a.id === id);
  toast(`🚀 Launching ${app.name}… (just pretend!)`);
}

function card(app) {
  const rec = state.installed[app.id];
  const downloading = busy[app.id];
  let action;
  if (downloading) {
    const updating = rec && rec.updateAvailable;
    action = `
      <div class="progress-wrap">
        <div class="progress"><div class="fill ${updating ? "updating" : ""}" id="fill-${app.id}"></div></div>
        <div class="progress-label"><span>${updating ? "Updating…" : "Downloading…"}</span><span id="pct-${app.id}">0%</span></div>
      </div>`;
  } else if (!rec) {
    action = `<button class="btn" onclick="installApp('${app.id}')">⬇ Get &nbsp;·&nbsp; ${fmtSize(app.size)}</button>`;
  } else if (rec.updateAvailable) {
    action = `
      ${rec.changelog ? `<div class="changelog">📝 v${rec.pendingVersion}: ${rec.changelog}</div>` : ""}
      <div class="btn-row">
        <button class="btn update" onclick="updateApp('${app.id}')">⬆ Update</button>
        <button class="btn open" onclick="openApp('${app.id}')">Open</button>
      </div>`;
  } else {
    action = `
      <div class="btn-row">
        <button class="btn open" onclick="openApp('${app.id}')">Open</button>
        <button class="btn uninstall" onclick="uninstallApp('${app.id}')">Remove</button>
      </div>`;
  }
  const version = rec ? ` · v${rec.version}` : "";
  return `
    <div class="card">
      <div class="card-top">
        <div class="icon" style="background:${app.bg}">${app.icon}</div>
        <div>
          <h3>${app.name}</h3>
          <div class="meta">${app.cat} · ${fmtSize(app.size)}${version}</div>
          <div class="rating">${stars(app.rating)}<span class="num">${app.rating}</span></div>
        </div>
      </div>
      <div class="desc">${app.desc}</div>
      ${action}
    </div>`;
}

function render() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const matches = a => !q || a.name.toLowerCase().includes(q) || a.cat.toLowerCase().includes(q) || a.desc.toLowerCase().includes(q);

  const installedIds = Object.keys(state.installed);
  const updateIds = installedIds.filter(id => state.installed[id].updateAvailable);

  // header badges + hero stats
  const ib = document.getElementById("installed-badge");
  ib.hidden = installedIds.length === 0; ib.textContent = installedIds.length;
  const ub = document.getElementById("update-badge");
  ub.hidden = updateIds.length === 0; ub.textContent = updateIds.length;
  document.getElementById("stat-available").textContent = CATALOG.length - installedIds.length;
  document.getElementById("stat-installed").textContent = installedIds.length;
  document.getElementById("stat-updates").textContent = updateIds.length;

  // category chips (discover tab only)
  const bar = document.getElementById("category-bar");
  if (tab === "discover") {
    const cats = ["All", ...new Set(CATALOG.map(a => a.cat))];
    bar.innerHTML = cats.map(c =>
      `<button class="chip ${c === category ? "active" : ""}" onclick="category='${c}';render()">${c}</button>`
    ).join("");
  } else {
    bar.innerHTML = "";
  }

  const content = document.getElementById("content");

  if (tab === "discover") {
    const notInstalled = CATALOG.filter(a => !state.installed[a.id] || busy[a.id]).filter(matches)
      .filter(a => category === "All" || a.cat === category);
    const installed = CATALOG.filter(a => state.installed[a.id] && !busy[a.id]).filter(matches)
      .filter(a => category === "All" || a.cat === category);
    content.innerHTML = `
      <div class="section-title">✨ Not downloaded yet <span class="count">${notInstalled.length} apps waiting for you</span></div>
      ${notInstalled.length ? `<div class="grid">${notInstalled.map(card).join("")}</div>`
        : `<div class="empty"><div class="big">🎉</div>You've downloaded everything here. Impressive!</div>`}
      ${installed.length ? `
        <div class="section-title">📦 Already on your device <span class="count">${installed.length}</span></div>
        <div class="grid">${installed.map(card).join("")}</div>` : ""}`;
  }

  if (tab === "installed") {
    const apps = CATALOG.filter(a => state.installed[a.id]).filter(matches);
    content.innerHTML = apps.length
      ? `<div class="section-title">📦 My Apps <span class="count">${apps.length} installed</span></div>
         <div class="grid">${apps.map(card).join("")}</div>`
      : `<div class="empty"><div class="big">🛒</div>Nothing installed yet.<br>Head to Discover and grab some apps!</div>`;
  }

  if (tab === "updates") {
    const apps = CATALOG.filter(a => state.installed[a.id]?.updateAvailable).filter(matches);
    const bar = apps.length > 1
      ? `<div class="update-all-bar">
           <p>⬆️ <b>${apps.length} updates</b> are ready to install.</p>
           <button class="btn update" onclick="updateAll()">Update All</button>
         </div>` : "";
    content.innerHTML = apps.length
      ? `${bar}<div class="grid">${apps.map(card).join("")}</div>`
      : `<div class="empty"><div class="big">✅</div>Everything is up to date.<br><span style="font-size:13px">New updates appear automatically for installed apps — check back in a moment!</span></div>`;
  }
}

render();
</script>
</body>
</html>
