<meta charset="utf-8">
<title>Arcade GP — Pellet Maze</title>
<style>
  html,body{margin:0;height:100%;background:#05050c;color:#fff;
    font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px}
  body{background:radial-gradient(ellipse at 50% 0%,#141a48 0%,#05050c 65%)}
  canvas{border:3px solid #23232f;border-radius:14px;background:#05050f;max-width:100vw;
    box-shadow:0 18px 60px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.05),0 0 40px rgba(60,90,255,.18)}
  #hud{font-size:14px;letter-spacing:2px;color:#8d93a4}
</style>
<script src="kart-gfx.js"></script>
<script src="kart-audio.js"></script>
<canvas id="c" width="672" height="512"></canvas>
<div id="hud">Arrows / WASD steer · eat every pellet · power pellets squash ghosts · R restart · M mute</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const T=32,COLS=21,ROWS=15,MW=COLS*T,MH=ROWS*T,TOP=32;
const W=c.width,H=c.height,TAU=Math.PI*2;

const MAP=[
"#####################",
"#.........#.........#",
"#.###.###.#.###.###.#",
"#o#.....#...#.....#o#",
"#.#.###.#.#.#.###.#.#",
"#...#...#.#.#...#...#",
"###.#.#####.#####.#.#",
"#...#.....#.....#...#",
"#.#####.#.#.#.#####.#",
"#.......#.#.#.......#",
"#.#####.#...#.#####.#",
"#o..#.......#....#.o#",
"###.#.#######.##.#.##",
"#.................#.#",
"#####################"];
const grid=MAP.map(r=>r.split(''));
function wall(cx,cy){
  if(cx<0||cy<0||cx>=COLS||cy>=ROWS)return true;
  return grid[cy][cx]==='#';
}
function freeAt(x,y){
  const r=10;
  return !wall(((x-r)/T)|0,((y-r)/T)|0)&&!wall(((x+r)/T)|0,((y-r)/T)|0)
      && !wall(((x-r)/T)|0,((y+r)/T)|0)&&!wall(((x+r)/T)|0,((y+r)/T)|0);
}

/* neon maze, painted once: merged wall blocks traced as double neon tubes */
const mazeImg=document.createElement('canvas');mazeImg.width=MW;mazeImg.height=MH;
(function(){
  const g=mazeImg.getContext('2d');
  g.fillStyle='#05050f';g.fillRect(0,0,MW,MH);
  // faint floor grid
  g.strokeStyle='rgba(60,80,200,.07)';g.lineWidth=1;
  for(let x=0;x<=MW;x+=T/2){g.beginPath();g.moveTo(x,0);g.lineTo(x,MH);g.stroke()}
  for(let y=0;y<=MH;y+=T/2){g.beginPath();g.moveTo(0,y);g.lineTo(MW,y);g.stroke()}
  for(let i=0;i<900;i++){
    g.fillStyle='rgba(90,130,255,.05)';
    g.fillRect(Math.random()*MW,Math.random()*MH,2,2);
  }
  // merged wall shape: each wall cell plus bridges to wall neighbours
  const shape=new Path2D(),inner=new Path2D();
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(grid[y][x]!=='#')continue;
    const p=5;
    shape.rect(x*T+p,y*T+p,T-2*p,T-2*p);
    if(wall(x+1,y)&&x+1<COLS)shape.rect(x*T+T-p,y*T+p,2*p,T-2*p);
    if(wall(x,y+1)&&y+1<ROWS)shape.rect(x*T+p,y*T+T-p,T-2*p,2*p);
    if(wall(x+1,y)&&wall(x,y+1)&&wall(x+1,y+1)&&x+1<COLS&&y+1<ROWS)shape.rect(x*T+T-p,y*T+T-p,2*p,2*p);
    const q=10;
    inner.rect(x*T+q,y*T+q,T-2*q,T-2*q);
    if(wall(x+1,y)&&x+1<COLS)inner.rect(x*T+T-q,y*T+q,2*q,T-2*q);
    if(wall(x,y+1)&&y+1<ROWS)inner.rect(x*T+q,y*T+T-q,T-2*q,2*q);
  }
  g.save();g.shadowColor='#3f6bff';g.shadowBlur=18;
  g.fillStyle='#16237a';g.fill(shape);
  g.restore();
  const grd=g.createLinearGradient(0,0,0,MH);
  grd.addColorStop(0,'#1e2f9a');grd.addColorStop(1,'#141f6e');
  g.fillStyle=grd;g.fill(shape);
  g.fillStyle='#0a0f3a';g.fill(inner);
  // outline tubes: draw the wall shape's edge by stroking a dilated copy
  g.save();g.globalCompositeOperation='source-atop';
  g.strokeStyle='rgba(150,190,255,.85)';g.lineWidth=2;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    if(grid[y][x]!=='#')continue;
    const p=5,X=x*T,Y=y*T;
    g.beginPath();
    if(!wall(x,y-1)){g.moveTo(X+p,Y+p+1);g.lineTo(X+T-p,Y+p+1)}
    if(!wall(x,y+1)){g.moveTo(X+p,Y+T-p-1);g.lineTo(X+T-p,Y+T-p-1)}
    if(!wall(x-1,y)){g.moveTo(X+p+1,Y+p);g.lineTo(X+p+1,Y+T-p)}
    if(!wall(x+1,y)){g.moveTo(X+T-p-1,Y+p);g.lineTo(X+T-p-1,Y+T-p)}
    g.stroke();
  }
  g.restore();
  g.strokeStyle='rgba(120,160,255,.35)';g.lineWidth=1;g.stroke(inner);
  // ghost-house door
  g.fillStyle='#ff9ec4';g.fillRect(10*T+6,6*T+T-6,T-12,3);
})();

const fx=new GFX.Particles(500);
const keys={};
let kart,dir,want,pellets,ghosts,score,power,done,msg,lives,wobble,pops;
function reset(){
  pellets=[];
  grid.forEach((row,y)=>row.forEach((ch,x)=>{
    if(ch==='.')pellets.push({x:x*T+T/2,y:y*T+T/2,big:false,ph:(x+y)%7});
    if(ch==='o')pellets.push({x:x*T+T/2,y:y*T+T/2,big:true,ph:(x+y)%7});
  }));
  kart={x:T*10+T/2,y:T*13+T/2};
  dir={x:0,y:0};want={x:0,y:0};
  score=0;power=0;done=false;msg='';lives=3;wobble=0;pops=[];fx.clear();
  ghosts=[
    {x:T*10+T/2,y:T*7+T/2,col:'#ff5a4a',dx:1,dy:0},
    {x:T*9+T/2, y:T*7+T/2,col:'#f7b0d0',dx:-1,dy:0},
    {x:T*11+T/2,y:T*7+T/2,col:'#5fe0e0',dx:0,dy:1}
  ];
}
reset();
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();keys[k]=true;
  if(k.startsWith('arrow'))e.preventDefault();
  if(k==='r')reset();
  if(k==='m')SFX.toggle();
  if(k==='arrowleft'||k==='a')want={x:-1,y:0};
  if(k==='arrowright'||k==='d')want={x:1,y:0};
  if(k==='arrowup'||k==='w')want={x:0,y:-1};
  if(k==='arrowdown'||k==='s')want={x:0,y:1};
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
GFX.trackKeys(keys);

const SPD=132;
function update(dt){
  fx.update(dt);
  pops=pops.filter(p=>(p.t-=dt)>0);
  if(wobble>0)wobble-=dt;
  if(done)return;
  if(power>0)power-=dt;

  if(want.x||want.y){
    const nx=kart.x+want.x*(SPD*dt+6), ny=kart.y+want.y*(SPD*dt+6);
    if(freeAt(nx,ny)){dir={...want};want={x:0,y:0}}
  }
  const nx=kart.x+dir.x*SPD*dt, ny=kart.y+dir.y*SPD*dt;
  if(freeAt(nx,ny)){kart.x=nx;kart.y=ny}
  else{
    kart.x=(((kart.x/T)|0)+0.5)*T;
    kart.y=(((kart.y/T)|0)+0.5)*T;
    dir={x:0,y:0};
  }

  pellets=pellets.filter(p=>{
    if(Math.hypot(p.x-kart.x,p.y-kart.y)<15){
      score+=p.big?50:10;
      if(p.big){
        power=6.5;SFX.power();
        GFX.FX.pickup(fx,p.x,p.y,'#ffd23f',1.4);
        fx.burst(p.x,p.y,18,{spd:200,life:.6,r:4,col:'#ffd23f',shape:'spark',drag:2.2,add:true});
      }else{SFX.pellet();fx.burst(p.x,p.y,4,{spd:60,life:.25,r:2,col:'#fff2c0',drag:3,add:true})}
      return false;
    }
    return true;
  });

  ghosts.forEach(g=>{
    const gs=power>0?85:108;
    const opts=[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>
      freeAt(g.x+dx*14,g.y+dy*14)&&!(dx===-g.dx&&dy===-g.dy));
    const atCentre=Math.abs(g.x%T-T/2)<3&&Math.abs(g.y%T-T/2)<3;
    if((atCentre||!freeAt(g.x+g.dx*14,g.y+g.dy*14))&&opts.length){
      let best=opts[0],bs=1e9;
      opts.forEach(([dx,dy])=>{
        const d=Math.hypot(kart.x-(g.x+dx*T),kart.y-(g.y+dy*T));
        const s=power>0?-d:d;
        if(s<bs){bs=s;best=[dx,dy]}
      });
      if(Math.random()<0.22)best=opts[(Math.random()*opts.length)|0];
      g.dx=best[0];g.dy=best[1];
    }
    const gx=g.x+g.dx*gs*dt, gy=g.y+g.dy*gs*dt;
    if(freeAt(gx,gy)){g.x=gx;g.y=gy}
    if(Math.random()<0.3)fx.emit({x:g.x-g.dx*10,y:g.y-g.dy*10+6,life:.35,r:4,r2:0,col:power>0?'#3a54d8':g.col,shape:'glow',add:true,drag:0,a0:0.4});

    if(Math.hypot(g.x-kart.x,g.y-kart.y)<20){
      if(power>0){
        score+=200;wobble=0.3;SFX.pop();
        GFX.FX.pop(fx,g.x,g.y,g.col,1.1);
        pops.push({x:g.x,y:g.y,t:0.9});
        g.x=T*10+T/2;g.y=T*7+T/2;
      }else{
        lives--;wobble=0.6;SFX.crash();
        GFX.FX.boom(fx,kart.x,kart.y,0.8);
        kart={x:T*10+T/2,y:T*13+T/2};dir={x:0,y:0};want={x:0,y:0};
        ghosts.forEach((gg,i)=>{gg.x=T*(9+i)+T/2;gg.y=T*7+T/2});
        if(lives<=0){done=true;msg='score '+score;SFX.engine(0);SFX.lose()}
      }
    }
  });

  SFX.engine((dir.x||dir.y)?0.42:0.10,power>0?1.35:1);
  if(!pellets.length&&!done){done=true;msg='score '+score;SFX.engine(0);SFX.win()}
}

function ghost(g,now){
  const scared=power>0;
  const blink=scared&&power<2&&((now/140)|0)%2;
  const col=scared?(blink?'#ffffff':'#3a54d8'):g.col;
  ctx.save();ctx.translate(g.x,g.y+Math.sin(now/220+g.x)*1.6);
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(2,14,10,3,0,0,TAU);ctx.fill();
  GFX.glow(ctx,0,0,24,col,0.45);
  const grd=ctx.createLinearGradient(0,-14,0,12);
  grd.addColorStop(0,GFX.light(col,0.4));grd.addColorStop(1,GFX.dark(col,0.3));
  ctx.fillStyle=grd;
  ctx.beginPath();ctx.arc(0,-3,12,Math.PI,0);
  ctx.lineTo(12,9);
  const wob=Math.sin(now/120)*2;
  for(let i=0;i<3;i++){
    ctx.lineTo(12-(i*2+1)*4,(i%2?10:4)+wob*(i%2?1:-1));
  }
  ctx.lineTo(-12,9);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.ellipse(-5,-10,4,2.4,-0.4,0,TAU);ctx.fill();
  if(scared){
    ctx.fillStyle=blink?'#e04a3c':'#ffd8c8';
    ctx.fillRect(-5,-6,3,3);ctx.fillRect(2,-6,3,3);
    ctx.strokeStyle=blink?'#e04a3c':'#ffd8c8';ctx.lineWidth=1.4;ctx.beginPath();
    for(let i=0;i<=6;i++)ctx.lineTo(-7+i*2.33,2+(i%2?-1.5:1.5));ctx.stroke();
  }else{
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.ellipse(-4.5,-4,3.4,4,0,0,TAU);ctx.fill();
    ctx.beginPath();ctx.ellipse(4.5,-4,3.4,4,0,0,TAU);ctx.fill();
    ctx.fillStyle='#2a3cff';
    ctx.beginPath();ctx.arc(-4.5+g.dx*1.6,-4+g.dy*1.8,1.9,0,TAU);ctx.fill();
    ctx.beginPath();ctx.arc(4.5+g.dx*1.6,-4+g.dy*1.8,1.9,0,TAU);ctx.fill();
  }
  ctx.restore();
}

function render(now){
  ctx.fillStyle='#05050c';ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(0,TOP);
  if(wobble>0)ctx.translate((Math.random()-.5)*7,(Math.random()-.5)*7);
  ctx.drawImage(mazeImg,0,0);
  // walls breathe: a slow neon pulse; turns gold while powered
  ctx.save();ctx.globalCompositeOperation='lighter';
  ctx.globalAlpha=0.06+0.04*Math.sin(now/400)+(power>0?0.08:0);
  ctx.drawImage(mazeImg,0,0);
  ctx.restore();

  pellets.forEach(p=>{
    if(p.big){
      const s=1+0.25*Math.sin(now/180+p.ph);
      GFX.glow(ctx,p.x,p.y,22*s,'#ffd23f',0.7);
      const g=ctx.createRadialGradient(p.x-2,p.y-2,1,p.x,p.y,8*s);
      g.addColorStop(0,'#fff6cf');g.addColorStop(1,'#e0a91c');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,7.5*s,0,TAU);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(p.x-2.4,p.y-2.4,1.8*s,0,TAU);ctx.fill();
    }else{
      const tw=0.75+0.25*Math.sin(now/300+p.x*0.1+p.y*0.07);
      ctx.fillStyle='rgba(255,220,150,'+(0.18*tw)+')';ctx.beginPath();ctx.arc(p.x,p.y,6,0,TAU);ctx.fill();
      ctx.fillStyle='#f6eccc';ctx.beginPath();ctx.arc(p.x,p.y,3.2,0,TAU);ctx.fill();
      ctx.fillStyle='#fff';ctx.fillRect(p.x-1.6,p.y-1.6,1.4,1.4);
    }
  });

  fx.draw(ctx);
  ghosts.forEach(g=>ghost(g,now));

  const a=(dir.x||dir.y)?Math.atan2(dir.y,dir.x):0;
  if(power>0){
    GFX.glow(ctx,kart.x,kart.y,40,'#ffd23f',0.6);
    ctx.strokeStyle='rgba(255,230,140,'+(0.5+0.3*Math.sin(now/60))+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(kart.x,kart.y,22,0,TAU);ctx.stroke();
  }
  GFX.kartTop(ctx,{x:kart.x,y:kart.y,a,s:0.7,col:power>0?'#ffd23f':'#e0392b',acc:'#f4f4f8',id:'me',fx,
    v:(dir.x||dir.y)?SPD:0,boost:power>0?0.6:0});
  pops.forEach(p=>{ctx.globalAlpha=Math.min(1,p.t*2);
    GFX.glowText(ctx,'200',p.x,p.y-20-(0.9-p.t)*30,{font:'bold 14px Segoe UI',fill:'#5fe0e0',blur:10});ctx.globalAlpha=1});
  ctx.restore();

  GFX.bloom(ctx,c,0.46,8);
  GFX.scanlines(ctx,W,H,0.09);
  GFX.grain(ctx,W,H,0.05);
  // CRT glass: rounded corner shading and a soft reflection
  GFX.vignette(ctx,W,H,0.62);
  const rf=ctx.createLinearGradient(0,0,W*0.6,H*0.5);rf.addColorStop(0,'rgba(255,255,255,.05)');rf.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=rf;ctx.fillRect(0,0,W,H);
  drawHUD(now);
}
function drawHUD(now){
  // marquee strip
  const mg=ctx.createLinearGradient(0,0,0,TOP);mg.addColorStop(0,'#141a40');mg.addColorStop(1,'#0a0d22');
  ctx.fillStyle=mg;ctx.fillRect(0,0,W,TOP);
  ctx.fillStyle='rgba(120,160,255,.4)';ctx.fillRect(0,TOP-1,W,1);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  GFX.glowText(ctx,'1UP',14,13,{font:'bold 10px Segoe UI',fill:((now/400)|0)%2?'#ff5a4a':'#ffb0a8',blur:6,align:'left'});
  GFX.glowText(ctx,String(score).padStart(6,'0'),14,28,{font:'bold 16px Consolas,monospace',fill:'#ffffff',blur:6,align:'left'});
  ctx.fillStyle='#8d93a4';ctx.font='10px Segoe UI';ctx.fillText('PELLETS',130,13);
  ctx.fillStyle='#f0e8c8';ctx.font='bold 15px Consolas,monospace';ctx.fillText(pellets.length,130,28);
  GFX.glowText(ctx,'ARCADE GP',W/2,22,{font:'italic 900 16px Segoe UI',fill:'#ffd23f',blur:10});
  ctx.fillStyle='#8d93a4';ctx.font='10px Segoe UI';ctx.textAlign='right';
  ctx.fillText('LIVES',W-84,14);
  for(let i=0;i<lives;i++)GFX.kartTop(ctx,{x:W-64+i*22,y:20,a:-Math.PI/2,s:0.32,col:'#e0392b',acc:'#f4f4f8',id:'life'+i,shadow:false,v:0});
  if(power>0){
    GFX.glowText(ctx,'★ POWER '+power.toFixed(1),W/2+150,22,
      {font:'bold 13px Segoe UI',fill:'#ffd23f',blur:14});
  }
}

let last=performance.now();
function loop(now){
  const dt=Math.max(0,Math.min(0.04,(now-last)/1000));last=now;
  update(dt);render(now);
  if(done)GFX.banner(ctx,W,H,pellets.length?'GAME OVER':'MAZE CLEARED!',msg+'  ·  press R');
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
