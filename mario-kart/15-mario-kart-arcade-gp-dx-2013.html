<meta charset="utf-8">
<title>Arcade GP DX — Kart Fusion</title>
<style>
  html,body{margin:0;height:100%;background:#080810;color:#fff;
    font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px}
  body{background:radial-gradient(ellipse at 50% 0%,#1a1f48 0%,#080810 65%)}
  canvas{border:3px solid #23232f;border-radius:8px;background:#26364a;max-width:100vw;
    box-shadow:0 18px 60px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.05)}
  #hud{font-size:14px;letter-spacing:2px;color:#8d93a4}
</style>
<script src="kart-gfx.js"></script>
<script src="kart-audio.js"></script>
<canvas id="c" width="720" height="490"></canvas>
<div id="hud">Pick TWO parts to fuse (1-4) · ENTER race · BACKSPACE undo · R restart · M mute</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=c.width,H=c.height,TAU=Math.PI*2;
const WW=1400,WH=1060,ROADW=82;

const PARTS=[
  {name:'Rocket',  top:290,acc:180,grip:2.0,col:'#ff5a4a'},
  {name:'Tank',    top:180,acc:250,grip:3.5,col:'#5fd06a'},
  {name:'Slick',   top:245,acc:215,grip:3.0,col:'#3ba7e8'},
  {name:'Bouncer', top:210,acc:300,grip:2.4,col:'#f2c33c'}
];
function fuse(a,b){
  return{
    name:PARTS[a].name+'-'+PARTS[b].name,
    top:PARTS[a].top*0.65+PARTS[b].top*0.35,
    acc:PARTS[a].acc*0.35+PARTS[b].acc*0.65,
    grip:(PARTS[a].grip+PARTS[b].grip)/2,
    colA:PARTS[a].col,colB:PARTS[b].col
  };
}

const PTS=[];
for(let i=0;i<180;i++){
  const t=i/180*TAU;
  const r=310+120*Math.sin(3*t)+60*Math.sin(t);
  PTS.push({x:660+Math.cos(t)*r*1.25,y:520+Math.sin(t)*r});
}
function segp(i){return[PTS[i],PTS[(i+1)%PTS.length]]}
function trace(g,w,col,dash){
  g.setLineDash(dash||[]);
  g.beginPath();g.moveTo(PTS[0].x,PTS[0].y);
  for(let i=1;i<PTS.length;i++)g.lineTo(PTS[i].x,PTS[i].y);
  g.closePath();g.lineWidth=w;g.strokeStyle=col;g.lineJoin='round';g.lineCap='round';
  g.stroke();g.setLineDash([]);
}
const mk=document.createElement('canvas');mk.width=WW;mk.height=WH;
const mgc=mk.getContext('2d',{willReadFrequently:true});trace(mgc,ROADW+150,'#fff');
const NEAR=mgc.getImageData(0,0,WW,WH).data;
mgc.clearRect(0,0,WW,WH);trace(mgc,ROADW,'#fff');
const MD=mgc.getImageData(0,0,WW,WH).data;
function onRoad(x,y){
  const ix=x|0,iy=y|0;
  if(ix<0||iy<0||ix>=WW||iy>=WH)return false;
  return MD[(iy*WW+ix)*4+3]>40;
}
function nearRoad(x,y){const ix=x|0,iy=y|0;if(ix<0||iy<0||ix>=WW||iy>=WH)return true;return NEAR[(iy*WW+ix)*4+3]>40}

/* a night-time arcade circuit through a lit city block */
const PYL=[];
const world=document.createElement('canvas');world.width=WW;world.height=WH;
(function(){
  const g=world.getContext('2d');
  g.fillStyle='#1e2c40';g.fillRect(0,0,WW,WH);
  for(let i=0;i<1400;i++){
    g.fillStyle=['#22314a','#1a2739','#283a55'][(Math.random()*3)|0];
    const s=20+Math.random()*50;
    g.beginPath();g.ellipse(Math.random()*WW,Math.random()*WH,s,s*0.6,Math.random()*TAU,0,TAU);g.fill();
  }
  // rooftops of the city around the circuit, with lit windows and rooftop units
  for(let i=0;i<160;i++){
    const x=Math.random()*WW,y=Math.random()*WH,w=40+Math.random()*70,h=30+Math.random()*60;
    if(nearRoad(x,y)||nearRoad(x+w,y)||nearRoad(x,y+h)||nearRoad(x+w,y+h)||nearRoad(x+w/2,y+h/2))continue;
    g.fillStyle='rgba(0,0,0,.4)';g.fillRect(x+6,y+8,w,h);
    g.fillStyle=['#2a3550','#323e5a','#26304a'][i%3];g.fillRect(x,y,w,h);
    g.fillStyle='rgba(255,255,255,.06)';g.fillRect(x,y,w,3);
    for(let k=0;k<(w*h/400|0);k++){g.fillStyle=Math.random()<.6?'rgba(255,214,120,.55)':'rgba(140,200,255,.45)';g.fillRect(x+4+Math.random()*(w-10),y+4+Math.random()*(h-10),4,3)}
    g.fillStyle='#4a5470';g.fillRect(x+w*0.6,y+h*0.2,10,8);
    if(i%4===0){g.fillStyle=['#ff5a9a','#4fd0e0'][i%2];g.fillRect(x+3,y+h-6,w-6,3)}
  }
  trace(g,ROADW+90,'#2b3b54');
  trace(g,ROADW+90,'rgba(90,120,170,.25)',[2,10]);
  g.lineCap='butt';g.lineWidth=ROADW+24;
  for(let i=0;i<PTS.length;i++){
    const[a,b]=segp(i);
    g.strokeStyle=(i&1)?'#3a7fd8':'#e6ecf6';
    g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();
  }
  g.lineCap='round';
  trace(g,ROADW,'#40404d');
  for(let i=0;i<7000;i++){
    g.fillStyle=Math.random()<.5?'rgba(255,255,255,.03)':'rgba(0,0,0,.05)';
    g.fillRect(Math.random()*WW,Math.random()*WH,3,3);
  }
  trace(g,26,'rgba(18,18,24,.3)');
  GFX.trackDetail(g,PTS,ROADW,{kerb:12,runoff:45,edgeCol:'rgba(150,210,255,.6)'});
  trace(g,3,'rgba(210,225,245,.65)',[16,22]);
  const[a,b]=segp(0),ang=Math.atan2(b.y-a.y,b.x-a.x);
  GFX.checkerStrip(g,a.x,a.y,ang,3,6,10);
  // neon pylon bases (their light is animated per frame)
  for(let i=0;i<PTS.length;i+=7){
    const[p,q]=segp(i);
    const n=Math.atan2(q.y-p.y,q.x-p.x)+Math.PI/2;
    [-1,1].forEach(sd=>{
      const d=(ROADW/2+70)*sd;
      const x=p.x+Math.cos(n)*d,y=p.y+Math.sin(n)*d;
      const col=(i/7|0)%2?'#4fd0e0':'#ff5a9a';
      PYL.push({x,y,col,i});
      g.fillStyle='rgba(0,0,0,.4)';GFX.rr(g,x-4,y-14,10,32,3);g.fill();
      g.fillStyle='#1a1e2c';GFX.rr(g,x-5,y-18,10,36,3);g.fill();
    });
  }
})();

/* fused kart: two-tone body split at the seam, with a glowing fusion line */
function fusedKart(g,o){
  const s=o.s||1,t=performance.now()/1000;
  g.save();g.translate(o.x,o.y);g.rotate(o.a||0);g.scale(s,s);
  g.fillStyle='rgba(0,0,0,.3)';
  g.beginPath();g.ellipse(3,5,23,15,0,0,TAU);g.fill();
  const ph=o.ph||0;
  GFX.wheelTop(g,-11,-13,0,10,6.4,ph);
  GFX.wheelTop(g,-11,13,0,10,6.4,ph);
  GFX.wheelTop(g,10,-13,o.steer||0,9.4,6,ph);
  GFX.wheelTop(g,10,13,o.steer||0,9.4,6,ph);
  g.fillStyle='#26262f';GFX.rr(g,-23.5,-8,2.8,16,1.2);g.fill();
  g.fillStyle=GFX.dark(o.colB,0.5);GFX.rr(g,-21,-11.5,4.5,23,1.8);g.fill();
  // rear half
  const gb=g.createLinearGradient(0,-12,0,12);
  gb.addColorStop(0,GFX.light(o.colB,0.45));gb.addColorStop(0.5,o.colB);gb.addColorStop(1,GFX.dark(o.colB,0.35));
  g.fillStyle=gb;
  g.beginPath();g.moveTo(-17,-10.5);g.lineTo(0,-11);g.lineTo(0,11);g.lineTo(-17,10.5);
  g.quadraticCurveTo(-19.5,0,-17,-10.5);g.closePath();g.fill();
  // front half
  const ga=g.createLinearGradient(0,-12,0,12);
  ga.addColorStop(0,GFX.light(o.colA,0.45));ga.addColorStop(0.5,o.colA);ga.addColorStop(1,GFX.dark(o.colA,0.35));
  g.fillStyle=ga;
  g.beginPath();g.moveTo(0,-11);g.lineTo(6,-11.5);
  g.quadraticCurveTo(19,-8.5,20,0);g.quadraticCurveTo(19,8.5,6,11.5);
  g.lineTo(0,11);g.closePath();g.fill();
  g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=1.3;
  g.beginPath();g.moveTo(-17,-10.5);g.lineTo(6,-11.5);
  g.quadraticCurveTo(19,-8.5,20,0);g.quadraticCurveTo(19,8.5,6,11.5);
  g.lineTo(-17,10.5);g.quadraticCurveTo(-19.5,0,-17,-10.5);g.closePath();g.stroke();
  // side pods, exhausts, nose star, lights
  g.fillStyle=GFX.dark(o.colB,0.35);GFX.rr(g,-15,-12,12,3.6,1.5);g.fill();GFX.rr(g,-15,8.4,12,3.6,1.5);g.fill();
  GFX.grille(g,-13,-11.6,8,2.8,3);GFX.grille(g,-13,8.8,8,2.8,3);
  g.fillStyle='#7a7a88';GFX.rr(g,-21,-4.4,3,2.8,1.2);g.fill();GFX.rr(g,-21,1.6,3,2.8,1.2);g.fill();
  g.fillStyle='#f2f2f6';g.beginPath();g.arc(12,0,3.2,0,TAU);g.fill();
  g.fillStyle=o.colA;GFX.star(g,12,0,2.2,0.9,5,0);g.fill();
  g.fillStyle='rgba(255,250,215,.95)';g.beginPath();g.ellipse(17,-5,2,1.6,0,0,TAU);g.ellipse(17,5,2,1.6,0,0,TAU);g.fill();
  // fusion seam: a pulsing energy line
  const pulse=0.6+0.4*Math.sin(t*8);
  GFX.glow(g,0,0,12,'#fff2a0',0.35*pulse);
  g.strokeStyle='rgba(255,255,255,'+(0.6+0.4*pulse)+')';g.lineWidth=1.6;
  g.beginPath();g.moveTo(0,-11);g.lineTo(0,11);g.stroke();
  g.fillStyle='rgba(255,255,255,.24)';GFX.rr(g,-11,-7.6,22,3.2,1.6);g.fill();
  // cockpit + driver
  g.fillStyle='#191921';g.beginPath();g.ellipse(-1.5,0,8.8,7.6,0,0,TAU);g.fill();
  g.fillStyle='#2b3350';GFX.rr(g,-7,-5.6,7,11.2,3);g.fill();
  const hg=g.createRadialGradient(-3,-2,0.5,-1.5,0,5.6);hg.addColorStop(0,'#ffffff');hg.addColorStop(1,'#b8bcc8');
  g.fillStyle=hg;g.beginPath();g.arc(-1.5,0,5.3,0,TAU);g.fill();
  g.fillStyle=o.colA;g.fillRect(-6.5,-0.8,5,1.6);
  g.fillStyle='rgba(24,28,40,.9)';g.beginPath();g.ellipse(1.8,0,2,3.2,0,0,TAU);g.fill();
  GFX.bolt(g,-15,-9.5,0.75);GFX.bolt(g,-15,9.5,0.75);
  g.restore();
}

const fx=new GFX.Particles(440);
const keys={};
let mode,pick,spec,car,lap,cpIdx,startT,finT,done,fuseT,ph,turnT,lapFlash;
const CP=[0,45,90,135].map(i=>PTS[i]);
function reset(){mode='fuse';pick=[];spec=null;done=false;fuseT=0;ph=0;turnT=0;lapFlash=0;fx.clear()}
function race(){
  spec=fuse(pick[0],pick[1]);
  car={x:PTS[0].x,y:PTS[0].y,a:Math.atan2(PTS[1].y-PTS[0].y,PTS[1].x-PTS[0].x),sp:0};
  lap=1;cpIdx=1;startT=performance.now();finT=0;done=false;mode='race';
  SFX.select();
}
reset();
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();keys[k]=true;
  if(k.startsWith('arrow'))e.preventDefault();
  if(k==='r'){reset();return}
  if(k==='m'){SFX.toggle();return}
  if(mode==='fuse'){
    if('1234'.includes(k)&&pick.length<2){
      pick.push(+k-1);SFX.ui();
      if(pick.length===2){fuseT=0.9;SFX.power();
        fx.burst(W/2-168,368,30,{spd:220,life:.8,r:4,col:['#fff2a0','#ffd23f','#ffffff'],pick:true,shape:'star',drag:2,add:true});
        fx.emit({x:W/2-168,y:368,life:.5,r:10,r2:110,col:'#ffd23f',shape:'ring',lw:6,drag:0})}
    }
    if(k==='backspace'){e.preventDefault();if(pick.length){pick.pop();SFX.miss()}}
    if(k==='enter'&&pick.length===2)race();
  }
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
GFX.trackKeys(keys);

function update(dt,now){
  fx.update(dt);
  if(fuseT>0)fuseT-=dt;
  if(lapFlash>0)lapFlash-=dt;
  if(mode!=='race'||done)return;
  const road=onRoad(car.x,car.y);
  const max=road?spec.top:74;
  const lf=keys.arrowleft||keys.a, rt=keys.arrowright||keys.d;
  if(keys.arrowup||keys.w){if(car.sp<max)car.sp=Math.min(max,car.sp+spec.acc*dt)}
  else if(keys.arrowdown||keys.s)car.sp-=310*dt;
  else car.sp*=1-1.4*dt;
  if(car.sp<-80)car.sp=-80;
  if(car.sp>max)car.sp=max+(car.sp-max)*Math.exp(-5*dt);
  const t=spec.grip*Math.min(1,Math.abs(car.sp)/50)*(car.sp<0?-1:1);
  if(lf)car.a-=t*dt;
  if(rt)car.a+=t*dt;
  car.x+=Math.cos(car.a)*car.sp*dt;
  car.y+=Math.sin(car.a)*car.sp*dt;
  ph=(ph+Math.abs(car.sp)*dt/3.6)%1000;
  turnT=(lf||rt)&&Math.abs(car.sp)>150&&road?turnT+dt:0;
  const b=car.a+Math.PI,ca=Math.cos(car.a),sa=Math.sin(car.a);
  if(Math.random()<0.4)fx.emit({x:car.x+ca*-18*0.86,y:car.y+sa*-18*0.86,vx:Math.cos(b)*30,vy:Math.sin(b)*30,life:.5,r:1.5,r2:5,col:'rgba(160,180,220,.25)',shape:'smoke',drag:1.6});
  if(Math.abs(car.sp)>90&&(lf||rt||!road)){
    fx.emit({x:car.x+Math.cos(b)*16,y:car.y+Math.sin(b)*16,
      vx:(Math.random()-.5)*50,vy:(Math.random()-.5)*50,life:.5,r:3,r2:8,
      col:road?'rgba(190,220,255,.3)':'rgba(120,150,190,.5)',drag:1.4,shape:'smoke'});
  }
  if(turnT>0.25){const lv=turnT>1.3?'#ffa040':turnT>0.7?'#6fd8ff':'#ffffff';
    [-1,1].forEach(sd=>{if(Math.random()<0.6)fx.emit({x:car.x+Math.cos(b)*10-sa*sd*12,y:car.y+Math.sin(b)*10+ca*sd*12,
      vx:Math.cos(b+(Math.random()-.5))*120,vy:Math.sin(b+(Math.random()-.5))*120,life:.25,r:1.4,col:lv,shape:'line',add:true,drag:3})})}
  SFX.engine(Math.abs(car.sp)/spec.top,road?1:0.85);
  SFX.skid((lf||rt)&&Math.abs(car.sp)>130,0.45);

  const g=CP[cpIdx];
  if(Math.hypot(car.x-g.x,car.y-g.y)<76){
    cpIdx=(cpIdx+1)%4;
    if(cpIdx===1){lap++;lapFlash=1.5;
      if(lap>3){done=true;finT=(now-startT)/1000;SFX.engine(0);SFX.skid(false);SFX.win()}
      else SFX.lap();}
  }
}

function render(now){
  const t=now/1000;
  if(mode==='fuse'){
    GFX.skyGrad(ctx,W,H,[[0,'#0c1024'],[1,'#1b2440']]);
    // lab backdrop: hex grid and drifting energy motes
    ctx.strokeStyle='rgba(120,180,255,.07)';ctx.lineWidth=1;
    for(let y=0;y<H;y+=26)for(let x=(y/26%2)*15;x<W;x+=30){ctx.beginPath();for(let k=0;k<6;k++){const a=k/6*TAU;ctx.lineTo(x+Math.cos(a)*14,y+Math.sin(a)*14)}ctx.closePath();ctx.stroke()}
    GFX.weather(ctx,W,H,t,'fireflies',18,{col:'#7fe4ff'});
    GFX.glowText(ctx,'KART FUSION',W/2,52,{font:'italic 900 30px Segoe UI',fill:'#7fe4ff',blur:22,stroke:'rgba(0,0,0,.5)',strokeW:5});
    ctx.fillStyle='#8d93a4';ctx.font='13px Segoe UI';ctx.textAlign='center';
    ctx.fillText('first part sets top speed · second part sets acceleration',W/2,78);

    PARTS.forEach((p,i)=>{
      const x=104+i*171,y=168,sel=pick.indexOf(i);
      const lift=sel>=0?Math.sin(t*3+i)*2-3:0;
      ctx.save();
      if(sel>=0){ctx.shadowColor=p.col;ctx.shadowBlur=24}
      GFX.panel(ctx,x-72,y-62+lift,144,140,{r:14,
        top:sel>=0?'rgba(32,40,60,.96)':'rgba(20,24,36,.9)',
        border:sel>=0?GFX.alpha(p.col,0.85):'rgba(255,255,255,.10)'});
      ctx.restore();
      ctx.save();ctx.translate(x,y-12+lift);ctx.scale(1,0.35);
      ctx.strokeStyle=sel>=0?GFX.alpha(p.col,0.8):'rgba(255,255,255,.15)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,44,0,TAU);ctx.stroke();
      ctx.restore();
      GFX.glow(ctx,x,y-18+lift,52,p.col,sel>=0?0.4:0.15);
      GFX.kartTop(ctx,{x,y:y-18+lift,a:-Math.PI/2+(sel>=0?Math.sin(t*1.5)*0.25:0),s:1.35,col:p.col,acc:'#f4f4f8',id:'p'+i,v:0});
      ctx.fillStyle='#fff';ctx.font='bold 16px Segoe UI';ctx.textAlign='center';
      ctx.fillText(p.name,x,y+38+lift);
      ctx.fillStyle=sel>=0?p.col:'#5a6172';ctx.font='bold 11px Segoe UI';
      ctx.fillText(sel>=0?(sel===0?'▸ FIRST':'▸ SECOND'):('press '+(i+1)),x,y+58+lift);
    });

    if(pick.length===2){
      const f=fuse(pick[0],pick[1]);
      const pulse=fuseT>0?1+fuseT*0.6:1;
      GFX.panel(ctx,W/2-250,286,500,166,{r:16,border:'rgba(255,210,63,.5)'});
      ctx.save();ctx.translate(W/2-168,368);
      // energy rings orbiting the fused kart
      for(let k=0;k<3;k++){ctx.save();ctx.rotate(t*(1+k*0.4)*(k%2?-1:1));ctx.scale(1,0.4+k*0.15);
        ctx.strokeStyle='rgba(255,220,120,'+(0.25+0.15*k)+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,54+k*6,0,TAU);ctx.stroke();ctx.restore()}
      ctx.scale(pulse,pulse);
      GFX.glow(ctx,0,0,64,'#ffe38a',fuseT>0?0.55:0.25);
      fusedKart(ctx,{x:0,y:0,a:-Math.PI/2+Math.sin(now/700)*0.14,s:2.1,colA:f.colA,colB:f.colB,ph:(t*2)%1});
      ctx.restore();
      ctx.fillStyle='#fff';ctx.font='bold 20px Segoe UI';ctx.textAlign='left';
      ctx.fillText(f.name,W/2-84,316);
      GFX.statBar(ctx,W/2-84,330,300,10,f.top/300,'#ff7a4a','TOP SPEED');
      GFX.statBar(ctx,W/2-84,368,300,10,f.acc/320,'#5fd06a','ACCELERATION');
      GFX.statBar(ctx,W/2-84,406,300,10,f.grip/3.6,'#3ba7e8','GRIP');
      GFX.gloss(ctx,W/2-250,286,500,166,now,0.07);
      GFX.glowText(ctx,'ENTER to race   ·   BACKSPACE to undo',W/2,442,
        {font:'bold 14px Segoe UI',fill:'#ffd23f',blur:12});
    }else{
      ctx.fillStyle='#6a7488';ctx.font='15px Segoe UI';ctx.textAlign='center';
      ctx.fillText('select '+(2-pick.length)+' more part'+(pick.length===1?'':'s'),W/2,340);
    }
    fx.draw(ctx);
    GFX.bloom(ctx,c,0.36);
    GFX.grain(ctx,W,H,0.045);
    GFX.vignette(ctx,W,H,0.5);
    return;
  }

  ctx.fillStyle='#131c2a';ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2,H*0.62);ctx.rotate(-car.a-Math.PI/2);ctx.translate(-car.x,-car.y);
  ctx.drawImage(world,0,0);
  // neon pylons: lights chase around the lap
  PYL.forEach((p,k)=>{
    if(Math.abs(p.x-car.x)>520||Math.abs(p.y-car.y)>520)return;
    const on=0.55+0.45*Math.sin(t*6-p.i*0.15);
    GFX.glow(ctx,p.x,p.y,30,p.col,0.5*on);
    ctx.fillStyle=p.col;ctx.globalAlpha=0.6+0.4*on;GFX.rr(ctx,p.x-3,p.y-16,6,32,3);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(p.x-1,p.y-14,1.4,28);
  });
  fx.draw(ctx);
  const steer=((keys.arrowright||keys.d)?0.45:0)-((keys.arrowleft||keys.a)?0.45:0);
  if(car.sp>spec.top-8)GFX.flameTop(ctx,car.x,car.y,car.a,0.86,0.4);
  fusedKart(ctx,{x:car.x,y:car.y,a:car.a,s:0.86,colA:spec.colA,colB:spec.colB,steer,ph:ph%1});
  ctx.restore();
  GFX.weather(ctx,W,H,t,'sparkle',10,{col:'#bfe6ff'});
  GFX.bloom(ctx,c,0.34);
  GFX.grain(ctx,W,H,0.045);
  GFX.vignette(ctx,W,H,0.52);
  GFX.speedLines(ctx,W,H,GFX.clamp((car.sp-150)/140,0,1)*0.5,'#bcd8ff');
  drawHUD(now);
}
function drawHUD(now){
  GFX.panel(ctx,12,12,232,66,{r:12,accent:spec.colA});
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.fillStyle=spec.colA;GFX.rr(ctx,26,21,9,9,2);ctx.fill();
  ctx.fillStyle=spec.colB;GFX.rr(ctx,37,21,9,9,2);ctx.fill();
  GFX.hudText(ctx,spec.name.toUpperCase(),52,30,'bold 12px Segoe UI','#fff');
  GFX.hudText(ctx,'LAP',26,48,'10px Segoe UI','#8d93a4');
  GFX.hudText(ctx,Math.min(lap,3)+'/3',26,70,'bold 21px Segoe UI','#fff');
  GFX.hudText(ctx,'TIME',108,48,'10px Segoe UI','#8d93a4');
  GFX.hudText(ctx,((done?finT*1000:now-startT)/1000).toFixed(1)+'s',108,70,'bold 19px Segoe UI','#ffd75e');
  GFX.speedo(ctx,W-62,H-56,36,car.sp/spec.top,(car.sp/1.6)|0,{cols:['#4fd0e0','#ffd75e','#ff5a9a'],hot:car.sp>spec.top-8});
  const ms=0.08,ox=W-WW*ms-18,oy=16;
  GFX.panel(ctx,ox-8,oy-8,WW*ms+16,WH*ms+16,{r:10});
  ctx.beginPath();PTS.forEach((p,i)=>i?ctx.lineTo(ox+p.x*ms,oy+p.y*ms):ctx.moveTo(ox+p.x*ms,oy+p.y*ms));ctx.closePath();
  ctx.lineJoin='round';ctx.strokeStyle='rgba(0,0,0,.6)';ctx.lineWidth=7;ctx.stroke();
  ctx.strokeStyle='rgba(150,200,255,.75)';ctx.lineWidth=4;ctx.stroke();
  ctx.fillStyle=spec.colA;ctx.strokeStyle='#fff';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.arc(ox+car.x*ms,oy+car.y*ms,4,0,TAU);ctx.fill();ctx.stroke();
  if(lapFlash>0&&!done){
    ctx.globalAlpha=Math.min(1,lapFlash*1.5);
    GFX.glowText(ctx,lap===3?'FINAL LAP!':'LAP '+lap,W/2,120,{font:'italic 900 32px Segoe UI',fill:'#7fe4ff',stroke:'rgba(0,0,0,.6)',strokeW:6,blur:22});
    ctx.globalAlpha=1;
  }
}

let last=performance.now();
function loop(now){
  const dt=Math.max(0,Math.min(0.04,(now-last)/1000));last=now;
  update(dt,now);render(now);
  if(done)GFX.banner(ctx,W,H,finT.toFixed(2)+'s',spec.name+' · 3 laps · press R');
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
