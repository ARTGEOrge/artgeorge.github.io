<meta charset="utf-8">
<title>Kart 7 — Glider Run</title>
<style>
  html,body{margin:0;height:100%;background:#080810;color:#fff;
    font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px}
  canvas{border:3px solid #23232f;border-radius:8px;background:#66b8e8;
    box-shadow:0 18px 60px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.05)}
  #hud{font-size:14px;letter-spacing:2px;color:#8d93a4}
</style>
<script src="kart-gfx.js"></script>
<script src="kart-audio.js"></script>
<canvas id="c" width="720" height="470"></canvas>
<div id="hud">Arrows / WASD to steer the glider · fly through every ring · R restart · M mute</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=c.width,H=c.height,FOV=340,TAU=Math.PI*2;

const fx=new GFX.Particles(300);
const keys={};
let px,py,vx,vy,rings,passed,missed,dist,done,startT,finT,shake,pop;
function reset(){
  px=0;py=0;vx=0;vy=0;dist=0;passed=0;missed=0;done=false;shake=0;pop=0;
  startT=performance.now();finT=0;fx.clear();
  rings=[];
  for(let i=0;i<20;i++)rings.push({
    z:500+i*430,r:78,
    x:Math.sin(i*1.7)*150+Math.sin(i*0.6)*70,
    y:Math.cos(i*1.3)*95,hit:0,
    col:i%5===4?'#ff8adc':'#ffd23f'
  });
}
reset();
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;
  if(k.startsWith('arrow'))e.preventDefault(); if(k==='r')reset();
  if(k==='m')SFX.toggle()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
GFX.trackKeys(keys);

const SPD=560;
function update(dt,now){
  fx.update(dt);
  if(shake>0)shake-=dt;
  if(pop>0)pop-=dt;
  if(done)return;
  const ax=((keys.arrowright||keys.d)?1:0)-((keys.arrowleft||keys.a)?1:0);
  const ay=((keys.arrowdown||keys.s)?1:0)-((keys.arrowup||keys.w)?1:0);
  vx+=ax*620*dt; vy+=ay*520*dt;
  vx*=1-2.2*dt; vy*=1-2.2*dt;
  px+=vx*dt; py+=vy*dt;
  py+=30*dt;
  px=Math.max(-330,Math.min(330,px));
  py=Math.max(-200,Math.min(210,py));
  dist+=SPD*dt;

  // wingtip vapour
  if(Math.abs(vx)>120&&Math.random()<0.6){
    fx.emit({x:W/2+(vx>0?-86:86),y:H-92,vx:-vx*0.12,vy:14,
      life:.5,r:4,r2:0,col:'rgba(255,255,255,.55)',drag:1.2});
  }

  rings.forEach(r=>{
    const prev=r.z;
    r.z-=SPD*dt;
    if(r.hit)return;
    if(prev>0&&r.z<=0){
      const d=Math.hypot(r.x-px,r.y-py);
      if(d<r.r){
        r.hit=1;passed++;pop=0.5;SFX.ring();
        fx.burst(W/2,H/2,22,{spd:260,life:.55,r:5,col:r.col,shape:'spark',drag:2.4});
      }else{r.hit=-1;missed++;shake=0.35;SFX.miss()}
    }
  });
  // wind noise rises with how hard you are manoeuvring
  SFX.engine(0.30+Math.min(0.5,(Math.abs(vx)+Math.abs(vy))/900),0.55);
  if(rings.every(r=>r.hit)&&!done){done=true;finT=(now-startT)/1000;
    SFX.engine(0);passed>=15?SFX.win():SFX.lose()}
}

function project(x,y,z){
  const s=FOV/z;
  return{sx:W/2+(x-px)*s,sy:H/2+(y-py)*s,s};
}
function render(now){
  GFX.skyGrad(ctx,W,H,[[0,'#0f3f96'],[0.30,'#3d84cf'],[0.56,'#9fd4ee'],[0.62,'#cfe9f5'],[1,'#1d6f9e']]);
  GFX.sun(ctx,W*0.30,H*0.20,20,'#fff2c0');
  GFX.cloudBand(ctx,W,H*0.15,-dist*0.10,1.2,'rgba(255,255,255,.40)');
  GFX.cloudBand(ctx,W,H*0.30,-dist*0.18,0.8,'rgba(255,255,255,.60)');
  GFX.lightShafts(ctx,W,H,W*0.30,H*0.20,0.9,'#fff2c0');

  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*11,(Math.random()-.5)*11);

  // sea with sun glint
  const sea=ctx.createLinearGradient(0,H*0.58,0,H);
  sea.addColorStop(0,'#3f9ec4');sea.addColorStop(1,'#12496e');
  ctx.fillStyle=sea;ctx.fillRect(0,H*0.58,W,H*0.42);
  ctx.strokeStyle='rgba(255,255,255,.20)';ctx.lineWidth=1;
  for(let i=1;i<=26;i++){
    const z=i*260-(dist%260);
    if(z<=10)continue;
    const a=project(-1500,340,z),b=project(1500,340,z);
    ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);ctx.stroke();
  }
  for(let gx=-1500;gx<=1500;gx+=300){
    const a=project(gx,340,60),b=project(gx,340,26*260);
    ctx.beginPath();ctx.moveTo(a.sx,a.sy);ctx.lineTo(b.sx,b.sy);ctx.stroke();
  }
  GFX.ripple(ctx,0,H*0.60,W,H*0.34,now,'rgba(255,255,255,.24)');
  // islands
  for(let i=0;i<7;i++){
    const z=((i*940)-(dist%6580))+300;
    if(z<60)continue;
    const p=project((i%2?1:-1)*(560+i*70),330,z);
    const s=p.s*220;
    if(s<2)continue;
    ctx.fillStyle='rgba(58,120,80,.85)';
    ctx.beginPath();ctx.ellipse(p.sx,p.sy,s,s*0.34,0,Math.PI,TAU);ctx.fill();
    ctx.fillStyle='rgba(214,196,140,.8)';
    ctx.beginPath();ctx.ellipse(p.sx,p.sy,s*1.15,s*0.13,0,0,TAU);ctx.fill();
  }

  // rings, far first
  rings.filter(r=>r.z>14).sort((a,b)=>b.z-a.z).forEach(r=>{
    const p=project(r.x,r.y,r.z);
    const rad=r.r*p.s;
    if(rad<1.5)return;
    const near=GFX.clamp(1-r.z/2600,0,1);
    ctx.save();
    ctx.shadowColor=r.col;ctx.shadowBlur=18*near;
    ctx.strokeStyle=GFX.alpha(r.col,0.35+near*0.6);
    ctx.lineWidth=Math.max(2,12*p.s);
    ctx.beginPath();ctx.ellipse(p.sx,p.sy,rad,rad*0.94,0,0,TAU);ctx.stroke();
    ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,'+(0.25+near*0.45)+')';
    ctx.lineWidth=Math.max(1,3.5*p.s);
    ctx.beginPath();ctx.ellipse(p.sx,p.sy,rad*0.88,rad*0.83,0,-2.4,0.4);ctx.stroke();
  });
  fx.draw(ctx);
  ctx.restore();

  drawGlider();
  GFX.speedLines(ctx,W,H,0.28+(pop>0?0.5:0));
  GFX.bloom(ctx,c,0.30);
  GFX.grain(ctx,W,H,0.04);
  GFX.vignette(ctx,W,H,0.46);
  drawHUD(now);
}
function drawGlider(){
  const bank=GFX.clamp(vx/450,-0.5,0.5), pitch=GFX.clamp(vy/500,-0.35,0.35);
  ctx.save();ctx.translate(W/2,H-96+pitch*22);ctx.rotate(bank*0.52);
  ctx.fillStyle='rgba(0,0,0,.18)';
  ctx.beginPath();ctx.ellipse(0,34,74,9,0,0,TAU);ctx.fill();
  // wing
  const wg=ctx.createLinearGradient(0,-30,0,14);
  wg.addColorStop(0,'#ffffff');wg.addColorStop(0.55,'#dfe4ee');wg.addColorStop(1,'#a9b2c4');
  ctx.fillStyle=wg;
  ctx.beginPath();
  ctx.moveTo(-92,2);ctx.quadraticCurveTo(-46,-30,0,-30);
  ctx.quadraticCurveTo(46,-30,92,2);
  ctx.quadraticCurveTo(46,14,0,14);
  ctx.quadraticCurveTo(-46,14,-92,2);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=1.6;ctx.stroke();
  ctx.fillStyle='#d8342a';
  ctx.beginPath();
  ctx.moveTo(-92,2);ctx.quadraticCurveTo(-46,-30,0,-30);
  ctx.lineTo(0,14);ctx.quadraticCurveTo(-46,14,-92,2);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=1.2;
  [-60,-30,30,60].forEach(x=>{ctx.beginPath();ctx.moveTo(x,-22);ctx.lineTo(x*0.96,12);ctx.stroke()});
  // rigging + kart
  ctx.strokeStyle='rgba(40,40,50,.75)';ctx.lineWidth=1.6;
  ctx.beginPath();ctx.moveTo(-22,12);ctx.lineTo(-13,26);
  ctx.moveTo(22,12);ctx.lineTo(13,26);ctx.stroke();
  ctx.fillStyle='#2f2f3b';GFX.rr(ctx,-24,26,48,20,7);ctx.fill();
  ctx.fillStyle='#3ba7e8';GFX.rr(ctx,-19,29,38,12,5);ctx.fill();
  ctx.fillStyle='#111119';
  GFX.rr(ctx,-26,32,7,13,3);ctx.fill();GFX.rr(ctx,19,32,7,13,3);ctx.fill();
  ctx.fillStyle='#f0c49a';ctx.beginPath();ctx.arc(0,24,8,0,TAU);ctx.fill();
  ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.arc(0,23,8.4,Math.PI,TAU);ctx.fill();
  ctx.restore();
}
function drawHUD(now){
  GFX.panel(ctx,12,12,206,64,{r:12});
  ctx.textAlign='left';
  ctx.fillStyle='#8d93a4';ctx.font='10px Segoe UI';ctx.fillText('RINGS',26,30);
  ctx.fillStyle='#fff';ctx.font='bold 25px Segoe UI';ctx.fillText(passed+'/20',26,57);
  ctx.fillStyle='#8d93a4';ctx.font='10px Segoe UI';ctx.fillText('MISSED',110,30);
  ctx.fillStyle=missed?'#ff6a5a':'#6dd6a0';ctx.font='bold 25px Segoe UI';
  ctx.fillText(missed,110,57);
  ctx.fillStyle='#8d93a4';ctx.font='10px Segoe UI';ctx.fillText('TIME',166,30);
  ctx.fillStyle='#ffd75e';ctx.font='bold 16px Segoe UI';
  ctx.fillText(((done?finT*1000:now-startT)/1000).toFixed(1)+'s',162,54);

  // ring progress pips
  const bx=W/2-rings.length*7;
  rings.forEach((r,i)=>{
    ctx.fillStyle=r.hit===1?'#6dd6a0':r.hit===-1?'#ff6a5a':'rgba(255,255,255,.22)';
    GFX.rr(ctx,bx+i*14,18,9,7,3);ctx.fill();
  });
}

let last=performance.now();
function loop(now){
  const dt=Math.min(0.04,(now-last)/1000);last=now;
  update(dt,now);render(now);
  if(done)GFX.banner(ctx,W,H,passed+'/20 RINGS',finT.toFixed(2)+'s  ·  press R');
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
