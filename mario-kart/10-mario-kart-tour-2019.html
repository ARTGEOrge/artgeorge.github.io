<meta charset="utf-8">
<title>Kart Tour — One-Thumb Endless</title>
<style>
  html,body{margin:0;height:100%;background:#080810;color:#fff;
    font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px}
  body{background:radial-gradient(ellipse at 50% 0%,#2a1c4a 0%,#080810 65%)}
  canvas{border:3px solid #23232f;border-radius:26px;background:#151a30;max-width:100vw;max-height:88vh;
    box-shadow:0 18px 60px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.05)}
  #hud{font-size:14px;letter-spacing:2px;color:#8d93a4;text-align:center}
</style>
<script src="kart-gfx.js"></script>
<script src="kart-audio.js"></script>
<canvas id="c" width="390" height="640"></canvas>
<div id="hud">← / → (or A / D) switch lane · 3 items in a row = FRENZY · R restart · M mute</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=c.width,H=c.height,TAU=Math.PI*2;
const LANES=[W*0.27,W*0.5,W*0.73];
const RL=W*0.12,RR=W*0.88;

/* city skylines, tiled vertically as the road scrolls: a far, dim layer and a near one */
function makeCity(seed,far){
  const cv=document.createElement('canvas');cv.width=W;cv.height=260;
  const g=cv.getContext('2d');
  for(let side=0;side<2;side++){
    for(let i=0;i<6;i++){
      const h=GFX.hash(i*7.3+seed+side*31);
      const bw=(far?20:26)+((i*37+seed)%26), bh=70+((i*53+seed*3)%150);
      const x=side? W-6-bw-((i*11)%18)-(far?24:0) : 6+((i*11)%18)+(far?24:0);
      const y=260-bh-((i*29)%40);
      const base=far?['#1a1f3a','#171c34','#1e2442'][i%3]:['#232a49','#1c2240','#2b3358'][i%3];
      const bg=g.createLinearGradient(x,0,x+bw,0);bg.addColorStop(0,GFX.light(base,0.08));bg.addColorStop(1,GFX.dark(base,0.25));
      g.fillStyle=bg;g.fillRect(x,y,bw,bh);
      g.fillStyle='rgba(0,0,0,.3)';g.fillRect(x,y,bw,4);
      g.fillStyle=GFX.light(base,0.15);g.fillRect(x+2,y-3,bw-4,3);
      if(h>0.5){g.fillStyle='#3a4258';g.fillRect(x+bw/2-1,y-14,2,11)}
      for(let wy=y+8;wy<260-8;wy+=11)for(let wx=x+4;wx<x+bw-4;wx+=8){
        if(((wx*7+wy*13+seed)%5)<2)continue;
        g.fillStyle=far?'rgba(255,214,120,.35)':((wx+wy)%3)?'rgba(255,214,120,.75)':'rgba(140,200,255,.55)';
        g.fillRect(wx,wy,4,6);
      }
      if(!far&&i%3===0){
        g.fillStyle='#ff5a8a';g.fillRect(x+3,y+6,bw-6,3);
        g.fillStyle='#4fd0e0';g.fillRect(x+3,y+14,bw-10,2);
      }
    }
  }
  return cv;
}
const CITYFAR=makeCity(17,true),CITY=makeCity(0,false);
// road texture tile: grain, patches and a manhole
const ROADTILE=document.createElement('canvas');ROADTILE.width=Math.round(RR-RL);ROADTILE.height=320;
(function(){
  const g=ROADTILE.getContext('2d'),w=ROADTILE.width;
  const rg=g.createLinearGradient(0,0,w,0);
  rg.addColorStop(0,'#262a46');rg.addColorStop(0.5,'#30355a');rg.addColorStop(1,'#262a46');
  g.fillStyle=rg;g.fillRect(0,0,w,320);
  for(let i=0;i<1600;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.035)':'rgba(0,0,0,.08)';g.fillRect(Math.random()*w,Math.random()*320,2,2)}
  g.fillStyle='rgba(0,0,0,.14)';g.fillRect(w*0.18,40,60,26);g.fillRect(w*0.6,200,44,40);
  g.fillStyle='#1c1f34';g.beginPath();g.arc(w*0.72,90,13,0,TAU);g.fill();
  g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=1.5;g.beginPath();g.arc(w*0.72,90,10,0,TAU);g.stroke();
  for(let k=-2;k<=2;k++){g.beginPath();g.moveTo(w*0.72-9,90+k*3.5);g.lineTo(w*0.72+9,90+k*3.5);g.stroke()}
  g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=1;g.beginPath();g.moveTo(30,250);g.lineTo(44,262);g.lineTo(40,280);g.stroke();
})();

const fx=new GFX.Particles(480);
const keys={};
let lane,px,items,spd,dist,coins,score,frenzy,combo,hp,done,scroll,shake,tilt,roll,hitFlash;
function reset(){
  lane=1;px=LANES[1];items=[];spd=300;dist=0;coins=0;score=0;
  frenzy=0;combo=0;hp=3;done=false;scroll=0;shake=0;tilt=0;roll=0;hitFlash=0;fx.clear();
}
reset();
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k.startsWith('arrow'))e.preventDefault();
  if(k==='r')reset();
  if(k==='m')SFX.toggle();
  if(!done){
    if((k==='arrowleft'||k==='a')&&!keys[k]&&lane>0){lane--;SFX.ui()}
    if((k==='arrowright'||k==='d')&&!keys[k]&&lane<2){lane++;SFX.ui()}
  }
  keys[k]=true;
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
GFX.trackKeys(keys);

let spawnT=0;
function update(dt){
  fx.update(dt);
  fx.a.forEach(p=>{p.y+=spd*dt*0.6});          // particles stay on the scrolling road
  if(shake>0)shake-=dt;
  if(hitFlash>0)hitFlash-=dt;
  if(done)return;
  if(frenzy>0)frenzy-=dt;
  spd=300+dist*0.02+(frenzy>0?260:0);
  dist+=spd*dt/50;
  scroll=(scroll+spd*dt)%80;
  roll+=spd*dt;
  const prev=px;
  px+=(LANES[lane]-px)*Math.min(1,12*dt);
  // dt can legitimately be 0 (two rAF callbacks in the same millisecond);
  // dividing by it produced NaN, which then silently killed the whole frame
  if(dt>0)tilt=GFX.clamp((px-prev)/dt/900,-0.5,0.5);
  SFX.engine(GFX.clamp(spd/900,0,1),frenzy>0?1.3:1);

  if(frenzy>0&&Math.random()<0.8){
    fx.emit({x:px+(Math.random()-.5)*30,y:H-72,vx:(Math.random()-.5)*60,vy:180+Math.random()*90,
      life:.45,r:3,r2:0,col:['#ffd23f','#ff7ad0','#4fd0e0'][(Math.random()*3)|0],drag:1,shape:'star',add:true});
  }

  spawnT-=dt;
  if(spawnT<=0){
    spawnT=Math.max(0.28,0.72-dist/2600);
    const n=Math.random()<0.35?2:1;
    const used=[];
    for(let i=0;i<n;i++){
      let L;do{L=(Math.random()*3)|0}while(used.includes(L));
      used.push(L);
      items.push({L,y:-40,type:Math.random()<0.42?'block':'coin',ph:Math.random()*9});
    }
    if(used.length===2&&Math.random()<0.5){
      const free=[0,1,2].find(l=>!used.includes(l));
      items.push({L:free,y:-40,type:'coin',ph:Math.random()*9});
    }
  }

  items=items.filter(it=>{
    it.y+=spd*dt;
    if(it.y>H+40)return false;
    if(Math.abs(it.y-(H-104))<26&&Math.abs(LANES[it.L]-px)<34){
      if(it.type==='coin'){
        coins++;combo++;score+=frenzy>0?30:12;SFX.coin();
        GFX.FX.pickup(fx,LANES[it.L],it.y,'#ffd23f',1.1);
        if(combo%3===0){frenzy=3.2;shake=0.25;SFX.frenzy();
          fx.burst(px,H-104,30,{spd:260,life:.8,r:4,col:['#ff7ad0','#ffd23f','#4fd0e0'],pick:true,shape:'star',drag:1.8,add:true});
          fx.emit({x:px,y:H-104,life:.5,r:10,r2:120,col:'#ff7ad0',shape:'ring',lw:6,drag:0})}
        return false;
      }
      if(frenzy>0){
        score+=45;SFX.pop();
        GFX.FX.hit(fx,LANES[it.L],it.y,'#ff9a3c',1);
        fx.burst(LANES[it.L],it.y,10,{spd:200,life:.6,r:4,col:'#b3763f',shape:'square',drag:1.5,grav:300});
        return false;
      }
      hp--;combo=0;score=Math.max(0,score-25);shake=0.4;hitFlash=0.35;SFX.hit();
      GFX.FX.hit(fx,LANES[it.L],it.y,'#ff6a5a',1);
      fx.burst(LANES[it.L],it.y,12,{spd:200,life:.6,r:4,col:'#c98a4a',shape:'square',drag:1.5,grav:300});
      if(hp<=0){done=true;SFX.engine(0);SFX.lose()}
      return false;
    }
    return true;
  });
  score+=spd*dt*0.02;
}

function render(now){
  const t=now/1000;
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*9,(Math.random()-.5)*9);

  GFX.skyGrad(ctx,W,H,[[0,'#0e1230'],[0.4,'#232a52'],[1,'#3a3060']]);
  // moon with craters + twinkling stars
  GFX.glow(ctx,W-64,74,60,'#fff3c8',0.25);
  ctx.fillStyle='rgba(255,247,214,.9)';ctx.beginPath();ctx.arc(W-64,74,20,0,TAU);ctx.fill();
  ctx.fillStyle='rgba(200,190,160,.5)';[[-6,-4,4],[5,6,3],[6,-7,2]].forEach(([a,b,r])=>{ctx.beginPath();ctx.arc(W-64+a,74+b,r,0,TAU);ctx.fill()});
  ctx.fillStyle='#232a52';ctx.beginPath();ctx.arc(W-73,68,18,0,TAU);ctx.fill();
  for(let i=0;i<50;i++){
    ctx.fillStyle='rgba(255,255,255,'+(0.15+0.35*Math.abs(Math.sin(t*1.5+i)))+')';
    ctx.fillRect((i*97)%W,(i*53)%240,1.6,1.6);
  }
  ctx.drawImage(CITYFAR,0,((scroll*0.2+roll*0.05)%260)-260+90);
  ctx.drawImage(CITYFAR,0,((scroll*0.2+roll*0.05)%260)+90);
  ctx.drawImage(CITY,0,((roll*0.35)%260)-260+120);
  ctx.drawImage(CITY,0,((roll*0.35)%260)+120);
  ctx.drawImage(CITY,0,((roll*0.35)%260)+380);
  // blinking aircraft beacons on rooftops
  for(let i=0;i<6;i++)if(((t*1.5+i*0.37)%1)<0.2)GFX.glow(ctx,i%2?W-30-i*6:28+i*6,((roll*0.35+i*97)%520)-30,6,'#ff4a3a',0.9);

  // road surface tiles scrolling with the race
  const rw=RR-RL,off=roll%320;
  for(let y=off-320;y<H;y+=320)ctx.drawImage(ROADTILE,RL,y);
  // neon reflections smeared down the wet road
  ctx.save();ctx.globalCompositeOperation='lighter';
  [[RL+8,'#4fd0e0'],[RR-8,'#ff5a8a']].forEach(([x,col])=>{
    const g=ctx.createLinearGradient(x-14,0,x+14,0);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.5,GFX.alpha(col,0.12));g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(x-14,0,28,H);
  });
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(RL,0,4,H);
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(RR-4,0,4,H);
  // neon kerbs with glow
  ctx.save();ctx.shadowBlur=12;
  ctx.shadowColor='#4fd0e0';ctx.fillStyle='#4fd0e0';ctx.fillRect(RL-3,0,3,H);
  ctx.shadowColor='#ff5a8a';ctx.fillStyle='#ff5a8a';ctx.fillRect(RR,0,3,H);
  ctx.restore();
  ctx.strokeStyle='rgba(255,255,255,.38)';ctx.lineWidth=3;ctx.setLineDash([26,34]);
  [0,1].forEach(i=>{
    const x=(LANES[i]+LANES[i+1])/2;
    ctx.beginPath();ctx.moveTo(x,-80+scroll);ctx.lineTo(x,H);ctx.stroke();
  });
  ctx.setLineDash([]);
  // street lamps on both pavements with pools of light
  const sp=220,lo=roll%sp;
  for(let y=lo-sp;y<H+sp;y+=sp){
    [[RL-14,1],[RR+14,-1]].forEach(([x,d],k)=>{
      const yy=y+k*sp/2;
      GFX.glow(ctx,x+d*26,yy+12,46,'#ffd9a0',0.22);
      ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.ellipse(x+3,yy+4,5,3,0,0,TAU);ctx.fill();
      ctx.fillStyle='#3a3f56';ctx.beginPath();ctx.arc(x,yy,4,0,TAU);ctx.fill();
      ctx.strokeStyle='#4a5070';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x+d*24,yy+10);ctx.stroke();
      ctx.fillStyle='#fff3c0';ctx.beginPath();ctx.arc(x+d*24,yy+10,3,0,TAU);ctx.fill();
      GFX.glow(ctx,x+d*24,yy+10,12,'#ffe7a0',0.8);
    });
  }

  if(frenzy>0){
    const a=0.09+0.05*Math.sin(now/70);
    const fg=ctx.createLinearGradient(0,0,W,H);
    fg.addColorStop(0,'rgba(255,210,63,'+a+')');
    fg.addColorStop(0.5,'rgba(255,122,208,'+a+')');
    fg.addColorStop(1,'rgba(79,208,224,'+a+')');
    ctx.fillStyle=fg;ctx.fillRect(0,0,W,H);
  }

  fx.draw(ctx);

  items.forEach(it=>{
    const x=LANES[it.L];
    ctx.fillStyle='rgba(0,0,0,.32)';
    ctx.beginPath();ctx.ellipse(x+3,it.y+20,16,5,0,0,TAU);ctx.fill();
    if(it.type==='coin'){
      const sq=Math.abs(Math.cos(now/260+it.ph));
      GFX.glow(ctx,x,it.y,26,'#ffd23f',0.45);
      ctx.fillStyle='#a8700f';
      ctx.beginPath();ctx.ellipse(x+1,it.y,13*sq+2,13,0,0,TAU);ctx.fill();
      ctx.fillStyle='#e0a91c';
      ctx.beginPath();ctx.ellipse(x,it.y,13*sq+1.6,13,0,0,TAU);ctx.fill();
      ctx.fillStyle='#ffd23f';
      ctx.beginPath();ctx.ellipse(x,it.y,9*sq+1.2,9,0,0,TAU);ctx.fill();
      ctx.fillStyle='#c98f16';ctx.fillRect(x-1.6*sq-0.5,it.y-5.5,3.2*sq+1,11);
      ctx.fillStyle='rgba(255,255,255,.85)';
      ctx.beginPath();ctx.ellipse(x-3*sq,it.y-4,2.4*sq+0.5,4,0,0,TAU);ctx.fill();
    }else{
      const b=Math.sin(now/300+it.ph)*2;
      ctx.save();ctx.translate(x,it.y+b);ctx.rotate(Math.sin(now/500+it.ph)*0.06);
      const hue=(now/8+it.ph*40)%360;
      ctx.shadowColor='hsl('+hue+',90%,60%)';ctx.shadowBlur=14;
      const g=ctx.createLinearGradient(-18,-18,18,18);
      g.addColorStop(0,'#c98a4f');g.addColorStop(1,'#6e4320');
      ctx.fillStyle=g;GFX.rr(ctx,-18,-18,36,36,7);ctx.fill();
      ctx.shadowBlur=0;
      ctx.strokeStyle='#4e3218';ctx.lineWidth=3;ctx.stroke();
      ctx.strokeStyle='hsla('+hue+',90%,70%,.75)';ctx.lineWidth=1.6;GFX.rr(ctx,-15,-15,30,30,5);ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.18)';GFX.rr(ctx,-14,-14,28,7,3);ctx.fill();
      [[-11,-11],[11,-11],[-11,11],[11,11]].forEach(p=>{
        ctx.fillStyle='#f2d9a0';ctx.beginPath();ctx.arc(p[0],p[1],2.2,0,TAU);ctx.fill();
      });
      ctx.font='bold 22px Segoe UI';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillStyle='#4e3218';ctx.fillText('?',1,2);
      ctx.fillStyle='#ffd23f';ctx.fillText('?',0,1);
      ctx.textBaseline='alphabetic';
      ctx.restore();
    }
  });

  // kart
  ctx.save();ctx.translate(px,H-104);ctx.rotate(tilt*0.22);
  if(frenzy>0){
    GFX.glow(ctx,0,0,56,'#ff7ad0',0.6);
    ctx.save();ctx.rotate(now/300);
    for(let k=0;k<6;k++){ctx.rotate(TAU/6);ctx.fillStyle=['#ffd23f','#ff7ad0','#4fd0e0'][k%3];GFX.star(ctx,38,0,5,2.2,5,now/200);ctx.fill()}
    ctx.restore();
    ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(0,0,34+Math.sin(now/60)*3,0,TAU);ctx.stroke();
  }
  GFX.kartTop(ctx,{x:0,y:0,a:-Math.PI/2,s:0.92,col:'#e0392b',acc:'#ffd23f',id:'me',v:spd,steer:tilt*1.2,
    boost:frenzy>0?0.8:0.2});
  ctx.restore();
  // exhaust puffs from the static kart
  if(Math.random()<0.4)fx.emit({x:px+(Math.random()<.5?-3:3),y:H-84,vx:(Math.random()-.5)*20,vy:60,life:.5,r:2,r2:7,col:'rgba(160,160,190,.25)',shape:'smoke',drag:1.5});
  ctx.restore();

  GFX.weather(ctx,W,H,t,'rain',50,{wind:-0.4});
  GFX.flash(ctx,W,H,'#ff3c3c',hitFlash);
  GFX.bloom(ctx,c,0.40);
  GFX.grain(ctx,W,H,0.04);
  GFX.vignette(ctx,W,H,0.5);
  drawHUD(now);
}
function drawHUD(now){
  GFX.panel(ctx,10,10,W-20,54,{r:16});
  ctx.textAlign='left';
  for(let i=0;i<3;i++)GFX.icon(ctx,'heart',28+i*22,37,1.25,i<hp?'#ff5a7a':'rgba(255,255,255,.14)');
  GFX.hudText(ctx,'SCORE',100,28,'9px Segoe UI','#8d93a4');
  GFX.hudText(ctx,String(score|0),100,50,'bold 20px Segoe UI','#fff');
  GFX.icon(ctx,'coin',190,37,1);
  GFX.hudText(ctx,String(coins),202,43,'bold 16px Segoe UI','#fff');
  if(frenzy>0){
    GFX.glowText(ctx,'★ FRENZY',W-74,43,{font:'italic 900 16px Segoe UI',fill:'#ffd23f',blur:14});
    GFX.statBar(ctx,W-120,50,92,5,frenzy/3.2,'#ff7ad0');
  }else{
    GFX.hudText(ctx,'COMBO',W-86,28,'9px Segoe UI','#8d93a4');
    for(let i=0;i<3;i++){ctx.fillStyle=i<combo%3?'#6dd6a0':'rgba(255,255,255,.15)';GFX.rr(ctx,W-86+i*20,36,16,12,4);ctx.fill()}
  }
}

let last=performance.now();
function loop(now){
  const dt=Math.max(0,Math.min(0.04,(now-last)/1000));last=now;
  update(dt);render(now);
  if(done)GFX.banner(ctx,W,H,'RUN OVER',(score|0)+' pts · '+coins+' coins · press R');
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
