<meta charset="utf-8">
<title>Kart Wii — Trick Attack</title>
<style>
  html,body{margin:0;height:100%;background:#080810;color:#fff;
    font-family:"Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px}
  body{background:radial-gradient(ellipse at 50% 0%,#1a2c48 0%,#080810 65%)}
  canvas{border:3px solid #23232f;border-radius:8px;background:#7fc4f0;max-width:100vw;
    box-shadow:0 18px 60px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.05)}
  #hud{font-size:14px;letter-spacing:2px;color:#8d93a4}
</style>
<script src="kart-gfx.js"></script>
<script src="kart-audio.js"></script>
<canvas id="c" width="740" height="450"></canvas>
<div id="hud">↑/W throttle · ↓/S brake · ←/→ spin in the air · land level · R restart · M mute</div>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');
const W=c.width,H=c.height,G=1500,TAU=Math.PI*2;

function ramp(x){
  const p=((x%900)+900)%900;
  if(p>700&&p<870){const t=(p-700)/170;return -110*t*t}
  return 0;
}
function ground(x){
  return 300+50*Math.sin(x*0.0042)+26*Math.sin(x*0.0113+1.2)+ramp(x);
}
function slopeAt(x){return (ground(x+3)-ground(x-3))/6}

const fx=new GFX.Particles(520);
const keys={};
let k,score,combo,air,airRot,best,msg,msgT,crashT,wheelSpin,boostT,trail;
function reset(){
  k={x:100,y:ground(100),vy:0,sp:300,rot:0};
  score=0;combo=0;air=false;airRot=0;best=0;msg='';msgT=0;crashT=0;wheelSpin=0;boostT=0;trail=[];
  fx.clear();
}
reset();
addEventListener('keydown',e=>{const kk=e.key.toLowerCase();keys[kk]=true;
  if(kk.startsWith('arrow')||kk===' ')e.preventDefault(); if(kk==='r')reset();
  if(kk==='m')SFX.toggle()});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
GFX.trackKeys(keys);

function say(t){msg=t;msgT=1.5}

function update(dt){
  fx.update(dt);
  if(msgT>0)msgT-=dt;
  if(boostT>0)boostT-=dt;
  if(crashT>0){crashT-=dt;k.sp*=1-2*dt}
  const maxSp=crashT>0?150:560;
  if(keys.arrowup||keys.w){if(k.sp<maxSp)k.sp=Math.min(maxSp,k.sp+240*dt)}
  else if(keys.arrowdown||keys.s)k.sp-=420*dt;
  else k.sp-=60*dt;
  if(k.sp<80)k.sp=80;
  if(k.sp>maxSp)k.sp=maxSp+(k.sp-maxSp)*Math.exp(-4*dt);
  wheelSpin+=k.sp*dt*0.06;

  k.x+=k.sp*dt;
  k.vy+=G*dt;
  k.y+=k.vy*dt;

  const gy=ground(k.x);
  if(k.y>=gy){
    if(air){
      const terr=Math.atan(slopeAt(k.x));
      let diff=k.rot-terr;
      while(diff>Math.PI)diff-=TAU;
      while(diff<-Math.PI)diff+=TAU;
      const spins=Math.abs(airRot)/TAU;
      if(Math.abs(diff)<0.8){
        const pts=Math.round(60+spins*400);
        score+=pts;combo++;
        if(spins>0.9){say('FLIP x'+spins.toFixed(1)+'!  +'+pts);SFX.trick()}
        else if(spins>0.25){say('TRICK!  +'+pts);SFX.trick()}
        else {say('CLEAN LANDING  +'+pts);SFX.land()}
        k.sp+=90;SFX.boost();boostT=0.8;
        fx.burst(k.x,k.y,20,{spd:180,life:.6,r:6,col:'rgba(255,225,150,.9)',shape:'spark',drag:2.2,add:true});
        fx.burst(k.x,k.y,12,{spd:90,life:.7,r:4,r2:12,col:'rgba(190,170,130,.6)',drag:1.4,shape:'smoke'});
        fx.emit({x:k.x,y:k.y,life:.4,r:6,r2:60,col:'#ffe38a',shape:'ring',lw:4,drag:0});
        if(spins>0.25)fx.burst(k.x,k.y-20,10,{spd:160,life:.8,r:4,col:['#ffd23f','#ffffff','#9fe8ff'],pick:true,shape:'star',drag:2,grav:200});
      }else{
        combo=0;crashT=1.0;say('WIPEOUT');SFX.crash();
        fx.burst(k.x,k.y,26,{spd:200,life:.8,r:6,r2:14,col:'rgba(170,150,110,.7)',drag:1.6,shape:'smoke'});
        fx.burst(k.x,k.y,14,{spd:220,life:.7,r:2.6,col:'#6b5334',shape:'square',grav:900,drag:0.6});
      }
      k.rot=terr;airRot=0;air=false;
    }
    k.y=gy;
    k.vy=Math.max(-780,k.sp*slopeAt(k.x));
    k.rot=Math.atan(slopeAt(k.x));
    if(k.sp>200&&Math.random()<0.55){
      fx.emit({x:k.x-18,y:k.y+4,vx:-k.sp*0.25-Math.random()*40,vy:-Math.random()*40,
        life:.45,r:3,r2:8,col:'rgba(190,170,130,.45)',drag:1.4,shape:'smoke'});
    }
    if(k.sp>300&&Math.random()<0.3)fx.emit({x:k.x-14,y:k.y,vx:-k.sp*0.4,vy:-80-Math.random()*80,life:.5,r:1.6,col:'#4ea053',shape:'square',grav:900,drag:0.4});
  }else{
    if(!air)SFX.jump();
    air=true;
    const s=(keys.arrowleft||keys.a?-1:0)+(keys.arrowright||keys.d?1:0);
    if(s){
      const d=s*5.2*dt;
      k.rot+=d;airRot+=d;
      fx.emit({x:k.x,y:k.y-10,vx:(Math.random()-.5)*70,vy:(Math.random()-.5)*70,
        life:.4,r:2.6,col:['#9fe8ff','#ffffff','#ffe38a'][(Math.random()*3)|0],drag:2,shape:'star',add:true});
    }else{
      let d=-k.rot;
      while(d>Math.PI)d-=TAU;
      while(d<-Math.PI)d+=TAU;
      k.rot+=d*Math.min(1,4.5*dt);
    }
  }
  trail.push({x:k.x,y:k.y-12,a:air});if(trail.length>14)trail.shift();
  if(k.x>best)best=k.x;
  SFX.engine(k.sp/560,air?1.35:1);
  SFX.skid(!air&&crashT>0,0.7);
}

function render(now){
  const t=now/1000;
  const camX=k.x-210, camY=k.y-H*0.60;
  GFX.skyGrad(ctx,W,H,[[0,'#1d55b0'],[0.42,'#57a0dd'],[0.74,'#a8d6ef'],[1,'#dcefdc']]);
  GFX.sun(ctx,W*0.78,H*0.16,18,'#fff0b8');
  GFX.cloudBand(ctx,W,H*0.13,-camX*0.06+now*0.006,1.1,'rgba(255,255,255,.42)');
  GFX.mountains(ctx,W,H*0.56,camX*0.1,90,'#7690c0',{freq:0.004});
  GFX.cloudBand(ctx,W,H*0.27,-camX*0.11+now*0.01,0.75,'rgba(255,255,255,.66)');
  GFX.hills(ctx,W,H*0.60,-camX*0.18,52,0.0024,'#4a6f9c');
  GFX.hills(ctx,W,H*0.68,-camX*0.30,38,0.0045,'#3d6a70');
  GFX.treeline(ctx,W,H*0.70,camX*0.38,'#30603e',1.2);
  GFX.hills(ctx,W,H*0.74,-camX*0.46,26,0.0075,'#356b47');
  // a row of mid-distance trees on the near hill
  for(let i=-1;i<8;i++){
    const wx=Math.floor(camX*0.55/140+i)*140,sx=wx-camX*0.55;
    GFX.tree(ctx,sx,H*0.79+Math.sin(wx)*8,1.5,['#57ad57','#4a9a4e','#67b96a'][(((wx/140)|0)%3+3)%3],'#2c6b32',((wx/140)|0)&1);
  }
  GFX.birds(ctx,W,H*0.6,t,5,'rgba(25,40,70,.5)');
  GFX.lightShafts(ctx,W,H,W*0.78,H*0.16,0.45,'#fff0b8');

  // terrain body
  ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=3)ctx.lineTo(x,ground(camX+x)-camY);
  ctx.lineTo(W,H);ctx.closePath();
  const dirt=ctx.createLinearGradient(0,H*0.45,0,H);
  dirt.addColorStop(0,'#6b5334');dirt.addColorStop(1,'#3d2f1e');
  ctx.fillStyle=dirt;ctx.fill();
  ctx.save();ctx.clip();
  // rock strata following the surface
  for(let band=0;band<4;band++){
    ctx.strokeStyle=['rgba(0,0,0,.12)','rgba(255,220,170,.06)','rgba(0,0,0,.16)','rgba(120,80,40,.18)'][band];
    ctx.lineWidth=6+band*3;
    ctx.beginPath();
    for(let x=0;x<=W;x+=8){const sy=ground(camX+x)-camY+26+band*30+Math.sin((camX+x)*0.02+band)*4;x?ctx.lineTo(x,sy):ctx.moveTo(x,sy)}
    ctx.stroke();
  }
  // embedded stones scrolling with the ground
  for(let i=0;i<40;i++){
    const wx=Math.floor(camX/60)*60+i*60-120+((i*37)%50),sx=wx-camX;
    const sy=ground(wx)-camY+30+GFX.hash(Math.floor(wx/60))*110;
    ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(sx+1,sy+2,6,3.5,0,0,TAU);ctx.fill();
    ctx.fillStyle=i%3?'#8a7356':'#7a6a5a';ctx.beginPath();ctx.ellipse(sx,sy,6,3.5,0,0,TAU);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.ellipse(sx-1.5,sy-1,2.5,1.2,0,0,TAU);ctx.fill();
  }
  ctx.restore();
  // grass cap with tufts and flowers
  ctx.strokeStyle='#3f8a45';ctx.lineWidth=15;ctx.lineJoin='round';
  ctx.beginPath();
  for(let x=0;x<=W;x+=3){const sy=ground(camX+x)-camY;x?ctx.lineTo(x,sy):ctx.moveTo(x,sy)}
  ctx.stroke();
  ctx.strokeStyle='#4ea053';ctx.lineWidth=10;ctx.stroke();
  ctx.strokeStyle='#67bd68';ctx.lineWidth=4;
  ctx.beginPath();
  for(let x=0;x<=W;x+=3){const sy=ground(camX+x)-camY-4;x?ctx.lineTo(x,sy):ctx.moveTo(x,sy)}
  ctx.stroke();
  ctx.fillStyle='#5aaf5c';
  ctx.beginPath();
  for(let x=-(camX%7);x<=W;x+=7){
    const wx=camX+x,sy=ground(wx)-camY-5,h=3+GFX.hash(Math.floor(wx/7))*5;
    ctx.moveTo(x-2,sy);ctx.lineTo(x,sy-h);ctx.lineTo(x+2,sy);
  }
  ctx.fill();
  for(let x=-(camX%23);x<=W;x+=23){
    const wx=camX+x,hh=GFX.hash(Math.floor(wx/23));if(hh<0.6)continue;
    ctx.fillStyle=['#ffffff','#ffe066','#ff8ab0'][(hh*30|0)%3];ctx.beginPath();ctx.arc(x,ground(wx)-camY-7,2,0,TAU);ctx.fill();
  }

  // ramps: plank deck, timber supports, chevrons and a pennant on the lip
  for(let n=-1;n<4;n++){
    const base=Math.floor(camX/900+n)*900+700;
    if(base+170-camX<-40||base-camX>W+40)continue;
    // supports
    for(let i=40;i<=170;i+=32){
      const wx=base+i,sx=wx-camX,top=ground(wx)-camY,bot=300+50*Math.sin(wx*0.0042)+26*Math.sin(wx*0.0113+1.2)-camY;
      ctx.fillStyle='#5a3d22';ctx.fillRect(sx-3,top,6,bot-top+4);
      ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillRect(sx+1,top,2,bot-top+4);
    }
    ctx.strokeStyle='#7a5532';ctx.lineWidth=3;
    ctx.beginPath();
    for(let i=40;i<170;i+=32){const a=base+i,b=base+i+32;
      ctx.moveTo(a-camX,ground(a)-camY+6);ctx.lineTo(b-camX,300+50*Math.sin(b*0.0042)+26*Math.sin(b*0.0113+1.2)-camY)}
    ctx.stroke();
    // deck
    ctx.strokeStyle='#a87a48';ctx.lineWidth=8;ctx.beginPath();
    for(let i=0;i<=170;i+=5){const wx=base+i;i?ctx.lineTo(wx-camX,ground(wx)-camY+1):ctx.moveTo(wx-camX,ground(wx)-camY+1)}
    ctx.stroke();
    for(let i=0;i<170;i+=24){
      const wx=base+i,sx=wx-camX;
      if(sx<-30||sx>W+30)continue;
      const sy=ground(wx)-camY;
      const sl=Math.atan(slopeAt(wx));
      ctx.save();ctx.translate(sx,sy-7);ctx.rotate(sl);
      ctx.fillStyle='#ffc93c';ctx.fillRect(-7,-4,14,7);
      ctx.fillStyle='#20202a';ctx.fillRect(-7,-4,7,7);
      ctx.restore();
    }
    const lip=base+168;GFX.flag(ctx,lip-camX+6,ground(lip)-camY+2,1.2,'#e0392b',t);
  }

  // speed ribbon from the exhaust
  if(trail.length>2){
    ctx.save();ctx.lineCap='round';
    for(let i=1;i<trail.length;i++){
      const a=trail[i-1],b=trail[i],f=i/trail.length;
      ctx.strokeStyle=b.a?'rgba(159,232,255,'+(f*0.5)+')':'rgba(255,255,255,'+(f*0.18)+')';
      ctx.lineWidth=f*7;
      ctx.beginPath();ctx.moveTo(a.x-camX-12,a.y-camY);ctx.lineTo(b.x-camX-12,b.y-camY);ctx.stroke();
    }
    ctx.restore();
  }
  ctx.save();ctx.translate(-camX,-camY);fx.draw(ctx);ctx.restore();
  if(air){
    // ground shadow under the airborne kart
    const gy=ground(k.x)-camY,hgt=gy-(k.y-camY);
    ctx.fillStyle='rgba(0,0,0,'+Math.max(0.05,0.3-hgt/600)+')';
    ctx.beginPath();ctx.ellipse(k.x-camX,gy,Math.max(8,26-hgt/12),4,0,0,TAU);ctx.fill();
  }
  GFX.kartSide(ctx,{x:k.x-camX,y:k.y-camY-11,a:k.rot,s:1.15,id:'me',
    col:crashT>0?'#8d8d99':'#e0392b',acc:'#f4f4f8',spin:wheelSpin,boost:boostT>0?boostT:0});
  if(crashT>0){
    ctx.save();ctx.translate(k.x-camX,k.y-camY-48);
    for(let i=0;i<3;i++){const a=t*7+i*TAU/3;GFX.icon(ctx,'star',Math.cos(a)*16,Math.sin(a)*5,0.7,'#ffe38a')}
    ctx.restore();
  }

  if(air){
    const spins=Math.abs(airRot)/TAU;
    GFX.glowText(ctx,'SPIN '+spins.toFixed(2),k.x-camX,k.y-camY-62,
      {font:'bold 14px Segoe UI',fill:spins>0.9?'#ffd23f':'#eaf4ff',blur:12,stroke:'rgba(0,0,0,.5)',strokeW:3});
  }
  GFX.weather(ctx,W,H,t,'leaves',12,{speed:k.sp/560});
  GFX.speedLines(ctx,W,H,GFX.clamp((k.sp-330)/230,0,1)*0.55);
  GFX.bloom(ctx,c,0.24);
  GFX.grain(ctx,W,H,0.045);
  GFX.vignette(ctx,W,H,0.42);

  if(msgT>0){
    const pop=1+Math.max(0,msgT-1.3)*2.5;
    ctx.save();ctx.globalAlpha=Math.min(1,msgT*1.6);ctx.translate(W/2,92);ctx.scale(pop,pop);
    GFX.glowText(ctx,msg,0,0,{font:'italic 900 32px Segoe UI',
      fill:msg==='WIPEOUT'?'#ff6a5a':'#ffd23f',stroke:'rgba(0,0,0,.6)',strokeW:6,blur:22});
    ctx.restore();ctx.globalAlpha=1;
  }
  drawHUD();
}
function drawHUD(){
  GFX.panel(ctx,12,12,220,66,{r:12,accent:'#ffd23f'});
  ctx.textAlign='left';
  GFX.hudText(ctx,'SCORE',26,30,'10px Segoe UI','#8d93a4');
  GFX.hudText(ctx,String(score),26,60,'bold 27px Segoe UI','#fff');
  GFX.hudText(ctx,'COMBO',132,30,'10px Segoe UI','#8d93a4');
  GFX.hudText(ctx,'x'+combo,132,58,'italic 900 24px Segoe UI',combo?'#6dd6a0':'#5a6172');
  if(combo>0)GFX.icon(ctx,'star',200,48,1,combo>=3?'#ffd23f':'#9fe8ff');
  GFX.panel(ctx,W-172,12,160,66,{r:12});
  GFX.hudText(ctx,'SPEED',W-156,30,'10px Segoe UI','#8d93a4');
  GFX.statBar(ctx,W-156,36,128,10,k.sp/560,'#ff7a4a');
  GFX.hudText(ctx,((k.sp/6)|0)+' km/h   ·   '+((best/50)|0)+' m',W-156,64,'10px Segoe UI','#cfd4e2');
}

let last=performance.now();
function loop(now){
  const dt=Math.max(0,Math.min(0.04,(now-last)/1000));last=now;
  update(dt);render(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
