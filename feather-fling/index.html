<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Feather Fling</title>
  <meta name="description" content="Pull back the slingshot and topple the raccoon bandits' towers. Physics puzzles across 36 levels in seven worlds." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #6ec6f5; }
    body {
      font-family: 'Lilita One', 'Arial Rounded MT Bold', 'Segoe UI Black', system-ui, sans-serif;
      color: #fff; user-select: none; -webkit-user-select: none; touch-action: none;
    }
    canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    .hidden { display: none !important; }

    /* Chunky outlined cartoon text */
    .toon {
      color: #fff; letter-spacing: 0.5px;
      text-shadow: 0 3px 0 #1f3a66, 2px 0 0 #1f3a66, -2px 0 0 #1f3a66, 0 -2px 0 #1f3a66,
                   2px 3px 0 #1f3a66, -2px 3px 0 #1f3a66;
    }

    /* Rounded glossy buttons */
    .btn {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      min-width: 64px; height: 64px; padding: 0 22px; border-radius: 20px;
      background: linear-gradient(#ffd54a, #ff9d1e); color: #fff; font-size: 26px;
      box-shadow: 0 6px 0 #b35a00, 0 10px 18px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.55);
      text-shadow: 0 2px 0 rgba(120,50,0,.6);
      transition: transform .08s ease, box-shadow .08s ease;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #b35a00, 0 4px 10px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.55); }
    .btn.green { background: linear-gradient(#8fe34a, #3fae2a); box-shadow: 0 6px 0 #2a6e17, 0 10px 18px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.5); text-shadow: 0 2px 0 rgba(20,70,10,.6); }
    .btn.blue  { background: linear-gradient(#6fd0ff, #2a8fe0); box-shadow: 0 6px 0 #1a5a9a, 0 10px 18px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.5); text-shadow: 0 2px 0 rgba(10,40,90,.6); }
    .btn.round { width: 64px; padding: 0; border-radius: 50%; }
    .btn.small { min-width: 52px; height: 52px; font-size: 22px; border-radius: 16px; }
    .btn.small.round { width: 52px; }
    .btn svg { width: 28px; height: 28px; fill: #fff; filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
    .btn.small svg { width: 24px; height: 24px; }

    /* ------------------------------------------------------------ screens */
    .screen {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px; padding: 24px; z-index: 20;
    }
    .dim { background: radial-gradient(ellipse at center, rgba(10,30,60,.35), rgba(10,20,45,.72)); }

    #title .logo { font-size: clamp(56px, 11vw, 124px); line-height: .9; text-align: center; transform: rotate(-3deg); }
    #title .logo span { display: block; }
    #title .logo .l1 { color: #ffd23f; }
    #title .logo .l2 { color: #ff5a3c; }
    #title .tag { font-size: clamp(18px, 2.6vw, 26px); opacity: .95; }
    #title #playBtn { height: 84px; min-width: 220px; font-size: 38px; border-radius: 26px; }
    .back-home { position: fixed; top: 16px; left: 16px; z-index: 30; }

    /* level select */
    #levels .panel-title { font-size: clamp(38px, 6vw, 60px); }
    .level-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    /* world map */
    .level-grid.map { position: relative; display: block; width: min(980px, 94vw); height: min(420px, 54vh); }
    .map .trail { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .map .trail-shadow { fill: none; stroke: rgba(20,30,60,.35); stroke-width: 3.2; vector-effect: non-scaling-stroke; stroke-width: 22px; stroke-linecap: round; }
    .map .trail-line { fill: none; stroke: #fff6d8; vector-effect: non-scaling-stroke; stroke-width: 9px; stroke-dasharray: 2 18; stroke-linecap: round; }
    .map .lvl { position: absolute; transform: translate(-50%, -50%); width: clamp(64px, 8.4vw, 94px); border-radius: 50%; font-size: clamp(26px, 3.6vw, 38px); }
    .map .lvl:active { transform: translate(-50%, -46%); }
    .map .lvl.boss { width: clamp(80px, 10.5vw, 118px); background: linear-gradient(#ffb0a0, #ff5a3c); box-shadow: 0 7px 0 #a8321a, 0 12px 20px rgba(0,0,0,.3), inset 0 3px 0 rgba(255,255,255,.6); }
    .map .lvl.locked.boss { background: linear-gradient(#b9c3d1, #8793a6); box-shadow: 0 7px 0 #5a6577, 0 12px 20px rgba(0,0,0,.2); }
    .map .lvl .crown { position: absolute; top: -34%; font-size: 70%; filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
    .map .lvl .lvl-name { position: absolute; top: 108%; white-space: nowrap; font-size: clamp(11px, 1.3vw, 15px); color: #fff;
      text-shadow: 0 2px 0 #1f3a66, 1px 0 0 #1f3a66, -1px 0 0 #1f3a66; }
    .map .lvl.next { animation: nodePulse 1.1s ease-in-out infinite; }
    @keyframes nodePulse { 0%, 100% { box-shadow: 0 7px 0 #b76a00, 0 0 0 0 rgba(255,230,120,.8), inset 0 3px 0 rgba(255,255,255,.6); }
      50% { box-shadow: 0 7px 0 #b76a00, 0 0 0 16px rgba(255,230,120,0), inset 0 3px 0 rgba(255,255,255,.6); } }
    .lvl {
      width: clamp(78px, 13vw, 112px); aspect-ratio: 1; border-radius: 22px; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px; font-size: clamp(30px, 5vw, 44px);
      background: linear-gradient(#ffe27a, #ffb52e);
      box-shadow: 0 7px 0 #b76a00, 0 12px 20px rgba(0,0,0,.25), inset 0 3px 0 rgba(255,255,255,.6);
      text-shadow: 0 3px 0 rgba(130,60,0,.55);
    }
    .lvl:active { transform: translateY(4px); }
    .lvl .stars { font-size: clamp(13px, 2vw, 18px); letter-spacing: 1px; color: #fff3b0; text-shadow: 0 2px 0 rgba(130,60,0,.6); }
    .lvl .stars .off { color: rgba(120,60,0,.35); text-shadow: none; }
    .lvl.locked { background: linear-gradient(#b9c3d1, #8793a6); box-shadow: 0 7px 0 #5a6577, 0 12px 20px rgba(0,0,0,.2); color: #eef2f7; cursor: default; }
    .lvl.locked svg { width: 34%; fill: #eef2f7; }
    .levels-foot { display: flex; gap: 16px; }
    .world-nav { display: flex; align-items: center; gap: 22px; }
    .world-head { text-align: center; min-width: min(420px, 60vw); }
    .world-sub { font-size: clamp(16px, 2.2vw, 22px); opacity: .9; margin-top: 2px; }
    .world-nav .btn:disabled { opacity: .35; cursor: default; }
    .world-dots { display: flex; gap: 10px; }
    .world-dots i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.4); box-shadow: 0 2px 0 rgba(0,0,0,.2); }
    .world-dots i.on { background: #ffd23f; }
    .world-dots i.locked { background: rgba(20,30,60,.45); }

    /* result card */
    .card {
      position: relative; width: min(440px, 92vw); padding: 34px 28px 30px; border-radius: 34px; text-align: center;
      background: linear-gradient(#fff8e6, #ffe3a8); color: #7a3e00;
      box-shadow: 0 10px 0 #d98a1e, 0 24px 50px rgba(0,0,0,.35), inset 0 4px 0 #fff;
      animation: pop .45s cubic-bezier(.2,1.6,.4,1) both;
    }
    .card h2 { font-size: 44px; margin-top: 8px; }
    .card .score { font-size: 40px; color: #ff8a1e; text-shadow: 0 3px 0 #b35a00; margin: 6px 0 18px; }
    .card .row { display: flex; gap: 14px; justify-content: center; }
    .card .big-stars { display: flex; justify-content: center; gap: 8px; margin-top: -76px; }
    .card .big-stars svg { width: 86px; height: 86px; filter: drop-shadow(0 5px 0 rgba(0,0,0,.18)); }
    .card .big-stars svg:nth-child(2) { width: 106px; height: 106px; margin-top: -18px; }
    .card .big-stars .s-on { animation: starIn .5s cubic-bezier(.2,1.8,.4,1) both; }
    .card.fail { background: linear-gradient(#eef4ff, #c9dafa); color: #1f3a66; box-shadow: 0 10px 0 #7d9ad0, 0 24px 50px rgba(0,0,0,.35), inset 0 4px 0 #fff; }
    .card .sub { font-size: 20px; opacity: .8; margin-bottom: 18px; }
    @keyframes pop { from { transform: scale(.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes starIn { from { transform: scale(0) rotate(-90deg); } to { transform: scale(1) rotate(0); } }

    /* ------------------------------------------------------------ HUD */
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
    #hud .tl { position: absolute; top: 14px; left: 14px; display: flex; gap: 10px; align-items: center; pointer-events: auto; }
    #hud .lvl-name { font-size: 26px; margin-left: 6px; }
    #hud .tr { position: absolute; top: 12px; right: 18px; text-align: right; }
    #hud .score-val { font-size: 42px; line-height: 1; }
    #hud .bar { width: 190px; height: 16px; margin-top: 8px; margin-left: auto; border-radius: 10px; background: rgba(20,40,80,.45); position: relative; box-shadow: inset 0 2px 3px rgba(0,0,0,.35); }
    #hud .bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 10px; background: linear-gradient(#ffe36b, #ffb21e); width: 0; transition: width .3s ease; }
    #hud .bar b { position: absolute; top: -7px; width: 28px; height: 28px; margin-left: -14px; }
    #hud .bar b svg { width: 100%; height: 100%; }
    #hud .cards { position: absolute; left: 16px; bottom: 16px; display: flex; gap: 8px; align-items: flex-end; }
    #hud .bcard { width: 62px; height: 74px; border-radius: 14px; background: linear-gradient(#ffffff, #dfe9f7); box-shadow: 0 4px 0 #8aa0c2, 0 8px 14px rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; }
    #hud .bcard.next { width: 78px; height: 92px; background: linear-gradient(#fff6c8, #ffd66b); box-shadow: 0 5px 0 #c9901b, 0 10px 16px rgba(0,0,0,.25); }
    #hud .bcard canvas { position: static; width: 80%; height: auto; }
    #hud .hint { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); font-size: 22px; opacity: .95; white-space: nowrap; transition: opacity .4s; }
    #hud .popup { position: absolute; left: 50%; top: 28%; transform: translate(-50%, -50%); font-size: clamp(40px, 7vw, 76px); animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
    #hud .praise { color: #ffd23f; font-size: clamp(46px, 8vw, 92px); letter-spacing: 2px; animation: praise 1.5s cubic-bezier(.2,1.6,.4,1) both; }
    @keyframes praise { 0% { transform: translate(-50%,-50%) scale(.3) rotate(-12deg); opacity: 0; } 18% { transform: translate(-50%,-50%) scale(1.1) rotate(-4deg); opacity: 1; }
      30% { transform: translate(-50%,-50%) scale(1) rotate(-4deg); } 80% { opacity: 1; } 100% { transform: translate(-50%,-80%) scale(1) rotate(-4deg); opacity: 0; } }

    /* level title banner */
    .banner { position: fixed; left: 50%; top: 22%; z-index: 15; pointer-events: none; text-align: center; opacity: 0;
      transform: translate(-50%, -50%); padding: 16px 56px 20px; }
    .banner::before { content: ''; position: absolute; inset: 0; z-index: -1; border-radius: 22px;
      background: linear-gradient(90deg, rgba(20,40,80,0), rgba(20,40,80,.72) 18%, rgba(20,40,80,.72) 82%, rgba(20,40,80,0)); }
    .banner .b-world { font-size: clamp(14px, 1.8vw, 20px); color: #bfe3ff; letter-spacing: 3px; text-transform: uppercase; }
    .banner .b-name { font-size: clamp(40px, 6.4vw, 78px); line-height: 1; margin: 4px 0; color: #fff; }
    .banner .b-num { font-size: clamp(16px, 2vw, 24px); color: #ffd23f; }
    .banner.show { animation: banner 2.4s ease both; }
    @keyframes banner { 0% { opacity: 0; transform: translate(-50%,-50%) scaleX(.6); } 14% { opacity: 1; transform: translate(-50%,-50%) scaleX(1); }
      78% { opacity: 1; transform: translate(-50%,-50%); } 100% { opacity: 0; transform: translate(-50%,-70%); } }

    @media (max-width: 640px) {
      .level-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
      #hud .bar { width: 130px; }
      #hud .score-val { font-size: 32px; }
      #hud .lvl-name { display: none; }
      #hud .hint { font-size: 17px; }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>

  <!-- in-game HUD -->
  <div id="hud" class="hidden">
    <div class="tl">
      <button class="btn small round blue" id="pauseBtn" aria-label="Pause">
        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
      </button>
      <button class="btn small round" id="restartBtn" aria-label="Restart level">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      </button>
      <div class="lvl-name toon" id="lvlName">Level 1</div>
    </div>
    <div class="tr">
      <div class="score-val toon" id="scoreVal">0</div>
      <div class="bar" id="scoreBar"><i id="scoreFill"></i></div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="hint toon" id="hint">Drag the bird back and let go</div>
  </div>

  <div class="banner toon" id="banner"><div class="b-world" id="bannerWorld"></div><div class="b-name" id="bannerName"></div><div class="b-num" id="bannerNum"></div></div>

  <!-- title -->
  <div class="screen" id="title">
    <a class="btn small round blue back-home" href="/" aria-label="Back to the arcade">
      <svg viewBox="0 0 24 24"><path d="M15.5 4.5 8 12l7.5 7.5 1.9-1.9L11.8 12l5.6-5.6z"/></svg>
    </a>
    <div class="logo toon"><span class="l1">Feather</span><span class="l2">Fling</span></div>
    <div class="tag toon">Topple the raccoon bandits' towers</div>
    <button class="btn green" id="playBtn">Play</button>
  </div>

  <!-- level select -->
  <div class="screen dim hidden" id="levels">
    <div class="world-nav">
      <button class="btn small round blue" id="worldPrev" aria-label="Previous world"><svg viewBox="0 0 24 24"><path d="M15.5 4.5 8 12l7.5 7.5 1.9-1.9L11.8 12l5.6-5.6z"/></svg></button>
      <div class="world-head">
        <div class="panel-title toon" id="worldName">Meadow</div>
        <div class="world-sub toon" id="worldSub">Levels 1-4</div>
      </div>
      <button class="btn small round blue" id="worldNext" aria-label="Next world"><svg viewBox="0 0 24 24"><path d="M8.5 4.5 16 12l-7.5 7.5-1.9-1.9L12.2 12 6.6 6.4z"/></svg></button>
    </div>
    <div class="level-grid" id="levelGrid"></div>
    <div class="world-dots" id="worldDots"></div>
    <div class="levels-foot">
      <button class="btn small blue" id="levelsBack">Back</button>
    </div>
  </div>

  <!-- pause -->
  <div class="screen dim hidden" id="pause">
    <div class="card fail">
      <h2>Paused</h2>
      <div class="sub" id="pauseSub">Level 1</div>
      <div class="row">
        <button class="btn blue" id="pauseMenu">Levels</button>
        <button class="btn" id="pauseRestart">Retry</button>
        <button class="btn green" id="pauseResume">Resume</button>
      </div>
    </div>
  </div>

  <!-- win -->
  <div class="screen dim hidden" id="win">
    <div class="card">
      <div class="big-stars" id="winStars"></div>
      <h2>Level Cleared!</h2>
      <div class="score" id="winScore">0</div>
      <div class="row">
        <button class="btn blue round" id="winMenu" aria-label="Levels">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
        </button>
        <button class="btn round" id="winRetry" aria-label="Replay">
          <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        </button>
        <button class="btn green" id="winNext">Next</button>
      </div>
    </div>
  </div>

  <!-- lose -->
  <div class="screen dim hidden" id="lose">
    <div class="card fail">
      <h2>Level Failed</h2>
      <div class="sub">The bandits are still standing!</div>
      <div class="row">
        <button class="btn blue round" id="loseMenu" aria-label="Levels">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
        </button>
        <button class="btn green" id="loseRetry">Try Again</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/planck@1.0.6/dist/planck.min.js"></script>
  <script src="js/art-world.js"></script>
  <script src="js/art-blocks.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/cinema.js"></script>
  <script src="js/art-chars.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
