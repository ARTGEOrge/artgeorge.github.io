<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subway Surfers Remake — 3D</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #fff;
  }
  canvas { display: block; }
  #hud {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    text-align: center; pointer-events: none; user-select: none;
    text-shadow: 2px 2px 0 #000, 0 0 12px rgba(0,0,0,0.8);
  }
  #score { font-size: 38px; font-weight: 900; letter-spacing: 1px; }
  #coins { font-size: 20px; color: #ffd34d; margin-top: 2px; }
  #best  { position: fixed; top: 14px; right: 14px; font-size: 14px; color: #fcd34d; text-shadow: 2px 2px 0 #000; }
  #hint  { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%);
           font-size: 12px; letter-spacing: 1px; color: rgba(255,255,255,0.65);
           text-transform: uppercase; pointer-events: none; user-select: none; }
  #gameover {
    position: fixed; inset: 0;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.7); text-align: center;
  }
  #gameover.show { display: flex; }
  #gameover h1 {
    font-family: Impact, "Arial Black", sans-serif;
    font-size: 96px; color: #ff5050; margin: 0;
    -webkit-text-stroke: 4px #000;
    text-shadow: 0 0 30px rgba(255,80,80,0.6);
  }
  #gameover p { font-family: monospace; font-size: 26px; margin: 6px 0; }
  #gameover .best { color: #fcd34d; }
  #gameover .hint { font-size: 16px; opacity: 0.75; margin-top: 24px; }
  #loadhint { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
              font-size: 18px; color: #aaa; }
  #flash {
    position: fixed; inset: 0;
    background: rgba(255, 0, 0, 0);
    pointer-events: none;
    transition: background 0.18s ease-out;
    box-shadow: inset 0 0 120px rgba(255,0,0,0);
  }
  #danger {
    position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
    font-family: Impact, "Arial Black", sans-serif;
    font-size: 36px; color: #ff3030; letter-spacing: 4px;
    text-shadow: 2px 2px 0 #000, 0 0 16px rgba(255,40,40,0.9);
    opacity: 0; pointer-events: none; user-select: none;
    transition: opacity 0.15s;
  }
  #danger.on { opacity: 1; animation: pulse 0.5s infinite alternate; }
  @keyframes pulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.08); } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="loadhint">Loading 3D engine…</div>
<div id="hud" style="display:none">
  <div id="score">0</div>
  <div id="coins">🪙 <span id="coinCount">0</span></div>
</div>
<div id="best" style="display:none">Best: <span id="bestScore">0</span></div>
<div id="hint" style="display:none">← → / A D : hold to steer &nbsp;·&nbsp; ↑ / W / SPACE : jump &nbsp;·&nbsp; ↓ / S : slide</div>
<div id="danger">⚠  COP CLOSING IN!  ⚠</div>
<div id="flash"></div>
<div id="gameover">
  <h1>CRASHED!</h1>
  <p>Score: <span id="finalScore">0</span></p>
  <p>Coins: <span id="finalCoins">0</span></p>
  <p class="best">Best: <span id="finalBest">0</span></p>
  <p class="hint">Press SPACE / ENTER (or tap) to restart</p>
</div>

<script>
/* SSDetail — visual detail layer for Subway Surfers Remake (shared by index.html and code-org.html).
 * Called once per frame, just before rendering: SSDetail.frame(renderer, scene, camera, dt, THREE).
 * It never touches gameplay state. It finds new objects in the scene (trains, buildings, stations,
 * coins, track) and dresses them: procedural textures, extra merged geometry (bogies, roof units,
 * graffiti, fire escapes, awnings, tie plates), and it merges each static group's meshes by material
 * so the extra detail costs fewer draw calls than the original. ?detail=low skips the extra geometry. */
(function () {
  'use strict';
  var T = null, ready = false, time = 0;
  var LOW = /[?&]detail=low\b/.test(location.search);
  var TEX = {}, MAT = {}, GEO = {};
  var ties = [], coinsSeen = [], fx = [], tracked = [];
  var player = null, playerPrevY = 0, playerPrevVy = 0, pom = null, pomBaseY = 0, backpack = null, backpackBaseY = 0;
  var sky = null, dust = null, pool = [];
  function updatePool() {
    var cand = [];
    for (var i = 0; i < tracked.length; i++) {
      var tr = tracked[i], g = tr.g;
      if (!tr.lights || !tr.lights.length || !g.parent) continue;
      for (var k = 0; k < tr.lights.length; k++) {
        var l = tr.lights[k], wz = g.position.z + l.z;
        if (wz > -75 && wz < 14) cand.push({ l: l, x: g.position.x + l.x, y: g.position.y + l.y, z: wz, score: Math.abs(wz + 8) / (l.i + 0.1) });
      }
    }
    cand.sort(function (a, b) { return a.score - b.score; });
    for (var j = 0; j < pool.length; j++) {
      var L = pool[j], c = cand[j];
      if (c) { L.position.set(c.x, c.y, c.z); L.color.setHex(c.l.color); L.intensity = c.l.i; L.distance = c.l.d; }
      else L.intensity = 0;
    }
  }

  function rnd(a, b) { return a + Math.random() * (b - a); }
  function srng(seed) { var s = seed >>> 0; return function () { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  /* ------------------------------------------------------------ textures */
  function canvasTex(w, h, paint, srgb, repeat) {
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    paint(c.getContext('2d'), w, h);
    var t = new T.CanvasTexture(c);
    if (srgb !== false && T.SRGBColorSpace) t.colorSpace = T.SRGBColorSpace;
    if (repeat !== false) { t.wrapS = t.wrapT = T.RepeatWrapping; }
    t.anisotropy = 4;
    return t;
  }
  // draw fn at (x,y) and its wrapped copies so the texture tiles
  function wrap(w, h, x, y, r, fn) {
    for (var dx = -1; dx <= 1; dx++) for (var dy = -1; dy <= 1; dy++) {
      var px = x + dx * w, py = y + dy * h;
      if (px > -r && px < w + r && py > -r && py < h + r) fn(px, py);
    }
  }

  function makeTextures() {
    // track ballast: packed grey-brown stones with highlights and shadows
    TEX.ballast = canvasTex(512, 512, function (c, w, h) {
      var r = srng(11);
      c.fillStyle = '#3a3733'; c.fillRect(0, 0, w, h);
      for (var i = 0; i < 2600; i++) {
        var x = r() * w, y = r() * h, s = 3 + r() * 7, a = r() * 6.28, tone = 70 + r() * 80 | 0;
        var col = 'rgb(' + (tone + 8) + ',' + (tone + 4) + ',' + tone + ')';
        wrap(w, h, x, y, s * 2, function (px, py) {
          c.fillStyle = 'rgba(0,0,0,0.45)';
          c.beginPath(); c.ellipse(px + 1.5, py + 1.8, s, s * 0.72, a, 0, 6.28); c.fill();
          c.fillStyle = col;
          c.beginPath(); c.ellipse(px, py, s, s * 0.72, a, 0, 6.28); c.fill();
          c.fillStyle = 'rgba(255,255,255,0.18)';
          c.beginPath(); c.ellipse(px - s * 0.3, py - s * 0.3, s * 0.45, s * 0.28, a, 0, 6.28); c.fill();
        });
      }
      // rust and oil stains
      for (var k = 0; k < 14; k++) {
        var sx = r() * w, sy = r() * h, sr = 20 + r() * 50;
        wrap(w, h, sx, sy, sr, function (px, py) {
          var g = c.createRadialGradient(px, py, 0, px, py, sr);
          g.addColorStop(0, k % 3 ? 'rgba(20,14,10,0.35)' : 'rgba(120,60,20,0.25)'); g.addColorStop(1, 'rgba(0,0,0,0)');
          c.fillStyle = g; c.fillRect(px - sr, py - sr, sr * 2, sr * 2);
        });
      }
    });
    // timber sleeper: grain, cracks, darker worn ends
    TEX.sleeper = canvasTex(512, 64, function (c, w, h) {
      var r = srng(5);
      c.fillStyle = '#6b4a30'; c.fillRect(0, 0, w, h);
      for (var y = 0; y < h; y += 1.5) {
        c.strokeStyle = r() < 0.5 ? 'rgba(40,22,10,' + (0.1 + r() * 0.3) + ')' : 'rgba(150,110,75,' + (0.08 + r() * 0.2) + ')';
        c.lineWidth = 0.6 + r(); c.beginPath(); c.moveTo(0, y);
        for (var x = 0; x <= w; x += 32) c.lineTo(x, y + Math.sin(x * 0.02 + y) * 1.2);
        c.stroke();
      }
      for (var k = 0; k < 6; k++) {
        c.strokeStyle = 'rgba(20,10,5,0.7)'; c.lineWidth = 1.2;
        var cx = r() * w, cy = 8 + r() * (h - 16);
        c.beginPath(); c.moveTo(cx, cy); c.lineTo(cx + 20 + r() * 40, cy + (r() - 0.5) * 6); c.stroke();
      }
      var g = c.createLinearGradient(0, 0, w, 0);
      g.addColorStop(0, 'rgba(0,0,0,0.35)'); g.addColorStop(0.08, 'rgba(0,0,0,0)'); g.addColorStop(0.92, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.35)');
      c.fillStyle = g; c.fillRect(0, 0, w, h);
    });
    // concrete panels for towers, podiums and curbs (multiplied by each building's colour)
    TEX.concrete = canvasTex(256, 256, function (c, w, h) {
      var r = srng(3);
      c.fillStyle = '#d6d6d6'; c.fillRect(0, 0, w, h);
      for (var i = 0; i < 3000; i++) { var v = 170 + r() * 85 | 0; c.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',0.35)'; c.fillRect(r() * w, r() * h, 2, 2); }
      c.strokeStyle = 'rgba(40,40,40,0.55)'; c.lineWidth = 2;
      for (var p = 0; p <= 4; p++) { c.beginPath(); c.moveTo(0, p * 64); c.lineTo(w, p * 64); c.stroke(); }
      for (var q = 0; q <= 2; q++) { c.beginPath(); c.moveTo(q * 128, 0); c.lineTo(q * 128, h); c.stroke(); }
      for (var s = 0; s < 18; s++) {   // rain streaks
        var sx = r() * w, g = c.createLinearGradient(0, 0, 0, 90);
        g.addColorStop(0, 'rgba(30,30,30,0.25)'); g.addColorStop(1, 'rgba(30,30,30,0)');
        c.fillStyle = g; c.fillRect(sx, (r() * 4 | 0) * 64, 3 + r() * 4, 90);
      }
    });
    // curtain-wall windows: some lit warm, some cool, some dark with blinds
    var winPaint = function (emissive) {
      return function (c, w, h) {
        var r = srng(21);
        c.fillStyle = emissive ? '#000000' : '#1a2230'; c.fillRect(0, 0, w, h);
        var cols = 8, rows = 8, cw = w / cols, rh = h / rows;
        for (var y = 0; y < rows; y++) for (var x = 0; x < cols; x++) {
          var v = r(), px = x * cw + 4, py = y * rh + 5, ww = cw - 8, hh = rh - 10;
          var lit = v < 0.22, cool = v > 0.22 && v < 0.3;
          if (emissive) {
            if (lit || cool) {
              var g = c.createLinearGradient(0, py, 0, py + hh);
              g.addColorStop(0, lit ? '#ffcf8a' : '#9fd0ff'); g.addColorStop(1, lit ? '#a8642a' : '#2f5f9a');
              c.fillStyle = g; c.fillRect(px, py, ww, hh);
              if (r() < 0.5) { c.fillStyle = 'rgba(0,0,0,0.55)'; for (var b = 0; b < hh * 0.5; b += 4) c.fillRect(px, py + b, ww, 2); }
              if (r() < 0.3) { c.fillStyle = 'rgba(0,0,0,0.7)'; c.fillRect(px + ww * 0.55, py + hh * 0.35, ww * 0.2, hh * 0.65); }  // someone at the window
            } else { c.fillStyle = '#0d1424'; c.fillRect(px, py, ww, hh); }
          } else {
            var gg = c.createLinearGradient(px, py, px + ww, py + hh);
            gg.addColorStop(0, '#3a4a66'); gg.addColorStop(0.5, '#121a28'); gg.addColorStop(1, '#26324a');
            c.fillStyle = gg; c.fillRect(px, py, ww, hh);
            c.fillStyle = 'rgba(255,255,255,0.08)'; c.fillRect(px, py, ww, 3);
          }
        }
        if (!emissive) { c.strokeStyle = '#05070b'; c.lineWidth = 6; for (var k = 0; k <= cols; k++) { c.beginPath(); c.moveTo(k * cw, 0); c.lineTo(k * cw, h); c.stroke(); } for (k = 0; k <= rows; k++) { c.beginPath(); c.moveTo(0, k * rh); c.lineTo(w, k * rh); c.stroke(); } }
      };
    };
    TEX.windows = canvasTex(512, 512, winPaint(false));
    TEX.windowsE = canvasTex(512, 512, winPaint(true));
    // train side: panel seams, rivets, grime from the wheels, rain streaks (greyscale, tinted by paint colour)
    TEX.trainBody = canvasTex(1024, 352, function (c, w, h) {
      var r = srng(9);
      c.fillStyle = '#f2f2f2'; c.fillRect(0, 0, w, h);
      c.strokeStyle = 'rgba(0,0,0,0.45)'; c.lineWidth = 3;
      [0.02, 0.27, 0.5, 0.73, 0.98].forEach(function (f) { c.beginPath(); c.moveTo(f * w, 0); c.lineTo(f * w, h); c.stroke(); });
      [0.08, 0.62].forEach(function (f) { c.beginPath(); c.moveTo(0, f * h); c.lineTo(w, f * h); c.stroke(); });
      c.fillStyle = 'rgba(0,0,0,0.35)';
      for (var x = 8; x < w; x += 22) { c.beginPath(); c.arc(x, 0.08 * h + 9, 2.4, 0, 6.28); c.arc(x, 0.62 * h + 9, 2.4, 0, 6.28); c.fill(); }
      c.fillStyle = 'rgba(255,255,255,0.4)';
      for (x = 8; x < w; x += 22) { c.fillRect(x - 1.5, 0.08 * h + 7, 1.5, 1.5); c.fillRect(x - 1.5, 0.62 * h + 7, 1.5, 1.5); }
      var g = c.createLinearGradient(0, h * 0.65, 0, h);
      g.addColorStop(0, 'rgba(40,30,20,0)'); g.addColorStop(1, 'rgba(40,30,20,0.7)');
      c.fillStyle = g; c.fillRect(0, 0, w, h);
      for (var s = 0; s < 60; s++) {
        var sx = r() * w, sl = 20 + r() * 80, sg = c.createLinearGradient(0, 0, 0, sl);
        sg.addColorStop(0, 'rgba(30,25,20,0.3)'); sg.addColorStop(1, 'rgba(30,25,20,0)');
        c.save(); c.translate(sx, r() < 0.5 ? 0.09 * h : 0.63 * h); c.fillStyle = sg; c.fillRect(0, 0, 2 + r() * 3, sl); c.restore();
      }
    });
    // graffiti atlas: 4 x 2 tags with outlines, highlights and drips
    TEX.graffiti = canvasTex(1024, 512, function (c, w, h) {
      var words = ['SURF', 'ZAP!', 'CREW', 'RUN', 'WILD', 'NYC', 'BOOM', 'YO!'];
      var pals = [['#ff3d9a', '#ffe34d'], ['#33e0ff', '#7a3dff'], ['#7dff4a', '#0f8f5a'], ['#ff7a1a', '#ffd23f'], ['#c06bff', '#ff4fd8'], ['#ff4040', '#ffffff'], ['#ffe34d', '#ff3d3d'], ['#4dffd2', '#2a6bff']];
      var r = srng(77);
      for (var i = 0; i < 8; i++) {
        var cx = (i % 4) * 256 + 128, cy = (i / 4 | 0) * 256 + 128, p = pals[i];
        c.save(); c.translate(cx, cy); c.rotate((r() - 0.5) * 0.25);
        // background burst
        c.fillStyle = p[1]; c.globalAlpha = 0.85; c.beginPath();
        for (var k = 0; k < 14; k++) { var a = k / 14 * 6.28, rad = (k % 2 ? 70 : 105) + r() * 12; c.lineTo(Math.cos(a) * rad * 1.15, Math.sin(a) * rad * 0.55); }
        c.closePath(); c.fill(); c.globalAlpha = 1;
        c.font = '900 ' + (words[i].length > 3 ? 74 : 92) + 'px Impact, "Arial Black", sans-serif';
        c.textAlign = 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
        c.lineWidth = 16; c.strokeStyle = '#111'; c.strokeText(words[i], 4, 6);
        c.lineWidth = 9; c.strokeStyle = '#fff'; c.strokeText(words[i], 0, 0);
        var g = c.createLinearGradient(0, -40, 0, 40); g.addColorStop(0, p[0]); g.addColorStop(1, p[1]);
        c.fillStyle = g; c.fillText(words[i], 0, 0);
        c.fillStyle = 'rgba(255,255,255,0.55)'; c.fillRect(-90, -24, 180, 5);
        c.fillStyle = p[0];   // drips
        for (var d = 0; d < 6; d++) { var dx = -90 + r() * 180, dl = 10 + r() * 30; c.fillRect(dx, 26, 4, dl); c.beginPath(); c.arc(dx + 2, 26 + dl, 3.5, 0, 6.28); c.fill(); }
        c.restore();
      }
    });
    // station tiles
    TEX.tiles = canvasTex(256, 256, function (c, w, h) {
      var r = srng(4);
      c.fillStyle = '#9a978c'; c.fillRect(0, 0, w, h);
      for (var y = 0; y < 4; y++) for (var x = 0; x < 4; x++) {
        var v = 225 + r() * 25 | 0; c.fillStyle = 'rgb(' + v + ',' + v + ',' + (v - 8) + ')';
        c.fillRect(x * 64 + 2, y * 64 + 2, 60, 60);
        c.fillStyle = 'rgba(255,255,255,0.35)'; c.fillRect(x * 64 + 4, y * 64 + 4, 56, 4);
      }
    });
    // soft round glow for sparks and coin flashes
    TEX.glow = canvasTex(64, 64, function (c) {
      var g = c.createRadialGradient(32, 32, 0, 32, 32, 32);
      g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.3, 'rgba(255,240,180,0.7)'); g.addColorStop(1, 'rgba(255,200,80,0)');
      c.fillStyle = g; c.fillRect(0, 0, 64, 64);
    }, true, false);
    TEX.ring = canvasTex(128, 128, function (c) {
      c.strokeStyle = 'rgba(255,230,140,1)'; c.lineWidth = 7; c.beginPath(); c.arc(64, 64, 52, 0, 6.28); c.stroke();
      c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = 2; c.beginPath(); c.arc(64, 64, 52, 0, 6.28); c.stroke();
    }, true, false);
  }

  /* -------------------------------------------------------- environment */
  function makeEnvironment(renderer, scene) {
    // a dim night "room" of neon and window light, used for reflections on paint, glass, rails and coins
    try {
      var env = new T.Scene();
      env.background = new T.Color(0x070b18);
      var box = function (col, x, y, z, sx, sy, sz) {
        var m = new T.Mesh(new T.BoxGeometry(sx, sy, sz), new T.MeshBasicMaterial({ color: col }));
        m.position.set(x, y, z); env.add(m);
      };
      box(0x1a2a55, 0, 12, 0, 40, 1, 40);                 // sky
      box(0x6a4a2a, -9, 2, 0, 1, 3, 30); box(0x6a4a2a, 9, 2, 0, 1, 3, 30);   // warm street level
      box(0xff3399, -8, 6, -6, 0.5, 0.6, 12); box(0x33ddff, 8, 7, 4, 0.5, 0.6, 12);
      box(0xffd9a0, -8, 9, 6, 0.5, 2, 4); box(0xa0d4ff, 8, 4, -8, 0.5, 2, 4);
      box(0x101018, 0, -3, 0, 40, 1, 40);
      var pm = new T.PMREMGenerator(renderer);
      scene.environment = pm.fromScene(env, 0.04).texture;
      pm.dispose();
    } catch (e) {}
    // gradient sky dome behind everything, matched to the fog colour at the horizon
    var g = new T.SphereGeometry(185, 32, 16), pos = g.attributes.position, cols = new Float32Array(pos.count * 3);
    var top = new T.Color(0x02040f), mid = new T.Color(0x1a1840), hor = new T.Color(0x3a2350), tmp = new T.Color();
    for (var i = 0; i < pos.count; i++) {
      var y = pos.getY(i) / 185;
      if (y > 0.25) tmp.copy(mid).lerp(top, Math.min(1, (y - 0.25) / 0.6)); else tmp.copy(hor).lerp(mid, Math.max(0, (y + 0.05) / 0.3));
      cols[i * 3] = tmp.r; cols[i * 3 + 1] = tmp.g; cols[i * 3 + 2] = tmp.b;
    }
    g.setAttribute('color', new T.BufferAttribute(cols, 3));
    sky = new T.Mesh(g, new T.MeshBasicMaterial({ vertexColors: true, side: T.BackSide, fog: false, depthWrite: false }));
    sky.renderOrder = -10; sky.frustumCulled = false; sky.userData.__ssd = 1;
    scene.add(sky);
    if (scene.fog) scene.fog.color.set(0x1e1a3a);
  }

  /* ------------------------------------------------------------- merging */
  function paramKey(m) {
    return [m.type, m.roughness, m.metalness, m.emissive ? m.emissive.getHexString() : '', m.emissiveIntensity,
      m.transparent, m.opacity, m.depthWrite, m.side, m.blending, m.fog].join(':');
  }
  // Merge a group's direct static meshes into one mesh per material. Meshes that are animated
  // through their own material (userData.phase) keep that material object; everything else is
  // pooled by material parameters, with the original colour carried as a vertex colour.
  function mergeGroup(group) {
    group.updateMatrixWorld(true);
    var inv = new T.Matrix4().copy(group.matrixWorld).invert(), rel = new T.Matrix4(), nm = new T.Matrix3();
    var buckets = {}, order = [];
    group.children.slice().forEach(function (ch) {
      if (!ch.isMesh || ch.isInstancedMesh || !ch.visible || Array.isArray(ch.material) || !ch.geometry.attributes.position) return;
      var m = ch.material, tag = ch.userData.__tex || '';
      var own = ch.userData.phase !== undefined || m.map || !(m.isMeshStandardMaterial || m.isMeshBasicMaterial);
      var key = own ? 'u:' + m.uuid : paramKey(m) + '|' + tag;
      var b = buckets[key];
      if (!b) { b = buckets[key] = { own: own, mat: m, tag: tag, list: [], verts: 0, idx: 0, cast: false, recv: false }; order.push(key); }
      var g = ch.geometry;
      b.list.push(ch); b.verts += g.attributes.position.count; b.idx += g.index ? g.index.count : g.attributes.position.count;
      b.cast = b.cast || ch.castShadow; b.recv = b.recv || ch.receiveShadow;
    });
    var made = [];
    order.forEach(function (key) {

    g.children.forEach(function (ch) {
      var p = ch.geometry && ch.geometry.parameters;
      if (ch.isMesh && ch.geometry.type === 'SphereGeometry' && near(p.radius, 0.13)) { pom = ch; pomBaseY = ch.position.y; }
      if (ch.isMesh && boxP(ch) && near(p.width, 0.58) && near(p.height, 0.72)) { backpack = ch; backpackBaseY = ch.position.y; }
    });
    // running dust kicked up at the feet
    var n = 40, pos = new Float32Array(n * 3);
    for (var i = 0; i < n; i++) pos[i * 3 + 1] = -50;
    var geo = new T.BufferGeometry(); geo.setAttribute('position', new T.BufferAttribute(pos, 3));
    dust = new T.Points(geo, new T.PointsMaterial({ color: 0xb8aa98, size: 0.35, map: TEX.glow, transparent: true, opacity: 0.45, depthWrite: false }));
    dust.userData = { __ssd: 1, life: new Float32Array(n), vel: new Float32Array(n * 3), next: 0, acc: 0 };
    dust.frustumCulled = false;
    player.parent.add(dust);
  }

  function updatePlayer(dt) {
    if (!player) return;
    var y = player.position.y, vy = (y - playerPrevY) / Math.max(dt, 1e-3), tt = performance.now() * 0.014;
    var grounded = Math.abs(vy) < 0.5;
    // landing squash: the game eases scale.y back to 1 on its own
    if (playerPrevVy < -4 && vy > -0.5) player.scale.y = Math.min(player.scale.y, 0.8);
    var running = grounded && player.scale.y > 0.7 && Math.abs(player.rotation.x) < 0.3;
    // torso twist with the stride, bouncy pom-pom and backpack
    player.rotation.y = running ? Math.sin(tt) * 0.09 : player.rotation.y * 0.85;
    if (pom) pom.position.y = pomBaseY + (running ? Math.abs(Math.sin(tt)) * 0.06 : Math.max(-0.05, Math.min(0.08, -vy * 0.008)));
    if (backpack) backpack.position.y = backpackBaseY + (running ? Math.abs(Math.cos(tt)) * 0.035 : 0);
    // dust puffs from the feet while running
    var u = dust.userData, pa = dust.geometry.attributes.position, n = u.life.length;
    if (running) {
      u.acc += dt * 26;
      while (u.acc > 1) {
        u.acc -= 1; var k = u.next; u.next = (k + 1) % n;
        pa.array[k * 3] = player.position.x + rnd(-0.25, 0.25); pa.array[k * 3 + 1] = y + 0.08; pa.array[k * 3 + 2] = rnd(0, 0.4);
        u.vel[k * 3] = rnd(-0.6, 0.6); u.vel[k * 3 + 1] = rnd(0.4, 1.2); u.vel[k * 3 + 2] = rnd(4, 8); u.life[k] = rnd(0.25, 0.5);
      }
    }
    for (var i = 0; i < n; i++) {
      if (u.life[i] <= 0) continue;
      u.life[i] -= dt;
      if (u.life[i] <= 0) { pa.array[i * 3 + 1] = -50; continue; }
      pa.array[i * 3] += u.vel[i * 3] * dt; pa.array[i * 3 + 1] += u.vel[i * 3 + 1] * dt; pa.array[i * 3 + 2] += u.vel[i * 3 + 2] * dt;
    }
    pa.needsUpdate = true;
    playerPrevVy = vy; playerPrevY = y;
  }

  /* ------------------------------------------------------------ coin fx */
  function coinFlash(scene, pos) {
    var ring = new T.Sprite(new T.SpriteMaterial({ map: TEX.ring, transparent: true, depthWrite: false, blending: T.AdditiveBlending, color: 0xffe08a }));
    ring.position.copy(pos); ring.scale.set(0.4, 0.4, 0.4); ring.userData.__ssd = 1;
    var glow = new T.Sprite(new T.SpriteMaterial({ map: TEX.glow, transparent: true, depthWrite: false, blending: T.AdditiveBlending, color: 0xfff1b0 }));
    glow.position.copy(pos); glow.scale.set(1.2, 1.2, 1.2); glow.userData.__ssd = 1;
    scene.add(ring); scene.add(glow);
    fx.push({ ring: ring, glow: glow, life: 0.35 });
  }
  function updateCoins(scene, dt) {
    MAT.coin.emissiveIntensity = 0.8 + 0.35 * Math.sin(time * 6);
    for (var i = coinsSeen.length - 1; i >= 0; i--) {
      var c = coinsSeen[i];
      if (c.parent) continue;
      coinsSeen.splice(i, 1);
      // removed near the runner = collected (coins that scroll past are removed further back)
      if (player && c.position.z > -1.2 && c.position.z < 1.7 && fx.length < 12) coinFlash(scene, c.position);
    }
    for (var j = fx.length - 1; j >= 0; j--) {
      var f = fx[j], k = 1 - f.life / 0.35;
      f.life -= dt;
      var s = 0.4 + k * 1.6; f.ring.scale.set(s, s, s); f.ring.material.opacity = 1 - k;
      f.glow.material.opacity = (1 - k) * 0.9;
      if (f.life <= 0) { scene.remove(f.ring); scene.remove(f.glow); f.ring.material.dispose(); f.glow.material.dispose(); fx.splice(j, 1); }
    }
  }

  /* ------------------------------------------------------------------ frame */
  window.SSDetail = {
    frame: function (renderer, scene, camera, dt, THREE_) {
      try {
        if (!ready) {
          T = THREE_ || window.THREE;
          if (!T) return;
          ready = true;
          makeTextures(); makeShared(); makeEnvironment(renderer, scene);
          for (var pl = 0; pl < 4; pl++) { var L = new T.PointLight(0xffffff, 0, 10); L.userData.__ssd = 1; scene.add(L); pool.push(L); }
        }
        time += dt || 0;
        scan(scene, renderer);
        for (var i = 0; i < ties.length; i++) { ties[i].dst.instanceMatrix.array.set(ties[i].src.instanceMatrix.array); ties[i].dst.instanceMatrix.needsUpdate = true; }
        for (var j = tracked.length - 1; j >= 0; j--) if (!tracked[j].g.parent) { tracked[j].geos.forEach(function (g) { g.dispose(); }); tracked.splice(j, 1); }
        updatePool();
        updatePlayer(dt || 0);
        updateCoins(scene, dt || 0);
        if (sky) sky.position.set(camera.position.x, 0, camera.position.z);
      } catch (e) {
        if (!this._warned) { this._warned = true; console.warn('SSDetail disabled:', e); }
      }
    }
  };
})();

    const c = BUILDING_COLORS[Math.floor(Math.random() * BUILDING_COLORS.length)];
    const bx = side * (FLOOR_HALFW + depth / 2 + 0.4);
    const facadeX = side * (FLOOR_HALFW + 0.4);             // x of inner (road-facing) face

    // --- Podium / street-level base (slightly wider than tower, classic skyscraper plinth)
    const podiumH = 1.6;
    const podium = new THREE.Mesh(
      new THREE.BoxGeometry(depth + 0.35, podiumH, w + 0.25),
      podiumMat
    );
    podium.position.set(bx, podiumH / 2, z);
    podium.receiveShadow = true;
    g.add(podium);

    // --- Main tower body (above podium)
    const bodyH = h - podiumH;
    const towerMat = new THREE.MeshStandardMaterial({ color: c, roughness: 0.45, metalness: 0.55 });
    const tower = new THREE.Mesh(new THREE.BoxGeometry(depth, bodyH, w), towerMat);
    tower.position.set(bx, podiumH + bodyH / 2, z);
    tower.receiveShadow = true;
    g.add(tower);

    // --- Setback tier on tall buildings (steps back from the road for a real skyline silhouette)
    const tall = h > 11;
    let topY = h;
    let topCenterX = bx;
    let topW = w, topD = depth;
    if (tall) {
      const setbackH = 2 + Math.random() * 3.5;
      const setbackD = depth * (0.60 + Math.random() * 0.15);
      const setbackW = w * (0.74 + Math.random() * 0.12);
      // align outer (away-from-road) face with tower so step is visible from the player
      const setbackX = bx + side * (depth - setbackD) / 2;
      const setback = new THREE.Mesh(
        new THREE.BoxGeometry(setbackD, setbackH, setbackW),
        towerMat
      );
      setback.position.set(setbackX, h + setbackH / 2, z);
      g.add(setback);
      topY = h + setbackH;
      topCenterX = setbackX;
      topW = setbackW; topD = setbackD;
    }

    // --- Glass curtain-wall facade panel on the inner (road-facing) face
    const facade = new THREE.Mesh(
      new THREE.BoxGeometry(0.18, bodyH * 0.96, w * 0.92),
      glassMat
    );
    facade.position.set(facadeX - side * 0.05, podiumH + bodyH / 2, z);
    g.add(facade);

    // --- Vertical mullions: slim metal pillars dividing the curtain wall into panels
    const mullCount = Math.max(2, Math.floor(w / 1.0));
    for (let m = 0; m <= mullCount; m++) {
      const mz = z - w / 2 + (m * w) / mullCount;
      const mull = new THREE.Mesh(
        new THREE.BoxGeometry(0.22, bodyH, 0.14),
        mullionMat
      );
      mull.position.set(facadeX - side * 0.02, podiumH + bodyH / 2, mz);
      g.add(mull);
    }

    // --- Continuous horizontal window strips (sleek light bands, not dotted windows)
    const stripCount = Math.max(2, Math.floor(bodyH / 1.3));
    const stripSpacing = bodyH / (stripCount + 0.5);
    const stripMat = Math.random() < 0.7 ? winStripLitMat : winStripCoolMat;
    for (let s = 0; s < stripCount; s++) {
      if (Math.random() < 0.85) {
        const strip = new THREE.Mesh(
          new THREE.BoxGeometry(0.08, 0.45, w * 0.88),
          stripMat
        );
        strip.position.set(facadeX - side * 0.07, podiumH + 0.7 + s * stripSpacing, z);
        g.add(strip);
      }
    }
    // Setback-tier glass + a couple of strips
    if (tall) {
      const sbInnerX = topCenterX - side * (topD / 2);
      const sbFacade = new THREE.Mesh(
        new THREE.BoxGeometry(0.16, (topY - h) * 0.9, topW * 0.9),
        glassMat
      );
      sbFacade.position.set(sbInnerX - side * 0.04, (h + topY) / 2, z);
      g.add(sbFacade);
      const sbStrips = Math.max(1, Math.floor((topY - h) / 1.2));
      for (let s = 0; s < sbStrips; s++) {
        const strip = new THREE.Mesh(
          new THREE.BoxGeometry(0.07, 0.4, topW * 0.84),
          stripMat
        );
        strip.position.set(sbInnerX - side * 0.06, h + 0.6 + s * 1.2, z);
        g.add(strip);
      }
    }

    // --- Crown / parapet slab on top
    const crownH = 0.35;
    const crown = new THREE.Mesh(
      new THREE.BoxGeometry(topD * 1.04, crownH, topW * 1.04),
      crownMat
    );
    crown.position.set(topCenterX, topY + crownH / 2, z);
    g.add(crown);

    // --- Glowing storefront at podium level
    if (Math.random() < 0.7) {
      const sp = STOREFRONT_PALETTE[Math.floor(Math.random() * STOREFRONT_PALETTE.length)];
      const sf = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, 0.95, w * 0.55),
        new THREE.MeshStandardMaterial({ color: sp.c, emissive: sp.e, emissiveIntensity: 1.3 })
      );
      sf.position.set(facadeX - side * 0.09, 0.75, z + (Math.random() - 0.5) * w * 0.3);
      g.add(sf);
    }

    // --- Horizontal neon trim band on the inner face (animated)
    if (Math.random() < 0.65) {
      const neonColor = NEON_PALETTE[Math.floor(Math.random() * NEON_PALETTE.length)];
      const trimY = podiumH + 0.4 + Math.random() * Math.max(0.5, bodyH - 1.0);
      const trim = new THREE.Mesh(
        new THREE.BoxGeometry(0.1, 0.14, w + 0.04),
        new THREE.MeshBasicMaterial({ color: neonColor })
      );
      trim.position.set(facadeX - side * 0.11, trimY, z);
      trim.userData.phase = Math.random() * Math.PI * 2;
      trim.userData.baseColor = neonColor;
      g.add(trim);
      animatedNeon.push(trim);
    }

    // --- Vertical neon edge accent on taller buildings (corner light strip)
    if (h > 8 && Math.random() < 0.55) {
      const neonColor = NEON_PALETTE[Math.floor(Math.random() * NEON_PALETTE.length)];
      const edge = new THREE.Mesh(
        new THREE.BoxGeometry(0.08, bodyH - 0.6, 0.18),
        new THREE.MeshBasicMaterial({ color: neonColor })
      );
      const eZ = (Math.random() < 0.5 ? -1 : 1) * (w / 2 - 0.35);
      edge.position.set(facadeX - side * 0.1, podiumH + bodyH / 2, z + eZ);
      edge.userData.phase = Math.random() * Math.PI * 2;
      edge.userData.baseColor = neonColor;
      g.add(edge);
      animatedNeon.push(edge);
    }

    // --- Rooftop billboard with color-cycling face
    if (h > 7 && Math.random() < 0.4) {
      const bbColor = NEON_PALETTE[Math.floor(Math.random() * NEON_PALETTE.length)];
      const bb = new THREE.Mesh(
        new THREE.BoxGeometry(0.14, 1.6, 2.6),
        new THREE.MeshStandardMaterial({
          color: bbColor, emissive: bbColor, emissiveIntensity: 1.4
        })
      );
      const bbX = topCenterX - side * (topD / 2) - side * 0.1;
      bb.position.set(bbX, topY + 1.0, z);
      bb.userData.phase = Math.random() * Math.PI * 2;
      bb.material.emissiveIntensity = 0.9;
      g.add(bb);
      animatedBillboards.push(bb);
      // Billboard frame
      const frameMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.6 });
      const frTop = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.1, 2.7), frameMat);
      frTop.position.set(bbX, topY + 1.85, z); g.add(frTop);
      const frBot = frTop.clone(); frBot.position.y = topY + 0.15; g.add(frBot);
      // Support struts
      const strut = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.7, 0.05), frameMat);
      strut.position.set(bbX, topY + 0.4, z - 0.9);
      g.add(strut);
      const strut2 = strut.clone(); strut2.position.z = z + 0.9; g.add(strut2);
    }

    // --- Antenna/spire on tallest buildings, centered on the crown
    if (h > 12 && Math.random() < 0.4) {
      const spireMat = new THREE.MeshStandardMaterial({ color: 0x666677, metalness: 0.85, roughness: 0.3 });
      const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.1, 2.8, 6), spireMat);
      spire.position.set(topCenterX, topY + 1.4, z);
      g.add(spire);
      // Tip light (red, blinks via animatedNeon)
      const tipLight = new THREE.Mesh(
        new THREE.SphereGeometry(0.13, 6, 6),
        new THREE.MeshBasicMaterial({ color: 0xff3030 })
      );
      tipLight.position.set(topCenterX, topY + 2.85, z);
      tipLight.userData.phase = Math.random() * Math.PI * 2;
      tipLight.userData.baseColor = 0xff3030;
      g.add(tipLight);
      animatedNeon.push(tipLight);
    }
  }
  return g;
}

// Capsule-based limb: pivot at the joint (shoulder/hip), segment extends down
function makeLimb(material, totalLen, radius, jointMat) {
  const pivot = new THREE.Group();
  const cylLen = Math.max(0.02, totalLen - 2 * radius);
  const seg = new THREE.Mesh(new THREE.CapsuleGeometry(radius, cylLen, 4, 10), material);
  seg.position.y = -totalLen / 2;
  seg.castShadow = true;
  pivot.add(seg);
  // Joint cap at top (shoulder/hip sphere — sits at the pivot)
  if (jointMat) {
    const cap = new THREE.Mesh(new THREE.SphereGeometry(radius * 1.18, 12, 10), jointMat);
    cap.castShadow = true;
    pivot.add(cap);
  }
  return pivot;
}

function makeBarrier(lane) {
  const g = new THREE.Group();
  const bar = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.7, 0.35),
    new THREE.MeshStandardMaterial({ color: 0xa85a22, roughness: 0.7 }));
  bar.position.y = 0.55; bar.castShadow = true;
  g.add(bar);
  const stripeMatW = new THREE.MeshStandardMaterial({ color: 0xffffff });
  for (let i = -0.8; i <= 0.8; i += 0.4) {
    const s = new THREE.Mesh(new THREE.BoxGeometry(0.13, 0.7, 0.36), stripeMatW);
    s.position.set(i, 0.55, 0);
    g.add(s);
  }
  const sign = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.1, 0.36),
    new THREE.MeshStandardMaterial({ color: 0xffd700 }));
  sign.position.y = 0.95;
  g.add(sign);
  // Legs
  const legM = new THREE.MeshStandardMaterial({ color: 0x502000 });
  const leg1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1, 0.12), legM);
  leg1.position.set(-1, 0.5, 0); g.add(leg1);
  const leg2 = leg1.clone(); leg2.position.x = 1; g.add(leg2);
  g.position.x = (lane - 1) * LANE_WIDTH;
  scene.add(g);
  return { mesh: g, type: 'barrier', lane };
}

function makeHighBar(lane) {
  const g = new THREE.Group();
  const bar = new THREE.Mesh(new THREE.BoxGeometry(2.4, 0.28, 0.35),
    new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.5, roughness: 0.4 }));
  bar.position.y = 2.3; bar.castShadow = true; g.add(bar);
  const postM = new THREE.MeshStandardMaterial({ color: 0x444444 });
  const postL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 2.4, 0.18), postM);
  postL.position.set(-1.15, 1.2, 0); postL.castShadow = true; g.add(postL);
  const postR = postL.clone(); postR.position.x = 1.15; g.add(postR);
  // Caution triangle
  const sign = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.5, 3),
    new THREE.MeshStandardMaterial({ color: 0xffd700, emissive: 0x554400 }));
  sign.position.y = 2.78;
  g.add(sign);
  g.position.x = (lane - 1) * LANE_WIDTH;
  scene.add(g);
  return { mesh: g, type: 'high-bar', lane };
}

// Flashy paint-job palette for the trains. Blue is first so it's the most common.
const TRAIN_THEMES = [
  { name: 'electric blue', body: 0x1e6cff, dark: 0x0a2a78, neon: 0x33ddff, trim: 0xffd700,  glow: 0x44aaff },
  { name: 'hot pink',      body: 0xff2da0, dark: 0x6a0a50, neon: 0xffe85a, trim: 0xffffff,  glow: 0xff66cc },
  { name: 'lime green',    body: 0x44dd44, dark: 0x115a18, neon: 0xff44cc, trim: 0xffffff,  glow: 0x88ff88 },
  { name: 'cyan',          body: 0x14d4dc, dark: 0x0a4e58, neon: 0xff4488, trim: 0xffffff,  glow: 0x66f0ff },
  { name: 'violet',        body: 0x8830ff, dark: 0x320a78, neon: 0x33ffaa, trim: 0xffd700,  glow: 0xaa66ff },
  { name: 'sunset orange', body: 0xff6a1a, dark: 0x7a2204, neon: 0x33ddff, trim: 0xffd700,  glow: 0xffaa66 },
  { name: 'classic red',   body: 0xdc3322, dark: 0x5a1010, neon: 0xffd700, trim: 0xffd700,  glow: 0xff8866 },
];

function makeTrain(lane) {
  const g = new THREE.Group();
  const TRAIN_BODY_H = 2.4;
  const COACH_LEN    = 7.0;
  const COUPLING_LEN = 0.5;
  const NUM_COACHES  = 15 + Math.floor(Math.random() * 15); // 15-29 coaches (5x longer)
  const TOTAL_LEN    = NUM_COACHES * COACH_LEN + (NUM_COACHES - 1) * COUPLING_LEN;
  const TRAIN_TOP_Y  = TRAIN_BODY_H + 0.15;
  const HALF_TOTAL   = TOTAL_LEN / 2;

  // Pick a flashy color theme for this train (60% chance of blue, otherwise random)
  const theme = Math.random() < 0.45
    ? TRAIN_THEMES[0]
    : TRAIN_THEMES[Math.floor(Math.random() * TRAIN_THEMES.length)];

  // Shared materials — body has a touch of emissive so the paint reads even in dim areas
  const bodyMat   = new THREE.MeshStandardMaterial({
    color: theme.body, roughness: 0.35, metalness: 0.45,
    emissive: theme.body, emissiveIntensity: 0.12
  });
  const roofMat   = new THREE.MeshStandardMaterial({ color: theme.dark, roughness: 0.5, metalness: 0.4 });
  const stripeMat = new THREE.MeshStandardMaterial({
    color: theme.trim, metalness: 0.55, roughness: 0.3,
    emissive: theme.trim, emissiveIntensity: 0.25
  });
  const neonStripMat = new THREE.MeshBasicMaterial({ color: theme.neon });   // emissive neon (always lit)
  const winLitMat = new THREE.MeshStandardMaterial({
    color: 0xfff0c0, emissive: 0xffcc66, emissiveIntensity: 1.1
  });
  const winCoolMat = new THREE.MeshStandardMaterial({
    color: 0xc8e6ff, emissive: 0x66aaff, emissiveIntensity: 0.95
  });
  const doorMat   = new THREE.MeshStandardMaterial({ color: theme.dark, roughness: 0.4, metalness: 0.35 });
  const doorWinMat = new THREE.MeshStandardMaterial({
    color: 0xbbe0ff, emissive: 0x4488cc, emissiveIntensity: 0.9
  });
  const rivetMat   = new THREE.MeshStandardMaterial({ color: theme.trim, metalness: 0.7, roughness: 0.3,
                                                       emissive: theme.trim, emissiveIntensity: 0.3 });
  const couplerMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.5 });
  const tailMat    = new THREE.MeshBasicMaterial({ color: 0xff3030 });

  // Train neon parts — tracked here so they can be removed from animatedNeon when the train despawns
  const trainNeonParts = [];
  function addNeon(m) { animatedNeon.push(m); trainNeonParts.push(m); }

  for (let ci = 0; ci < NUM_COACHES; ci++) {
    // Local z of this coach center: coach 0 is at the front (+z, closest to camera)
    const cz = HALF_TOTAL - COACH_LEN / 2 - ci * (COACH_LEN + COUPLING_LEN);
    const isFront = ci === 0;
    const isBack  = ci === NUM_COACHES - 1;

    // Body
    const body = new THREE.Mesh(new THREE.BoxGeometry(1.9, TRAIN_BODY_H, COACH_LEN), bodyMat);
    body.position.set(0, TRAIN_BODY_H / 2, cz);
    body.castShadow = true; g.add(body);

    // Roof
    const roof = new THREE.Mesh(new THREE.BoxGeometry(1.95, 0.2, COACH_LEN + 0.05), roofMat);
    roof.position.set(0, TRAIN_BODY_H + 0.1, cz); g.add(roof);

    // Gold/contrast side stripe
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(1.91, 0.14, COACH_LEN + 0.01), stripeMat);
    stripe.position.set(0, 1.2, cz); g.add(stripe);

    // NEON underglow strip (low on the side, color-cycling animated)
    for (const sx of [0.97, -0.97]) {
      const ug = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.1, COACH_LEN), neonStripMat);
      ug.position.set(sx, 0.32, cz);
      ug.userData.phase = Math.random() * Math.PI * 2;
      ug.userData.baseColor = theme.neon;
      g.add(ug);
      addNeon(ug);
    }
    // NEON roof-edge piping (top corners) — emissive, also color-cycles
    for (const sx of [0.97, -0.97]) {
      const rp = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.06, COACH_LEN + 0.05), neonStripMat);
      rp.position.set(sx, TRAIN_BODY_H + 0.05, cz);
      rp.userData.phase = Math.random() * Math.PI * 2;
      rp.userData.baseColor = theme.neon;
      g.add(rp);
      addNeon(rp);
    }

    // Side windows — alternating warm/cool lit panels for that "lit-up city train" look
    const winZs = [-2.5, -1.4, 1.4, 2.5];
    for (let i = 0; i < winZs.length; i++) {
      const wz = winZs[i];
      const wMat = (i % 2 === 0) ? winLitMat : winCoolMat;
      const w1 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.55, 0.85), wMat);
      w1.position.set(0.97, 1.75, cz + wz); g.add(w1);
      const w2 = w1.clone(); w2.position.x = -0.97; g.add(w2);
    }
    // Sliding door (with small upper window)
    for (const sx of [0.97, -0.97]) {
      const door = new THREE.Mesh(new THREE.BoxGeometry(0.05, 1.7, 0.95), doorMat);
      door.position.set(sx, 1.0, cz);
      g.add(door);
      const dw = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.4, 0.7), doorWinMat);
      dw.position.set(sx, 1.55, cz);
      g.add(dw);
      // Glowing door frame (thin neon outline)
      const dframe = new THREE.Mesh(new THREE.BoxGeometry(0.07, 1.75, 1.0), neonStripMat);
      dframe.position.set(sx, 1.0, cz);
      dframe.userData.phase = Math.random() * Math.PI * 2;
      dframe.userData.baseColor = theme.neon;
      // Make door frame slightly transparent so the door reads through
      // (BasicMaterial doesn't truly outline; this looks like a glow halo behind the door)
      g.add(dframe);
      addNeon(dframe);
      // Door split line on top
      const split = new THREE.Mesh(new THREE.BoxGeometry(0.075, 1.7, 0.02),
        new THREE.MeshStandardMaterial({ color: 0x000000 }));
      split.position.set(sx, 1.0, cz);
      g.add(split);
    }

    // Animated LED color-cycle bar above each window row on the side
    for (const sx of [0.98, -0.98]) {
      const led = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.06, COACH_LEN - 1.4), neonStripMat);
      led.position.set(sx, 2.12, cz);
      led.userData.phase = Math.random() * Math.PI * 2;
      led.userData.baseColor = theme.neon;
      g.add(led);
      addNeon(led);
    }

    // Coach number plate (with subtle glow)
    const plate = new THREE.Mesh(
      new THREE.BoxGeometry(0.06, 0.2, 0.4),
      new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.4 })
    );
    plate.position.set(0.97, 2.15, cz - COACH_LEN / 2 + 0.4);
    g.add(plate);

    // Front-only details
    if (isFront) {
      const front = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.65, 0.05), winCoolMat);
      front.position.set(0, 1.85, cz + COACH_LEN / 2 + 0.02);
      g.add(front);
      // Twin headlights (bigger and brighter)
      for (const hx of [-0.55, 0.55]) {
        const hl = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12),
          new THREE.MeshBasicMaterial({ color: 0xfff8d8 }));
        hl.position.set(hx, 0.75, cz + COACH_LEN / 2 + 0.03);
        g.add(hl);
        const halo = new THREE.Mesh(new THREE.SphereGeometry(0.34, 12, 10),
          new THREE.MeshBasicMaterial({ color: 0xfff4c0, transparent: true, opacity: 0.4, depthWrite: false }));
        halo.position.copy(hl.position);
        g.add(halo);
      }
      const hlGlow = new THREE.PointLight(0xfff2c0, 0.8, 9);
      hlGlow.position.set(0, 0.8, cz + COACH_LEN / 2 + 0.3);
      g.add(hlGlow);
      // Underglow point light cast on the floor from the front
      const ugLight = new THREE.PointLight(theme.glow, 0.6, 6);
      ugLight.position.set(0, 0.25, cz + COACH_LEN / 2 - 0.5);
      g.add(ugLight);
      // Driver cab indicator
      const cab = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.1, 0.5),
        new THREE.MeshStandardMaterial({ color: 0x000000 }));
      cab.position.set(0, 1.5, cz + COACH_LEN / 2 - 0.3);
      g.add(cab);
      // Big neon route-number panel above the windshield
      const route = new THREE.Mesh(
        new THREE.BoxGeometry(0.9, 0.3, 0.04),
        new THREE.MeshStandardMaterial({ color: 0x222222, emissive: theme.neon, emissiveIntensity: 1.0 })
      );
      route.position.set(0, 2.3, cz + COACH_LEN / 2 + 0.03);
      g.add(route);
    }

    // Back-only details
    if (isBack) {
      // Wider red tail-light bar
      const tailBar = new THREE.Mesh(
        new THREE.BoxGeometry(1.6, 0.16, 0.05),
        new THREE.MeshBasicMaterial({ color: 0xff3030 })
      );
      tailBar.position.set(0, 1.0, cz - COACH_LEN / 2 - 0.02);
      g.add(tailBar);
      for (const tx of [-0.65, 0.65]) {
        const tl = new THREE.Mesh(new THREE.SphereGeometry(0.15, 10, 10), tailMat);
        tl.position.set(tx, 1.0, cz - COACH_LEN / 2 - 0.04);
        g.add(tl);
        const tlHalo = new THREE.Mesh(new THREE.SphereGeometry(0.26, 10, 10),
          new THREE.MeshBasicMaterial({ color: 0xff3030, transparent: true, opacity: 0.35, depthWrite: false }));
        tlHalo.position.copy(tl.position);
        g.add(tlHalo);
      }
      // Back face
      const back = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.55, 0.05), winCoolMat);
      back.position.set(0, 1.85, cz - COACH_LEN / 2 - 0.02);
      g.add(back);
      // Red point light glow behind train
      const redGlow = new THREE.PointLight(0xff3030, 0.5, 6);
      redGlow.position.set(0, 1.0, cz - COACH_LEN / 2 - 0.5);
      g.add(redGlow);
    }

    // Coupling between this coach and the next one back
    if (!isBack) {
      const cup = new THREE.Mesh(
        new THREE.BoxGeometry(0.4, 0.5, COUPLING_LEN),
        couplerMat
      );
      cup.position.set(0, 0.6, cz - COACH_LEN / 2 - COUPLING_LEN / 2);
      g.add(cup);
      // End plates / bellows on each side of the coupling
      for (const ez of [cz - COACH_LEN / 2 - 0.02, cz - COACH_LEN / 2 - COUPLING_LEN + 0.02]) {
        const ep = new THREE.Mesh(
          new THREE.BoxGeometry(1.7, 1.6, 0.05),
          new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 })
        );
        ep.position.set(0, 1.2, ez);
        g.add(ep);
      }
    }

    // Roof rivets — now color-matched to the trim so they pop
    for (let r = -COACH_LEN / 2 + 0.6; r < COACH_LEN / 2; r += 1.2) {
      for (const rx of [-0.7, 0.7]) {
        const rivet = new THREE.Mesh(new THREE.SphereGeometry(0.07, 8, 8), rivetMat);
        rivet.position.set(rx, TRAIN_TOP_Y + 0.05, cz + r);
        g.add(rivet);
      }
    }
  }

  g.position.x = (lane - 1) * LANE_WIDTH;
  scene.add(g);
  return { mesh: g, type: 'train', rideable: true, lane, length: TOTAL_LEN, topY: TRAIN_TOP_Y, coaches: NUM_COACHES, neonParts: trainNeonParts };
}

// Climbable skyscraper — a stepped pyramid of three platforms the player can hop up.
// Returns the tall main tower as the primary obstacle and the two lower steps as `_extras`
// (the spawner places extras at their zOffset relative to the main obstacle).
function makeClimbTower(lane) {
  const themeColor = TRAIN_THEMES[Math.floor(Math.random() * TRAIN_THEMES.length)];
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x1a2236, roughness: 0.45, metalness: 0.5,
    emissive: themeColor.body, emissiveIntensity: 0.08
  });
  const glassFaceMat = new THREE.MeshStandardMaterial({
    color: 0x0a0e16, metalness: 0.85, roughness: 0.22,
    emissive: themeColor.body, emissiveIntensity: 0.35
  });
  const stripMat = new THREE.MeshStandardMaterial({
    color: themeColor.glow, emissive: themeColor.glow, emissiveIntensity: 1.1
  });
  const neonStripMat = new THREE.MeshBasicMaterial({ color: themeColor.neon });
  const trimMat = new THREE.MeshStandardMaterial({
    color: themeColor.trim, metalness: 0.7, roughness: 0.3,
    emissive: themeColor.trim, emissiveIntensity: 0.4
  });

  // Helper that builds a single rectangular tier (visible building + roof + a few details)
  // Returns a group so it can be added to the scene as its own obstacle.
  function makeTier(h, w, d, opts) {
    const g = new THREE.Group();
    // Main body
    const body = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bodyMat);
    body.position.y = h / 2;
    body.castShadow = true;
    body.receiveShadow = true;
    g.add(body);
    // Front glass face (the side the player approaches)
    const face = new THREE.Mesh(
      new THREE.BoxGeometry(w * 0.86, h * 0.9, 0.12),
      glassFaceMat
    );
    face.position.set(0, h / 2, d / 2 + 0.05);
    g.add(face);
    // Horizontal glowing window strips along the front
    const stripRows = Math.max(2, Math.floor(h / 1.0));
    for (let r = 0; r < stripRows; r++) {
      const sy = (r + 0.5) * (h / stripRows);
      const strip = new THREE.Mesh(
        new THREE.BoxGeometry(w * 0.82, 0.18, 0.06),
        stripMat
      );
      strip.position.set(0, sy, d / 2 + 0.13);
      g.add(strip);
    }
    // Roof slab + parapet (gives a defined walking surface on top)
    const roof = new THREE.Mesh(new THREE.BoxGeometry(w + 0.1, 0.16, d + 0.1), trimMat);
    roof.position.y = h + 0.08;
    g.add(roof);
    // Neon roof piping (animated, color-cycles via animatedNeon)
    const pipe = new THREE.Mesh(new THREE.BoxGeometry(w + 0.15, 0.06, d + 0.15), neonStripMat);
    pipe.position.y = h + 0.18;
    pipe.userData.phase = Math.random() * Math.PI * 2;
    pipe.userData.baseColor = themeColor.neon;
    g.add(pipe);
    animatedNeon.push(pipe);
    // Optional spire / antenna on the tallest tier
    if (opts && opts.spire) {
      const spireMat = new THREE.MeshStandardMaterial({
        color: 0x444454, metalness: 0.8, roughness: 0.3
      });
      const spire = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.1, 1.4, 6), spireMat);
      spire.position.y = h + 0.85;
      g.add(spire);
      // Blinking warning light on the spire (red, pulses via animatedNeon)
      const warn = new THREE.Mesh(
        new THREE.SphereGeometry(0.13, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xff3030 })
      );
      warn.position.y = h + 1.6;
      warn.userData.phase = Math.random() * Math.PI * 2;
      warn.userData.baseColor = 0xff3030;
      g.add(warn);
      animatedNeon.push(warn);
    }
    // Add tier to scene
    scene.add(g);
    return { mesh: g, neonExtras: [pipe] };
  }

  // Build three tiers stacked into a stepped pyramid.
  // Visual depth is intentionally smaller than the collision footprint (`length`)
  // so the first jump onto step 1 has a generous timing window and the auto-climb
  // chains through each tier without the player needing precise jumps.
  const STEP1_H = 1.5, STEP1_VIS_D = 2.6, STEP1_LEN = 4.0;
  const STEP2_H = 2.9, STEP2_VIS_D = 2.6, STEP2_LEN = 4.0;
  const TOWER_H = 5.2, TOWER_VIS_D = 3.6, TOWER_LEN = 5.0;
  // Step 1 (front-most, lowest)
  const step1 = makeTier(STEP1_H, 1.6, STEP1_VIS_D, {});
  step1.mesh.position.x = (lane - 1) * LANE_WIDTH;
  // Step 2 (mid, taller)
  const step2 = makeTier(STEP2_H, 1.75, STEP2_VIS_D, {});
  step2.mesh.position.x = (lane - 1) * LANE_WIDTH;
  // Main skyscraper tower (highest, big roof + spire)
  const tower = makeTier(TOWER_H, 1.9, TOWER_VIS_D, { spire: true });
  tower.mesh.position.x = (lane - 1) * LANE_WIDTH;

  const towerObs = {
    mesh: tower.mesh, type: 'tower', rideable: true, lane,
    topY: TOWER_H, length: TOWER_LEN,
    neonParts: tower.neonExtras
  };
  const step2Obs = {
    mesh: step2.mesh, type: 'tower', rideable: true, lane,
    topY: STEP2_H, length: STEP2_LEN,
    neonParts: step2.neonExtras,
    _dz: 1.8  // in front of the main tower
  };
  const step1Obs = {
    mesh: step1.mesh, type: 'tower', rideable: true, lane,
    topY: STEP1_H, length: STEP1_LEN,
    neonParts: step1.neonExtras,
    _dz: 3.8  // in front of step 2
  };
  // Return main + two extras the spawner will position relative to lastSpawnZ
  return Object.assign(towerObs, { _extras: [step2Obs, step1Obs] });
}

// Remove a train's neon parts from the global animatedNeon array so the loop doesn't keep ticking on despawned trains
function cleanupTrainNeon(o) {
  if (!o || !o.neonParts) return;
  for (const np of o.neonParts) {
    const idx = animatedNeon.indexOf(np);
    if (idx !== -1) animatedNeon.splice(idx, 1);
  }
  o.neonParts.length = 0;
}

function makeCan(lane) {
  const g = new THREE.Group();
  const can = new THREE.Mesh(
    new THREE.CylinderGeometry(0.42, 0.46, 1.0, 14),
    new THREE.MeshStandardMaterial({ color: 0x4a5a6a, roughness: 0.55, metalness: 0.55 })
  );
  can.position.y = 0.5; can.castShadow = true; g.add(can);
  // Lid
  const lid = new THREE.Mesh(
    new THREE.CylinderGeometry(0.44, 0.44, 0.1, 14),
    new THREE.MeshStandardMaterial({ color: 0x2a3a4a, roughness: 0.6, metalness: 0.6 })
  );
  lid.position.y = 1.05; g.add(lid);
  // Trash bag bulging
  const bag = new THREE.Mesh(
    new THREE.SphereGeometry(0.36, 10, 10),
    new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.95 })
  );
  bag.position.y = 1.22; bag.scale.y = 0.7; g.add(bag);
  // Vertical seam (rim)
  const rim = new THREE.Mesh(
    new THREE.TorusGeometry(0.43, 0.03, 6, 14),
    new THREE.MeshStandardMaterial({ color: 0x1a2a3a })
  );
  rim.rotation.x = Math.PI / 2;
  rim.position.y = 0.3;
  g.add(rim);
  g.position.x = (lane - 1) * LANE_WIDTH;
  scene.add(g);
  return { mesh: g, type: 'can', lane };
}

function makeCrate(lane) {
  const g = new THREE.Group();
  const crate = new THREE.Mesh(
    new THREE.BoxGeometry(1.3, 1.3, 1.3),
    new THREE.MeshStandardMaterial({ color: 0x8a5a2a, roughness: 0.85 })
  );
  crate.position.y = 0.65; crate.castShadow = true; g.add(crate);
  // Dark slats around the box
  const slatMat = new THREE.MeshStandardMaterial({ color: 0x4a2a10 });
  for (const y of [1.1, 0.65, 0.2]) {

    s.position.y = y; g.add(s);
  }
  // Edge brackets
  for (const sx of [-0.65, 0.65]) for (const sz of [-0.65, 0.65]) {

    e.position.set(sx, 0.65, sz); g.add(e);

  // Stamp

}

function makeSign(lane) {

  const g = new THREE.Group();

  const chainMat = new THREE.MeshStandardMaterial({ color: 0x666666, metalness: 0.8, roughness: 0.4 });
  for (const x of [-0.95, 0.95]) {

    chain.position.set(x, 3.5, 0); g.add(chain);
